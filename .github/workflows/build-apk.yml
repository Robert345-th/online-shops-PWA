name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Add APK_KEYSTORE_BASE64 to repo Secrets before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          echo "Restored android.keystore from secret."

      - name: Install Bubblewrap
        working-directory: android
        run: npm install

      - name: Configure Bubblewrap paths
        run: |
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_PATH" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Sync TWA project
        working-directory: android
        run: npx bubblewrap update --manifest twa-manifest.json --skipPwaValidation --skipVersionUpgrade

      - name: Patch WebView location handling
        working-directory: android
        run: node patch-offline-shell.js && node patch-webview-location.js && node patch-version.js

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: npx bubblewrap build --skipPwaValidation

      - name: Copy APK to public folder
        run: node android/copy-apk.js

      - name: Verify APK was built
        run: |
          ls -la public/zedmarket.apk android/*.apk android/app/build/outputs/apk/release/ 2>/dev/null || true
          test -s public/zedmarket.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("public/zedmarket.apk") as z:
            blob = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
          for needle in (b"webview", b"customtabs", b"bubblewrap"):
            print(needle.decode(), "FOUND" if needle in blob.lower() else "missing")
          PY

      - name: Update app link fingerprint for this APK
        env:
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: node android/update-assetlinks.js

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedmarket-apk
          path: public/zedmarket.apk

      - name: Upload AAB for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: zedmarket-aab
          path: android/app-release-bundle.aab
          if-no-files-found: warn

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zedmarket.apk public/.well-known/assetlinks.json
          if git diff --staged --quiet public/zedmarket.apk; then
            echo "ERROR: APK on disk matches the old committed file. Build did not produce a new APK."
            exit 1
          fi
          git commit -m "Update ZedMarket download APK v1.0.2."
          git push
