name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android/android.keystore
          key: zedmarket-android-keystore-v1

      - name: Install Bubblewrap
        working-directory: android
        run: npm install

      - name: Configure Bubblewrap paths
        run: |
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_PATH" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Create signing keystore
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "Add APK_KEYSTORE_PASSWORD to repo Secrets before running this workflow."
            exit 1
          fi
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -alias zedmarket -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 -keystore android.keystore \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=ZedMarket, OU=Mobile, O=ZedMarket, L=Lusaka, ST=Lusaka, C=ZM"
          fi

      - name: Sync TWA project
        working-directory: android
        run: npx bubblewrap update --manifest twa-manifest.json --skipPwaValidation --skipVersionUpgrade

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: npx bubblewrap build --skipPwaValidation

      - name: Copy APK to public folder
        run: node android/copy-apk.js

      - name: Update asset links for full-screen TWA
        env:
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: node android/update-assetlinks.js

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedmarket-apk
          path: public/zedmarket.apk

      - name: Upload AAB for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: zedmarket-aab
          path: android/app-release-bundle.aab
          if-no-files-found: warn

      - name: Commit APK and asset links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zedmarket.apk public/.well-known/assetlinks.json
          git diff --staged --quiet || git commit -m "Update ZedMarket APK and Android app links."
          git push
