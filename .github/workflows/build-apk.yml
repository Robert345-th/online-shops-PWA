name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        working-directory: android
        run: npm install

      - name: Configure Bubblewrap paths
        working-directory: android
        run: |
          npx bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Create signing keystore
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "Add APK_KEYSTORE_PASSWORD to repo Secrets before running this workflow."
            exit 1
          fi
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -alias zedmarket -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 -keystore android.keystore \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=ZedMarket, OU=Mobile, O=ZedMarket, L=Lusaka, ST=Lusaka, C=ZM"
          fi

      - name: Sync TWA project
        working-directory: android
        run: npx bubblewrap update --manifest twa-manifest.json --skipPwaValidation

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: npx bubblewrap build --skipPwaValidation

      - name: Copy APK to public folder
        run: node android/copy-apk.js

      - name: Print SHA-256 fingerprint (update assetlinks.json)
        working-directory: android
        run: npx bubblewrap fingerprint list

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedmarket-apk
          path: public/zedmarket.apk

      - name: Commit APK for download page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zedmarket.apk
          git diff --staged --quiet || git commit -m "Add ZedMarket APK for download page."
          git push
