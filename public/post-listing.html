<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Post a Listing</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  .label { font-size: 11px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 14px; }
  textarea.field-input { height: 80px; resize: vertical; }

  .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .photo-thumb-wrap { width: 80px; height: 80px; border-radius: 10px; overflow: hidden; position: relative; }
  .photo-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .remove-btn { position: absolute; top: 3px; right: 3px; background: rgba(17,17,17,0.7); width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
  .add-photo-box { width: 80px; height: 80px; border: 2px dashed var(--orange); border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--card); cursor: pointer; color: var(--price-red); font-weight: 600; font-size: 11px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }

  .extra-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .extra-box-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; }

  .loc-button { width: 100%; background: var(--card); border: 1px solid var(--red-btn); border-radius: 10px; padding: 12px; text-align: center; color: var(--price-red); font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
  .loc-hint { font-size: 12px; color: var(--price-red); line-height: 1.4; margin-bottom: 12px; display: none; }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .submit-btn:disabled { opacity: 0.7; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; }
  .pending-icon { font-size: 48px; margin-bottom: 12px; }
  .pending-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .pending-text { font-size: 13px; color: var(--subtext); text-align: center; margin-bottom: 20px; }
  .back-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div id="app"></div>

<script src="/js/location.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CLOUDINARY_CLOUD_NAME = "kstg72vx";
  const CLOUDINARY_UPLOAD_PRESET = "online_shops_uploads";
  const MAX_PHOTOS = 5;
  const CATEGORY_OPTIONS = [
    { label: "Electronics", id: 1 },
    { label: "Clothing", id: 2 },
    { label: "Furniture", id: 3 },
    { label: "Produce", id: 4 },
    { label: "Cars", id: 5 },
    { label: "Land", id: 6 },
  ];

  const app = document.getElementById("app");
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");

  let photos = [];
  let categoryId = CATEGORY_OPTIONS[0].id;
  let condition = null;
  let landUnit = "acres";
  let coords = null;
  let locationLabel = "";
  let gettingLocation = false;
  let sellingType = localStorage.getItem("zm_selling_type") || "";
  let shopLocationLabel = "";
  let homeLocationLabel = "";
  let listingFrom = null;

  function loadSavedListingLocation() {
    try {
      shopLocationLabel = localStorage.getItem("zm_shop_location_label") || "";
      homeLocationLabel = localStorage.getItem("zm_home_selling_label")
        || localStorage.getItem("zm_user_location_label")
        || "";
      const raw = localStorage.getItem("zm_home_location");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValidCoords(parsed)) coords = parsed;
      }
      if (sellingType === "shop" && shopLocationLabel) {
        locationLabel = shopLocationLabel;
        listingFrom = "shop";
      } else if (sellingType === "home" && homeLocationLabel) {
        locationLabel = homeLocationLabel;
        listingFrom = "home";
      } else if (sellingType === "both") {
        locationLabel = "";
        listingFrom = null;
      } else {
        locationLabel = shopLocationLabel || homeLocationLabel || "";
      }
    } catch {
      /* ignore */
    }
  }

  function applyListingFrom(from) {
    listingFrom = from;
    locationLabel = from === "shop" ? shopLocationLabel : homeLocationLabel;
    document.querySelectorAll("[data-from]").forEach((el) =>
      el.classList.toggle("active", el.dataset.from === from)
    );
    const locInput = document.getElementById("locationInput");
    if (locInput) locInput.value = locationLabel;
    const locBtn = document.getElementById("locButton");
    if (locBtn && locationLabel) locBtn.textContent = `📍 ${locationLabel}`;
  }

  loadSavedListingLocation();

  function selectedCategory() {
    return CATEGORY_OPTIONS.find(c => c.id === categoryId)?.label;
  }

  if (user?.account_type === "shop" && user?.shop_status !== "approved") {
    const message = user.shop_status === "rejected"
      ? "Your shop application was not approved. Please contact support for more information."
      : "Your shop is still being reviewed. You'll be notified once it's approved and you can start posting.";
    app.innerHTML = `
      <div class="center-box">
        <div class="pending-icon">⏳</div>
        <div class="pending-title">Shop Under Review</div>
        <div class="pending-text">${message}</div>
        <button class="back-btn" onclick="window.location.href='/my-shop.html'">Go Back</button>
      </div>`;
  } else if (!token) {
    window.location.href = "/login.html";
  } else {
    renderForm();
  }

  function renderForm() {
    app.innerHTML = `
      <div class="content">
        <div class="title">Post a Listing</div>

        <div class="label">Photos (<span id="photoCount">0</span>/${MAX_PHOTOS})</div>
        <div class="photo-grid" id="photoGrid">
          <label class="add-photo-box" id="addPhotoBox">+ Add
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;" />
          </label>
        </div>

        <div class="label">Title</div>
        <input class="field-input" id="titleInput" placeholder="e.g. iPhone 11, 64GB" />

        <div class="label">Price (ZMW)</div>
        <input class="field-input" id="priceInput" type="number" placeholder="e.g. 1850" />

        <div class="label">Condition</div>
        <div class="chip-row" id="conditionRow">
          <div class="chip" data-cond="New">New</div>
          <div class="chip" data-cond="Pre-owned">Pre-owned</div>
        </div>

        <div class="label">Category</div>
        <div class="chip-row" id="categoryRow"></div>

        <div id="extraFields"></div>

        <div class="label">Description</div>
        <textarea class="field-input" id="descInput" placeholder="Describe condition, age, reason for selling..."></textarea>

        ${sellingType === "both" ? `
        <div class="label">Where is this item?</div>
        <div class="chip-row" id="listingFromRow">
          <div class="chip" data-from="shop">At my shop</div>
          <div class="chip" data-from="home">From home</div>
        </div>
        ` : ""}

        <div class="label">Location</div>
        <div class="loc-button" id="locButton">📍 Use my current location</div>
        <input class="field-input" id="locationInput" placeholder="Or type your area (e.g. Lusaka, Kabulonga)" style="margin-top:8px;" />

        <button class="submit-btn" id="submitBtn">Post Listing</button>
      </div>`;

    renderPhotoGrid();
    renderCategoryChips();
    renderExtraFields();

    document.querySelectorAll("[data-cond]").forEach(el =>
      el.addEventListener("click", () => { condition = el.dataset.cond; updateConditionChips(); })
    );

    document.getElementById("addPhotoBox").addEventListener("click", (e) => {
      if (photos.length >= MAX_PHOTOS) { e.preventDefault(); alert(`You can add up to ${MAX_PHOTOS} photos.`); }
    });
    document.getElementById("photoInput").addEventListener("change", handlePhotoSelect);
    document.getElementById("locButton").addEventListener("click", handleUseLocation);
    document.getElementById("locationInput").addEventListener("input", (e) => {
      locationLabel = e.target.value.trim();
    });
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);

    if (sellingType === "both") {
      document.querySelectorAll("[data-from]").forEach((el) =>
        el.addEventListener("click", () => applyListingFrom(el.dataset.from))
      );
    }

    if (locationLabel) {
      const locInput = document.getElementById("locationInput");
      if (locInput) locInput.value = locationLabel;
      const locBtn = document.getElementById("locButton");
      if (locBtn && coords) locBtn.textContent = `📍 ${locationLabel}`;
    }
  }

  function updateConditionChips() {
    document.querySelectorAll("[data-cond]").forEach(el =>
      el.classList.toggle("active", el.dataset.cond === condition)
    );
  }

  function renderCategoryChips() {
    const row = document.getElementById("categoryRow");
    row.innerHTML = CATEGORY_OPTIONS.map(c =>
      `<div class="chip ${categoryId === c.id ? "active" : ""}" data-cat="${c.id}">${c.label}</div>`
    ).join("");
    row.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => {
        categoryId = parseInt(el.dataset.cat);
        renderCategoryChips();
        renderExtraFields();
      })
    );
  }

  function renderExtraFields() {
    const box = document.getElementById("extraFields");
    const cat = selectedCategory();
    if (cat === "Cars") {
      box.innerHTML = `
        <div class="extra-box">
          <div class="extra-box-title">🚗 Car Details</div>
          <div class="label">Make</div>
          <input class="field-input" id="carMake" placeholder="e.g. Toyota" />
          <div class="label">Model</div>
          <input class="field-input" id="carModel" placeholder="e.g. Vitz" />
          <div class="label">Year</div>
          <input class="field-input" id="carYear" type="number" placeholder="e.g. 2015" />
          <div class="label">Mileage (km)</div>
          <input class="field-input" id="carMileage" type="number" placeholder="e.g. 78000" />
        </div>`;
    } else if (cat === "Land") {
      box.innerHTML = `
        <div class="extra-box">
          <div class="extra-box-title">🌳 Land Details</div>
          <div class="label">Size</div>
          <input class="field-input" id="landSize" type="number" placeholder="e.g. 2" />
          <div class="label">Unit</div>
          <div class="chip-row" id="landUnitRow">
            <div class="chip ${landUnit === "acres" ? "active" : ""}" data-unit="acres">Acres</div>
            <div class="chip ${landUnit === "plots" ? "active" : ""}" data-unit="plots">Plots</div>
          </div>
          <div class="label">Title Deed Status</div>
          <input class="field-input" id="landDeedStatus" placeholder="e.g. Titled / Not titled" />
        </div>`;
      document.querySelectorAll("[data-unit]").forEach(el =>
        el.addEventListener("click", () => {
          landUnit = el.dataset.unit;
          document.querySelectorAll("[data-unit]").forEach(x => x.classList.toggle("active", x.dataset.unit === landUnit));
        })
      );
    } else {
      box.innerHTML = "";
    }
  }

  function renderPhotoGrid() {
    const grid = document.getElementById("photoGrid");
    document.getElementById("photoCount").textContent = photos.length;
    const addBox = document.getElementById("addPhotoBox")?.outerHTML || `<label class="add-photo-box" id="addPhotoBox">+ Add<input type="file" id="photoInput" accept="image/*" multiple style="display:none;" /></label>`;

    grid.innerHTML = photos.map(p => `
      <div class="photo-thumb-wrap">
        <img src="${p.uri}" />
        ${p.uploading ? `<div class="photo-overlay">…</div>` : ""}
        <button class="remove-btn" data-uri="${p.uri}">✕</button>
      </div>
    `).join("") + (photos.length < MAX_PHOTOS ? addBox : "");

    document.querySelectorAll(".remove-btn").forEach(btn =>
      btn.addEventListener("click", () => { photos = photos.filter(p => p.uri !== btn.dataset.uri); renderPhotoGrid(); })
    );
    const input = document.getElementById("photoInput");
    if (input) input.addEventListener("change", handlePhotoSelect);
    const addBoxEl = document.getElementById("addPhotoBox");
    if (addBoxEl) addBoxEl.addEventListener("click", (e) => {
      if (photos.length >= MAX_PHOTOS) { e.preventDefault(); alert(`You can add up to ${MAX_PHOTOS} photos.`); }
    });
  }

  function handlePhotoSelect(e) {
    const files = Array.from(e.target.files).slice(0, MAX_PHOTOS - photos.length);
    files.forEach(file => {
      const uri = URL.createObjectURL(file);
      photos.push({ uri, url: null, uploading: true, file });
      uploadToCloudinary(file, uri);
    });
    renderPhotoGrid();
  }

  async function uploadToCloudinary(file, uri) {
    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });
      const data = await res.json();

      const p = photos.find(p => p.uri === uri);
      if (p) { p.url = data.secure_url || null; p.uploading = false; }

      if (!data.secure_url) alert("One of your photos could not be uploaded.");
      renderPhotoGrid();
    } catch (e) {
      const p = photos.find(p => p.uri === uri);
      if (p) p.uploading = false;
      alert("Could not upload one of the photos.");
      renderPhotoGrid();
    }
  }

  async function handleUseLocation() {
    if (gettingLocation) return;
    gettingLocation = true;
    const btn = document.getElementById("locButton");
    btn.textContent = "Getting location…";

    try {
      const { lat, lng } = await getDeviceCoords();
      coords = { lat, lng };
      locationLabel = await reverseGeocodeLabel(lat, lng);
      btn.textContent = `📍 ${locationLabel}`;
    } catch {
      coords = null;
      btn.textContent = "📍 Use my current location";
    } finally {
      gettingLocation = false;
    }
  }

  async function handleSubmit() {
    const title = document.getElementById("titleInput").value.trim();
    const price = document.getElementById("priceInput").value;
    const description = document.getElementById("descInput").value.trim();

    if (!title || !price) { alert("Title and price are required."); return; }
    if (!condition) { alert("Please select whether the item is New or Pre-owned."); return; }
    if (sellingType === "both" && !listingFrom) {
      alert("Please choose whether this item is at your shop or from home.");
      return;
    }
    const manualLocation = document.getElementById("locationInput")?.value.trim() || "";
    if (!coords && manualLocation) {
      locationLabel = manualLocation;
    }
    if (!coords && !locationLabel) {
      alert('Please add your location — tap "Use my location" or type your area.');
      return;
    }
    if (photos.some(p => p.uploading)) { alert("Photos are still uploading."); return; }

    const cat = selectedCategory();
    let carMake, carModel, carYear, carMileage, landSize, landDeedStatus;
    if (cat === "Cars") {
      carMake = document.getElementById("carMake").value.trim();
      carModel = document.getElementById("carModel").value.trim();
      carYear = document.getElementById("carYear").value;
      carMileage = document.getElementById("carMileage").value;
      if (!carMake || !carModel) { alert("Please fill in the car make and model."); return; }
    }
    if (cat === "Land") {
      landSize = document.getElementById("landSize").value;
      landDeedStatus = document.getElementById("landDeedStatus").value.trim();
      if (!landSize) { alert("Please fill in the land size."); return; }
    }

    const body = {
      title, description,
      price: parseFloat(price),
      category_id: categoryId,
      condition,
      photos: photos.map(p => p.url).filter(Boolean),
      location_label: locationLabel,
    };
    if (listingFrom) body.listing_from = listingFrom;
    if (coords) {
      body.latitude = coords.lat;
      body.longitude = coords.lng;
    }

    if (cat === "Cars") {
      body.car_details = { make: carMake, model: carModel, year: carYear ? parseInt(carYear) : null, mileage: carMileage ? parseInt(carMileage) : null };
    }
    if (cat === "Land") {
      body.land_details = { size: parseFloat(landSize), size_unit: landUnit, title_deed_status: landDeedStatus };
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";

    try {
      const res = await fetch(`${API_URL}/listings`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      alert("Listing posted! Your item is now live.");
      window.location.href = "/index.html";
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Post Listing";
    }
  }
</script>
</body>
</html>
