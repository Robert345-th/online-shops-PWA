<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Wanted Board</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .header-title svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .my-posts-btn {
    background: rgba(245, 197, 24, 0.15); border: 1px solid rgba(245, 197, 24, 0.5); color: var(--gold);
    border-radius: 20px; padding: 8px 12px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  .explainer-box {
    background: var(--warn-bg); padding: 12px 14px; margin: 16px auto 0;
    width: calc(100% - 32px); max-width: 528px; border-radius: 12px; border: 1px solid #F0D0A8;
  }
  body.dark .explainer-box { border-color: var(--border); }
  .explainer-text { font-size: 12px; color: var(--warn-text); line-height: 1.45; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); text-align: center; margin-bottom: 16px; }
  .empty-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list {
    display: flex; flex-direction: column; gap: 20px;
    padding: 16px 16px 110px; max-width: 560px; margin: 0 auto;
  }
  .card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 16px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-title { font-size: 16px; font-weight: 800; flex: 1; line-height: 1.3; }
  .card-budget { font-size: 15px; font-weight: 800; color: var(--price-red); white-space: nowrap; }
  .card-desc {
    font-size: 13px; color: var(--subtext); margin-top: 8px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .badge { background: var(--black); color: var(--gold); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .card-meta { font-size: 12px; color: var(--subtext); }
  .card-footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .poster-av {
    width: 28px; height: 28px; border-radius: 14px; background: var(--red-btn); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0;
  }
  .poster-name { font-size: 12px; color: var(--subtext); font-weight: 600; }
  .respond-btn, .close-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; padding: 12px; width: 100%; margin-top: 14px;
    font-weight: 800; font-size: 13px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .respond-btn { background: var(--black); color: var(--gold); }
  .respond-btn svg, .close-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .close-btn { background: #2F4F3E; color: #fff; }
  .close-btn:disabled { opacity: 0.7; }

  .fab {
    position: fixed; bottom: 72px; left: 20px; right: 20px; max-width: 520px; margin: 0 auto;
    background: var(--black); border: none; border-radius: 30px; padding: 16px; text-align: center;
    color: var(--gold); font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
</style>
</head>
<body data-nav-active="wanted">
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div class="topbar">
  <button class="back-button" onclick="history.back()" data-i18n-aria="back" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span data-i18n="wanted_board">Wanted Board</span></div>
  <button type="button" class="my-posts-btn" id="myWantedBtn" data-i18n="my_wanted_posts">My Posts</button>
</div>

<div class="explainer-box">
  <div class="explainer-text" data-i18n="wanted_explainer">Post what you're looking for, and sellers who have it can message you directly.</div>
</div>

<div id="content"><div class="center-box"><div class="spinner"></div></div></div>

<button class="fab" onclick="window.location.href='/post-wanted.html'" data-i18n="post_wanted">+ Post What You Want</button>

<script src="/js/lang.js"></script>
<script src="/js/bottom-nav.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");
  const content = document.getElementById("content");
  let posts = [];

  document.getElementById("myWantedBtn").addEventListener("click", () => {
    if (!token) { window.location.href = "/login.html"; return; }
    window.location.href = "/my-wanted.html";
  });

  async function loadPosts() {
    try {
      const res = await fetch(`${API_URL}/wanted`);
      posts = await res.json();
      render();
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">${t("wanted_load_fail")}</div></div>`;
    }
  }

  function renderEmpty() {
    content.innerHTML = `
      <div class="center-box">
        <div class="empty-text">${t("wanted_empty")}</div>
        <button type="button" class="empty-btn" onclick="window.location.href='/post-wanted.html'">${t("post_wanted")}</button>
      </div>`;
  }

  function render() {
    if (!posts.length) {
      renderEmpty();
      return;
    }
    content.innerHTML = `<div class="list">${posts.map(renderCard).join("")}</div>`;

    posts.forEach(post => {
      const isMine = user && post.user_id === user.id;
      const btn = document.getElementById(`action-${post.id}`);
      if (btn) {
        btn.addEventListener("click", () => isMine ? handleClosePost(post.id) : handleRespond(post));
      }
    });
  }

  function renderCard(post) {
    const isMine = user && post.user_id === user.id;
    const name = post.poster_name || "";
    const initial = (name.trim().charAt(0) || "?").toUpperCase();
    const hasMeta = post.category || post.location_label;
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${post.title}</div>
          ${post.budget ? `<div class="card-budget">K${post.budget}</div>` : ""}
        </div>
        ${post.description ? `<div class="card-desc">${post.description}</div>` : ""}
        ${hasMeta ? `<div class="card-meta-row">
          ${post.category ? `<div class="badge">${post.category}</div>` : ""}
          ${post.location_label ? `<div class="card-meta">${post.location_label}</div>` : ""}
        </div>` : ""}
        <div class="card-footer">
          <div class="poster-av">${initial}</div>
          <div class="poster-name">${name || "Someone"}</div>
        </div>
        ${isMine
          ? `<button class="close-btn" id="action-${post.id}">${t("mark_found")}</button>`
          : `<button class="respond-btn" id="action-${post.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.92 2 11.75c0 2.48 1.22 4.72 3.2 6.28-.2 1.55-1.02 3.12-2.45 4.22 2.12-.18 3.86-1.1 5.02-1.92 1.3.37 2.72.57 4.23.57 5.52 0 10-3.92 10-8.75S17.52 3 12 3z"/></svg>${t("wanted_i_have_this")}</button>`}
      </div>`;
  }

  function handleRespond(post) {
    if (!user) { window.location.href = "/login.html"; return; }
    if (post.user_id === user.id) { alert(t("wanted_own_post")); return; }
    window.location.href = `/chat-room.html?userId=${post.user_id}&name=${encodeURIComponent(post.poster_name || "")}&wantedTitle=${encodeURIComponent(post.title || "")}${post.budget ? `&wantedBudget=${encodeURIComponent(post.budget)}` : ""}`;
  }

  async function handleClosePost(postId) {
    if (!confirm(t("wanted_close_confirm"))) return;
    const btn = document.getElementById(`action-${postId}`);
    btn.disabled = true;
    btn.textContent = t("wanted_updating");
    try {
      await fetch(`${API_URL}/wanted/${postId}/close`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });
      posts = posts.filter(p => p.id !== postId);
      render();
    } catch (e) {
      alert(t("wanted_update_fail"));
      btn.disabled = false;
      btn.textContent = t("mark_found");
    }
  }

  window.addEventListener("langchange", () => {
    if (!posts.length) renderEmpty();
    else render();
  });

  loadPosts();
</script>
</body>
</html>
