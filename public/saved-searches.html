<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Saved searches</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<style>
  :root { --bg:#F4F1EC; --card:#fff; --border:#E2E0DC; --text:#211D1A; --subtext:#5C5955; --black:#111; --gold:#F5C518; --price-red:#A3131C; }
  body.dark { --bg:#121212; --card:#1E1E1E; --border:#333; --text:#F0EDE8; --subtext:#A8A29B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
  .topbar { background:var(--black); padding:16px; display:flex; align-items:center; gap:12px; }
  .back-button { width:40px; height:40px; background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .back-button svg { width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .header-title { color:var(--gold); font-size:18px; font-weight:700; }
  .content { padding:16px; max-width:560px; margin:0 auto; }
  .hint { font-size:13px; color:var(--subtext); margin-bottom:16px; line-height:1.45; }
  .row { background:var(--card); border:2px solid var(--border); padding:14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .row-title { font-size:14px; font-weight:800; }
  .row-sub { font-size:11px; color:var(--subtext); margin-top:4px; }
  .del { background:none; border:2px solid var(--text); padding:8px 10px; font-size:11px; font-weight:800; cursor:pointer; text-transform:uppercase; }
  .center-box { padding:60px 20px; text-align:center; color:var(--subtext); }
</style>
</head>
<body>
<script>document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode")==="true");</script>
<div class="topbar">
  <button class="back-button" type="button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title" data-i18n="save_search_title">Saved searches</div>
</div>
<div class="content">
  <div class="hint" data-i18n="save_search_sub">Get a ping when a new listing matches.</div>
  <div id="list"><div class="center-box" data-i18n="loading">Loading…</div></div>
</div>
<script src="/js/lang.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  if (!token) window.location.href = "/login.html?next=/saved-searches.html";

  function labelFor(item) {
    const parts = [];
    if (item.query) parts.push(item.query);
    if (item.category && item.category !== "All") parts.push(item.category);
    if (item.city) parts.push(item.city);
    if (item.max_price) parts.push(`≤ K${item.max_price}`);
    return parts.join(" · ") || t("save_search");
  }

  async function load() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(`${API_URL}/saved-searches`, { headers: { Authorization: `Bearer ${token}` } });
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) {
        list.innerHTML = `<div class="center-box">${t("save_search_empty")}</div>`;
        return;
      }
      list.innerHTML = rows.map((item) => `
        <div class="row">
          <div>
            <div class="row-title">${labelFor(item)}</div>
            <div class="row-sub">${item.category && item.category !== "All" ? item.category : ""} ${item.max_price ? "· K" + item.max_price : ""}</div>
          </div>
          <button class="del" type="button" data-id="${item.id}">${t("save_search_delete")}</button>
        </div>`).join("");
      list.querySelectorAll(".del").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await fetch(`${API_URL}/saved-searches/${btn.dataset.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
          load();
        });
      });
    } catch (e) {
      list.innerHTML = `<div class="center-box">${t("feed_error")}</div>`;
    }
  }
  applyTranslations(document);
  load();
</script>
</body>
</html>
