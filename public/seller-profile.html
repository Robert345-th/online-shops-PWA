<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Shop Profile</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
    --approved-bg: #2F4F3E;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .center-box { display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
  .error-text { color: var(--price-red); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
  .avatar { width: 72px; height: 72px; border-radius: 0; background: var(--black); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: var(--gold); font-size: 30px; font-weight: 900; }
  .name { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; }
  .follow-counts {
    margin-top: 8px; font-size: 13px; color: var(--subtext);
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  }
  .follow-count-link {
    color: var(--text); text-decoration: none; cursor: pointer; background: none; border: none;
    font: inherit; padding: 0;
  }
  .follow-count-num { font-weight: 800; }
  .follow-dot { color: var(--subtext); }
  .verified-stamp {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid #1B8A4A; color: #1B8A4A; background: transparent;
    padding: 2px 7px; border-radius: 3px; margin-top: 8px;
    font-size: 9px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .verified-stamp svg { width: 10px; height: 10px; display: block; }
  .verified-stamp path { fill: none; stroke: #1B8A4A; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .trust-badge { background: var(--orange); color: #fff; padding: 5px 12px; border-radius: 0; margin-top: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .member-since { font-size: 11px; color: var(--subtext); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.03em; }

  .stats-row { display: flex; background: var(--card); border-radius: 0; border: 2px solid var(--text); margin-bottom: 14px; }
  .stat-box { flex: 1; text-align: center; padding: 14px 6px; border-right: 2px solid var(--text); }
  .stat-box:last-child { border-right: none; }
  .stat-number { font-size: 18px; font-weight: 900; color: var(--price-red); }
  .stat-label { font-size: 9px; color: var(--subtext); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }

  .progress-box { background: var(--warn-bg); border-radius: 0; border: 2px solid var(--orange); padding: 10px; margin-bottom: 14px; text-align: center; }
  .progress-text { font-size: 11px; color: var(--warn-text); font-weight: 700; }

  .section-title { font-size: 13px; font-weight: 800; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--text); padding-bottom: 8px; }
  .empty-text { color: var(--subtext); font-size: 12px; }
  .review-card { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 12px; margin-bottom: 8px; }
  .review-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .reviewer-name { font-size: 13px; font-weight: 700; }
  .review-stars { font-size: 12px; color: var(--gold); }
  .review-comment { font-size: 12px; color: var(--subtext); }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .card { width: calc(47% - 5px); background: var(--card); border: 2px solid var(--border); border-radius: 0; overflow: hidden; cursor: pointer; }
  .thumb { position: relative; height: 110px; background: #E9E2D3; display: flex; align-items: center; justify-content: center; }
  .status-chip {
    position: absolute; top: 6px; left: 6px;
    background: #7A3E00; color: #fff; font-size: 9px; font-weight: 800;
    padding: 3px 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  body.dark .thumb { background: #2A2A2A; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .card-info { padding: 8px; }
  .card-price { font-weight: 800; font-size: 13px; color: var(--price-red); }
  .card-title { font-size: 11px; color: var(--text); margin: 2px 0; }
  .card-loc { font-size: 10px; color: var(--subtext); }
  .sold-item { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .sold-item.static { cursor: default; }
  .sold-thumb { width: 56px; height: 56px; flex-shrink: 0; background: #E9E2D3; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .sold-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sold-item-price { font-size: 12px; font-weight: 800; color: var(--price-red); margin-top: 2px; }
  .sold-item-title { font-size: 13px; font-weight: 700; }
  .sold-item-date { font-size: 10px; color: var(--subtext); margin-top: 3px; }
  .follow-btn {
    width: 100%; margin: 0 0 10px; padding: 14px;
    background: var(--black); color: var(--gold); border: none;
    font-weight: 800; font-size: 12px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .follow-btn.on {
    background: var(--card); color: var(--text); border: 2px solid var(--text);
  }
  .block-btn {
    width: 100%; margin: 0 0 14px; padding: 12px;
    background: none; color: var(--price-red); border: 2px solid var(--price-red);
    font-weight: 800; font-size: 12px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .follow-note { font-size: 11px; color: var(--subtext); text-align: center; margin: 0 0 14px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title" data-i18n="shop_profile">Shop Profile</div>
</div>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script src="/js/lang.js"></script>
<script src="/js/seller-badge.js"></script>
<script src="/js/data-saver.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const params = new URLSearchParams(window.location.search);
  const sellerId = params.get("id");
  const app = document.getElementById("app");
  const token = localStorage.getItem("zm_token");
  const me = JSON.parse(localStorage.getItem("zm_user") || "null");
  const isOwnShop = me && String(me.id) === String(sellerId);
  let followingShop = false;
  let followerCount = 0;
  let followingCount = 0;
  let iBlockedThem = false;
  let theyBlockedMe = false;

  function compactCount(n) {
    n = Number(n) || 0;
    if (n >= 1000000) {
      const v = n / 1000000;
      return (n % 1000000 === 0 || v >= 10 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + "M";
    }
    if (n >= 1000) {
      const v = n / 1000;
      return (n % 1000 === 0 || v >= 10 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + "K";
    }
    return String(n);
  }

  function followersHtml(n) {
    n = Number(n) || 0;
    const word = n === 1 ? t("follower_one") : t("followers_word");
    return `<span class="follow-count-num">${compactCount(n)}</span> ${word}`;
  }

  function followingHtml(n) {
    return `<span class="follow-count-num">${compactCount(n)}</span> ${t("following_word")}`;
  }

  function paintFollowCounts() {
    const followersEl = document.getElementById("followersLink");
    const followingEl = document.getElementById("followingLink");
    if (followersEl) followersEl.innerHTML = followersHtml(followerCount);
    if (followingEl) followingEl.innerHTML = followingHtml(followingCount);
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderListingCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    return `
      <div class="card" id="listing-${item.id}">
        <div class="thumb">
          ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(28)}
          ${item.status === "reserved" ? `<div class="status-chip">${t("listing_reserved")}</div>` : ""}
          ${typeof zmDropChipHtml === "function" ? zmDropChipHtml(item) : ""}
        </div>
        <div class="card-info">
          <div class="card-price">K${item.price}${typeof zmDropPriceHtml === "function" ? zmDropPriceHtml(item) : ""}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-loc">${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  function wireListingCards(listings) {
    listings.forEach((item) => {
      const card = document.getElementById(`listing-${item.id}`);
      if (card) card.addEventListener("click", () => window.location.href = `/listing.html?id=${item.id}`);
    });
    const grid = document.getElementById("sellerListingsGrid");
    if (grid && typeof observeLazyImages === "function") observeLazyImages(grid);
  }

  function verifiedStamp(label) {
    return `<span class="verified-stamp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>${label}</span>`;
  }

  function shopBadgeHtml(profile) {
    const kind = typeof zmSellerTrustKind === "function" ? zmSellerTrustKind(profile) : "";
    const label = typeof zmSellerTrustLabel === "function" ? zmSellerTrustLabel(kind) : "";
    if (!kind || !label) return "";
    if (kind === "registered_shop") {
      return `<div class="member-since">${label}</div>`;
    }
    return verifiedStamp(label);
  }

  async function loadFollowStatus() {
    if (!token || isOwnShop) return;
    try {
      const res = await fetch(`${API_URL}/follows/status/${sellerId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.ok) {
        const data = await res.json();
        followingShop = data.following === true;
      }
    } catch (e) {}
  }

  async function loadBlockStatus() {
    if (!token || isOwnShop) return;
    try {
      const res = await fetch(`${API_URL}/messages/block/${sellerId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.ok) {
        const data = await res.json();
        iBlockedThem = !!data.i_blocked_them;
        theyBlockedMe = !!data.they_blocked_me;
      }
    } catch (e) {}
  }

  function followNoteText(shopName) {
    if (followingShop) return t("follow_note_on", { name: shopName });
    return t("follow_note_off");
  }

  function wireFollowButton(shopName) {
    const btn = document.getElementById("followShopBtn");
    const note = document.getElementById("followNote");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      if (!token) {
        location.href = zmLoginUrl(`/seller-profile.html?id=${sellerId}`);
        return;
      }
      btn.disabled = true;
      try {
        const method = followingShop ? "DELETE" : "POST";
        const res = await fetch(`${API_URL}/follows/${sellerId}`, {
          method,
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error("fail");
        const data = await res.json().catch(() => ({}));
        followingShop = !followingShop;
        if (typeof data.followers === "number") {
          followerCount = data.followers;
        } else {
          followerCount = Math.max(0, followerCount + (followingShop ? 1 : -1));
        }
        if (typeof data.following === "number") followingCount = data.following;
        paintFollowCounts();
        btn.classList.toggle("on", followingShop);
        btn.textContent = followingShop ? t("following_btn") : t("follow_shop");
        if (note) note.textContent = followNoteText(shopName);
      } catch (err) {
        alert(t("follow_fail"));
      } finally {
        btn.disabled = false;
      }
    });
  }

  function wireBlockButton() {
    const btn = document.getElementById("blockShopBtn");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      if (!token) {
        location.href = zmLoginUrl(`/seller-profile.html?id=${sellerId}`);
        return;
      }
      if (!iBlockedThem && !confirm(t("block_seller_confirm"))) return;
      btn.disabled = true;
      try {
        const res = await fetch(`${API_URL}/messages/block/${sellerId}`, {
          method: iBlockedThem ? "DELETE" : "POST",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error("fail");
        iBlockedThem = !iBlockedThem;
        theyBlockedMe = false;
        loadProfile();
      } catch (err) {
        alert(iBlockedThem ? t("chat_unblock_fail") : t("chat_block_fail"));
      } finally {
        btn.disabled = false;
      }
    });
  }

  async function loadProfile() {
    try {
      const [profileRes, reviewsRes, listingsRes, soldRes] = await Promise.all([
        fetch(`${API_URL}/reviews/seller/${sellerId}/profile`),
        fetch(`${API_URL}/reviews/seller/${sellerId}`),
        fetch(`${API_URL}/listings?seller_id=${sellerId}&limit=50`, token ? { headers: { Authorization: `Bearer ${token}` } } : undefined),
        fetch(`${API_URL}/sale-confirmations/seller/${sellerId}/history`),
        loadFollowStatus(),
        loadBlockStatus(),
      ]);
      const profile = await profileRes.json();
      const reviewsData = await reviewsRes.json();
      let listings = [];
      if (listingsRes.ok) {
        listings = await listingsRes.json();
        if (!Array.isArray(listings)) listings = [];
      }
      let soldHistory = [];
      if (soldRes.ok) {
        soldHistory = await soldRes.json();
        if (!Array.isArray(soldHistory)) soldHistory = [];
      }
      render(profile, reviewsData.reviews || [], listings, soldHistory);
    } catch (e) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("shop_not_found")}</div></div>`;
    }
  }

  function render(profile, reviews, listings, soldHistory) {
    if (!profile || profile.error) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("shop_not_found")}</div></div>`;
      return;
    }

    const memberSince = profile.member_since
      ? new Date(profile.member_since).toLocaleDateString("en-US", { month: "long", year: "numeric" })
      : null;

    let progressHtml = "";
    if (!profile.badge && profile.total_sold > 0) {
      const remaining = 50 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${t("trusted_seller_progress", { count: remaining })}</div></div>`;
    }
    if (profile.badge?.label === "Trusted Seller") {
      const remaining = 100 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${t("elite_seller_progress", { count: remaining })}</div></div>`;
    }

    const trustBadge = profile.badge
      ? `<div class="trust-badge">${profile.badge.label}</div>`
      : "";

    followerCount = Number(profile.followers) || 0;
    followingCount = Number(profile.following) || 0;

    app.innerHTML = `
      <div class="content">
        <div class="profile-header">
          <div class="avatar">${profile.display_name ? profile.display_name.charAt(0).toUpperCase() : "?"}</div>
          <div class="name">${profile.display_name}</div>
          <div class="follow-counts">
            <a class="follow-count-link" id="followersLink" href="/following.html?id=${sellerId}&tab=followers">${followersHtml(followerCount)}</a>
            <span class="follow-dot">·</span>
            <a class="follow-count-link" id="followingLink" href="/following.html?id=${sellerId}&tab=following">${followingHtml(followingCount)}</a>
          </div>
          ${shopBadgeHtml(profile)}
          ${trustBadge}
          ${memberSince ? `<div class="member-since">${t("member_since", { date: memberSince })}</div>` : ""}
        </div>

        ${isOwnShop ? "" : `
        <button class="follow-btn${followingShop ? " on" : ""}" id="followShopBtn">${followingShop ? t("following_btn") : t("follow_shop")}</button>
        <div class="follow-note" id="followNote">${followNoteText(profile.display_name || "")}</div>
        <button class="block-btn" id="blockShopBtn">${iBlockedThem ? t("unblock_seller") : t("block_seller")}</button>
        `}

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number">${profile.total_sold}</div>
            <div class="stat-label">${t("items_sold")}</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.active_listings}</div>
            <div class="stat-label">${t("active_listings")}</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.total_reviews > 0 ? profile.average_rating : "—"}</div>
            <div class="stat-label">${profile.total_reviews > 0 ? t("review_count", { count: profile.total_reviews }) : t("no_reviews_yet")}</div>
          </div>
        </div>

        ${progressHtml}

        <div class="section-title">${t("seller_listings_section")}</div>
        ${theyBlockedMe
          ? `<div class="empty-text">${t("seller_blocked_you")}</div>`
          : iBlockedThem
            ? `<div class="empty-text">${t("seller_blocked")}</div>`
            : listings.length === 0
              ? `<div class="empty-text">${t("no_seller_listings")}</div>`
              : `<div class="grid" id="sellerListingsGrid">${listings.map(renderListingCard).join("")}</div>`}

        <div class="section-title">${t("sold_history_section")}</div>
        ${soldHistory.length === 0
          ? `<div class="empty-text">${t("sold_history_empty")}</div>`
          : soldHistory.map((item, idx) => {
              const date = item.sold_at || item.confirmed_at
                ? new Date(item.sold_at || item.confirmed_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })
                : "";
              const photos = Array.isArray(item.photos) ? item.photos : [];
              const img = photos[0];
              const clickable = item.listing_id ? `data-sold-id="${item.listing_id}"` : "";
              return `
                <div class="sold-item${item.listing_id ? "" : " static"}" ${clickable}>
                  <div class="sold-thumb">${img ? zmImg(img, { alt: item.listing_title || "", preset: "thumb", defer: true }) : photoPlaceholder(22)}</div>
                  <div>
                    <div class="sold-item-title">${item.listing_title || ""}</div>
                    ${item.price != null ? `<div class="sold-item-price">K${item.price}</div>` : ""}
                    ${date ? `<div class="sold-item-date">${t("sold_on_date", { date })}</div>` : ""}
                  </div>
                </div>`;
            }).join("")}

        <div class="section-title">${t("reviews_section")}</div>
        ${reviews.length === 0
          ? `<div class="empty-text">${t("no_reviews_yet")}</div>`
          : reviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <div class="reviewer-name">${r.reviewer_name}</div>
                <div class="review-stars">${"★".repeat(r.rating)}</div>
              </div>
              ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ""}
            </div>`).join("")}
      </div>`;
    wireListingCards(iBlockedThem || theyBlockedMe ? [] : listings);
    wireFollowButton(profile.display_name || "");
    wireBlockButton();
    app.querySelectorAll("[data-sold-id]").forEach((row) => {
      row.addEventListener("click", () => {
        window.location.href = `/listing.html?id=${row.dataset.soldId}`;
      });
    });
  }

  loadProfile();
</script>
</body>
</html>
