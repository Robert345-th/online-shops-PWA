<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<title>ZedMarket - Seller Profile</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .center-box { display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
  .error-text { color: var(--price-red); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
  .avatar { width: 72px; height: 72px; border-radius: 36px; background: #E01B27; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: #fff; font-size: 30px; font-weight: 700; }
  .name { font-size: 20px; font-weight: 700; }
  .verified-badge { background: #2F4F3E; color: #fff; padding: 4px 10px; border-radius: 20px; margin-top: 8px; font-size: 11px; font-weight: 700; }
  .trust-badge { background: var(--orange); color: #fff; padding: 5px 12px; border-radius: 20px; margin-top: 8px; font-size: 12px; font-weight: 700; }
  .member-since { font-size: 11px; color: var(--subtext); margin-top: 8px; }

  .stats-row { display: flex; background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 14px; margin-bottom: 14px; }
  .stat-box { flex: 1; text-align: center; }
  .stat-number { font-size: 18px; font-weight: 700; color: var(--price-red); }
  .stat-label { font-size: 10px; color: var(--subtext); margin-top: 4px; }

  .progress-box { background: var(--warn-bg); border-radius: 10px; padding: 10px; margin-bottom: 14px; text-align: center; }
  .progress-text { font-size: 11px; color: var(--warn-text); font-weight: 600; }

  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .empty-text { color: var(--subtext); font-size: 12px; }
  .review-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .review-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .reviewer-name { font-size: 13px; font-weight: 600; }
  .review-stars { font-size: 12px; }
  .review-comment { font-size: 12px; color: var(--subtext); }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title">Seller Profile</div>
</div>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const params = new URLSearchParams(window.location.search);
  const sellerId = params.get("id");
  const app = document.getElementById("app");

  async function loadProfile() {
    try {
      const [profileRes, reviewsRes] = await Promise.all([
        fetch(`${API_URL}/reviews/seller/${sellerId}/profile`),
        fetch(`${API_URL}/reviews/seller/${sellerId}`)
      ]);
      const profile = await profileRes.json();
      const reviewsData = await reviewsRes.json();
      render(profile, reviewsData.reviews || []);
    } catch (e) {
      app.innerHTML = `<div class="center-box"><div class="error-text">Seller not found.</div></div>`;
    }
  }

  function render(profile, reviews) {
    if (!profile) {
      app.innerHTML = `<div class="center-box"><div class="error-text">Seller not found.</div></div>`;
      return;
    }

    const memberSince = profile.member_since
      ? new Date(profile.member_since).toLocaleDateString("en-US", { month: "long", year: "numeric" })
      : null;

    let progressHtml = "";
    if (!profile.badge && profile.total_sold > 0) {
      const remaining = 50 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${remaining} more sale${remaining === 1 ? "" : "s"} until 🌟 Trusted Seller</div></div>`;
    }
    if (profile.badge?.label === "Trusted Seller") {
      const remaining = 100 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${remaining} more sale${remaining === 1 ? "" : "s"} until 🏆 Elite Seller</div></div>`;
    }

    app.innerHTML = `
      <div class="content">
        <div class="profile-header">
          <div class="avatar">${profile.display_name ? profile.display_name.charAt(0).toUpperCase() : "?"}</div>
          <div class="name">${profile.display_name}</div>
          ${profile.account_type === "shop" ? `<div class="verified-badge">✅ Verified Shop</div>` : ""}
          ${profile.badge ? `<div class="trust-badge">${profile.badge.emoji} ${profile.badge.label}</div>` : ""}
          ${memberSince ? `<div class="member-since">Member since ${memberSince}</div>` : ""}
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number">${profile.total_sold}</div>
            <div class="stat-label">Items Sold</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.active_listings}</div>
            <div class="stat-label">Active Listings</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.total_reviews > 0 ? `⭐ ${profile.average_rating}` : "—"}</div>
            <div class="stat-label">${profile.total_reviews > 0 ? `${profile.total_reviews} review${profile.total_reviews === 1 ? "" : "s"}` : "No reviews yet"}</div>
          </div>
        </div>

        ${progressHtml}

        <div class="section-title">Reviews</div>
        ${reviews.length === 0
          ? `<div class="empty-text">No reviews yet.</div>`
          : reviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <div class="reviewer-name">${r.reviewer_name}</div>
                <div class="review-stars">${"⭐".repeat(r.rating)}</div>
              </div>
              ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ""}
            </div>`).join("")}
      </div>`;
  }

  loadProfile();
</script>
</body>
</html>
