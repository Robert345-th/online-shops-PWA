<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Shop Profile</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
    --approved-bg: #2F4F3E;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .center-box { display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
  .error-text { color: var(--price-red); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
  .avatar { width: 72px; height: 72px; border-radius: 0; background: var(--black); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: var(--gold); font-size: 30px; font-weight: 900; }
  .name { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; }
  .verified-badge { background: var(--approved-bg); color: #fff; padding: 4px 10px; border-radius: 0; margin-top: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .verified-badge.subscribed { background: var(--orange); }
  .trust-badge { background: var(--orange); color: #fff; padding: 5px 12px; border-radius: 0; margin-top: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .member-since { font-size: 11px; color: var(--subtext); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.03em; }

  .stats-row { display: flex; background: var(--card); border-radius: 0; border: 2px solid var(--text); margin-bottom: 14px; }
  .stat-box { flex: 1; text-align: center; padding: 14px 6px; border-right: 2px solid var(--text); }
  .stat-box:last-child { border-right: none; }
  .stat-number { font-size: 18px; font-weight: 900; color: var(--price-red); }
  .stat-label { font-size: 9px; color: var(--subtext); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }

  .progress-box { background: var(--warn-bg); border-radius: 0; border: 2px solid var(--orange); padding: 10px; margin-bottom: 14px; text-align: center; }
  .progress-text { font-size: 11px; color: var(--warn-text); font-weight: 700; }

  .section-title { font-size: 13px; font-weight: 800; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--text); padding-bottom: 8px; }
  .empty-text { color: var(--subtext); font-size: 12px; }
  .review-card { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 12px; margin-bottom: 8px; }
  .review-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .reviewer-name { font-size: 13px; font-weight: 700; }
  .review-stars { font-size: 12px; color: var(--gold); }
  .review-comment { font-size: 12px; color: var(--subtext); }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .card { width: calc(47% - 5px); background: var(--card); border: 2px solid var(--border); border-radius: 0; overflow: hidden; cursor: pointer; }
  .thumb { height: 110px; background: #E9E2D3; display: flex; align-items: center; justify-content: center; }
  body.dark .thumb { background: #2A2A2A; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .card-info { padding: 8px; }
  .card-price { font-weight: 800; font-size: 13px; color: var(--price-red); }
  .card-title { font-size: 11px; color: var(--text); margin: 2px 0; }
  .card-loc { font-size: 10px; color: var(--subtext); }
  .sold-item { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 10px 12px; margin-bottom: 8px; }
  .sold-item-title { font-size: 13px; font-weight: 700; }
  .sold-item-date { font-size: 10px; color: var(--subtext); margin-top: 3px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title" data-i18n="shop_profile">Shop Profile</div>
</div>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script src="/js/lang.js"></script>
<script src="/js/data-saver.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const params = new URLSearchParams(window.location.search);
  const sellerId = params.get("id");
  const app = document.getElementById("app");

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderListingCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    return `
      <div class="card" id="listing-${item.id}">
        <div class="thumb">
          ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(28)}
        </div>
        <div class="card-info">
          <div class="card-price">K${item.price}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-loc">${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  function wireListingCards(listings) {
    listings.forEach((item) => {
      const card = document.getElementById(`listing-${item.id}`);
      if (card) card.addEventListener("click", () => window.location.href = `/listing.html?id=${item.id}`);
    });
    const grid = document.getElementById("sellerListingsGrid");
    if (grid && typeof observeLazyImages === "function") observeLazyImages(grid);
  }

  function shopBadgeHtml(profile) {
    const subscribed = profile.subscription_active === true
      || profile.payment_status === "active"
      || profile.has_active_subscription === true;
    const approved = profile.account_type === "shop" && profile.shop_status === "approved";

    if (subscribed) {
      return `<div class="verified-badge subscribed">${t("verified_shop")}</div>`;
    }
    if (profile.nrc_verified) {
      return `<div class="verified-badge">${t("seller_id_verified", "ID Verified")}</div>`;
    }
    if (approved) {
      return `<div class="verified-badge">${t("approved_shop")}</div>`;
    }
    if (profile.account_type === "shop") {
      return `<div class="member-since">${t("registered_shop")}</div>`;
    }
    return "";
  }

  async function loadProfile() {
    try {
      const [profileRes, reviewsRes, listingsRes, soldRes] = await Promise.all([
        fetch(`${API_URL}/reviews/seller/${sellerId}/profile`),
        fetch(`${API_URL}/reviews/seller/${sellerId}`),
        fetch(`${API_URL}/listings?seller_id=${sellerId}&limit=20`),
        fetch(`${API_URL}/sale-confirmations/seller/${sellerId}/history`)
      ]);
      const profile = await profileRes.json();
      const reviewsData = await reviewsRes.json();
      let listings = [];
      if (listingsRes.ok) {
        listings = await listingsRes.json();
        if (!Array.isArray(listings)) listings = [];
      }
      let soldHistory = [];
      if (soldRes.ok) {
        soldHistory = await soldRes.json();
        if (!Array.isArray(soldHistory)) soldHistory = [];
      }
      render(profile, reviewsData.reviews || [], listings, soldHistory);
    } catch (e) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("shop_not_found")}</div></div>`;
    }
  }

  function render(profile, reviews, listings, soldHistory) {
    if (!profile || profile.error) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("shop_not_found")}</div></div>`;
      return;
    }

    const memberSince = profile.member_since
      ? new Date(profile.member_since).toLocaleDateString("en-US", { month: "long", year: "numeric" })
      : null;

    let progressHtml = "";
    if (!profile.badge && profile.total_sold > 0) {
      const remaining = 50 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${t("trusted_seller_progress", { count: remaining })}</div></div>`;
    }
    if (profile.badge?.label === "Trusted Seller") {
      const remaining = 100 - profile.total_sold;
      progressHtml = `<div class="progress-box"><div class="progress-text">${t("elite_seller_progress", { count: remaining })}</div></div>`;
    }

    const trustBadge = profile.badge
      ? `<div class="trust-badge">${profile.badge.label}</div>`
      : "";

    app.innerHTML = `
      <div class="content">
        <div class="profile-header">
          <div class="avatar">${profile.display_name ? profile.display_name.charAt(0).toUpperCase() : "?"}</div>
          <div class="name">${profile.display_name}</div>
          ${shopBadgeHtml(profile)}
          ${trustBadge}
          ${memberSince ? `<div class="member-since">${t("member_since", { date: memberSince })}</div>` : ""}
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number">${profile.total_sold}</div>
            <div class="stat-label">${t("items_sold")}</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.active_listings}</div>
            <div class="stat-label">${t("active_listings")}</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${profile.total_reviews > 0 ? profile.average_rating : "—"}</div>
            <div class="stat-label">${profile.total_reviews > 0 ? t("review_count", { count: profile.total_reviews }) : t("no_reviews_yet")}</div>
          </div>
        </div>

        ${progressHtml}

        <div class="section-title">${t("seller_listings_section")}</div>
        ${listings.length === 0
          ? `<div class="empty-text">${t("no_seller_listings")}</div>`
          : `<div class="grid" id="sellerListingsGrid">${listings.map(renderListingCard).join("")}</div>`}

        <div class="section-title">${t("sold_history_section")}</div>
        ${soldHistory.length === 0
          ? `<div class="empty-text">${t("sold_history_empty")}</div>`
          : soldHistory.map((item) => {
              const date = item.confirmed_at
                ? new Date(item.confirmed_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })
                : "";
              return `
                <div class="sold-item">
                  <div class="sold-item-title">${item.listing_title}</div>
                  ${date ? `<div class="sold-item-date">${date}</div>` : ""}
                </div>`;
            }).join("")}

        <div class="section-title">${t("reviews_section")}</div>
        ${reviews.length === 0
          ? `<div class="empty-text">${t("no_reviews_yet")}</div>`
          : reviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <div class="reviewer-name">${r.reviewer_name}</div>
                <div class="review-stars">${"★".repeat(r.rating)}</div>
              </div>
              ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ""}
            </div>`).join("")}
      </div>`;
    wireListingCards(listings);
  }

  loadProfile();
</script>
</body>
</html>
