<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Log In</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #FFFFFF; --text: #111111; --subtext: #8a8a8a;
    --red: #E01B27; --border: #111111;
  }
  body.dark {
    --bg: #0A0A0A; --text: #F0EDE8; --subtext: #8a8a8a; --border: #F0EDE8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 28px 24px; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
  .ghost-num { position: absolute; top: 4px; right: -6px; font-size: 150px; font-weight: 900; color: currentColor; opacity: 0.04; line-height: 1; pointer-events: none; user-select: none; }
  .title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05; position: relative; }
  .subtitle { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.08em; margin: 8px 0 26px; padding-bottom: 16px; border-bottom: 2px solid var(--border); position: relative; }
  .label { font-size: 11px; font-weight: 800; color: var(--text); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
  .phone-row { display: flex; margin-bottom: 22px; gap: 10px; align-items: flex-end; }
  .phone-prefix { border-bottom: 2px solid var(--border); padding: 10px 0; display: flex; align-items: center; flex-shrink: 0; }
  .phone-prefix span { color: var(--text); font-weight: 800; font-size: 14px; white-space: nowrap; }
  .phone-input { flex: 1 1 0; min-width: 0; background: transparent; border: none; border-bottom: 2px solid var(--border); border-radius: 0; padding: 10px 0; font-size: 15px; color: var(--text); }
  .field-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--border); border-radius: 0; padding: 10px 0; margin-bottom: 14px; font-size: 15px; color: var(--text); }
  .field-input::placeholder, .phone-input::placeholder { color: #bbb; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; }
  .checkbox { width: 18px; height: 18px; border-radius: 0; border: 2px solid var(--text); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; }
  .checkbox.checked { background: var(--red); border-color: var(--red); }
  .checkbox-label { font-size: 12px; color: var(--subtext); }
  .forgot-link { display: block; text-align: right; color: var(--red); font-size: 12px; font-weight: 700; margin-bottom: 20px; text-decoration: underline; text-transform: uppercase; letter-spacing: 0.04em; }
  .submit-btn { width: 100%; background: var(--text); border: none; border-radius: 0; padding: 16px; color: var(--bg); font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .link { display: block; text-align: center; color: var(--red); margin-top: 22px; font-size: 12px; font-weight: 700; text-decoration: underline; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Styled inline banners, replacing the browser's native alert() popups */
  .form-banner {
    display: none;
    border-radius: 0;
    padding: 12px 14px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 18px;
    line-height: 1.4;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .form-banner.error {
    border: 2px solid var(--red);
    color: var(--red);
  }
  .form-banner.success {
    border: 2px solid var(--text);
    color: var(--text);
  }
  .form-banner.show { display: block; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="content">
  <div class="ghost-num">→</div>
  <div class="title" data-i18n="welcome_back">Welcome Back</div>
  <div class="subtitle" data-i18n="login_subtitle">Log In To ZedMarket</div>

  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      let reason = "";
      try { reason = sessionStorage.getItem("zm_logout_reason") || ""; sessionStorage.removeItem("zm_logout_reason"); } catch (e) {}
      if (params.get("suspended") === "1" || reason) {
        const banner = document.getElementById("errorBanner");
        banner.textContent = reason || "Your account has been suspended. Contact support.";
        banner.classList.add("show");
      }
    })();
  </script>

  <div class="label" data-i18n="phone_number">Phone Number</div>
  <div class="phone-row">
    <div class="phone-prefix"><span>🇿🇲 +260</span></div>
    <input class="phone-input" id="phone" placeholder="Phone number" maxlength="10" inputmode="tel" />
  </div>

  <div class="label" data-i18n="password">Password</div>
  <input class="field-input" id="password" type="password" placeholder="Enter your password" />

  <div class="checkbox-row" id="showPasswordRow">
    <div class="checkbox" id="checkboxBox"></div>
    <div class="checkbox-label" data-i18n="show_password">Show password</div>
  </div>

  <a class="forgot-link" href="/forgot-password.html" data-i18n="forgot_password">Forgot Password?</a>

  <button class="submit-btn" id="loginBtn" type="button" data-i18n="login">Log In</button>

  <a class="link" href="/signup.html" id="signupLink" data-i18n="no_account_signup">Don't have an account? Sign up</a>
</div>

<script src="/js/lang.js"></script>
<script src="/js/lang-gate.js"></script>
<script src="/js/phone.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const phoneInput = document.getElementById("phone");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const showPasswordRow = document.getElementById("showPasswordRow");
  const checkboxBox = document.getElementById("checkboxBox");
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");
  const nextParam = new URLSearchParams(location.search).get("next");
  const signupLink = document.getElementById("signupLink");
  if (signupLink && nextParam) {
    signupLink.href = `/signup.html?next=${encodeURIComponent(nextParam)}`;
  }

  // Replaces alert() - shows a styled banner above the form instead of the
  // browser's native popup, and scrolls it into view so it's never missed.
  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
    errorBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
    successBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearBanners() {
    errorBanner.classList.remove("show");
    successBanner.classList.remove("show");
  }

  let showPassword = false;
  showPasswordRow.addEventListener("click", () => {
    showPassword = !showPassword;
    checkboxBox.classList.toggle("checked", showPassword);
    checkboxBox.textContent = showPassword ? "✓" : "";
    passwordInput.type = showPassword ? "text" : "password";
  });

  loginBtn.addEventListener("click", async () => {
    clearBanners();
    const phone = normalizeZambianPhone(phoneInput.value);
    const password = passwordInput.value;

    if (!phone || !password) {
      showError("Please enter your phone and password.");
      return;
    }
    if (!isValidZambianPhone(phone)) {
      showError("Airtel and Zamtel only.");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = t("logging_in");

    try {
      const res = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, password })
      });
      const data = await res.json();

      if (!res.ok) {
        if (data.needsVerification) {
          const otpUrl = nextParam
            ? `/verify-otp.html?phone=${encodeURIComponent(phone)}&next=${encodeURIComponent(nextParam)}`
            : `/verify-otp.html?phone=${encodeURIComponent(phone)}`;
          window.location.href = otpUrl;
          return;
        }
        showError(data.error || "Something went wrong.");
        return;
      }

      localStorage.setItem("zm_token", data.token);
      localStorage.setItem("zm_user", JSON.stringify(data.user));
      if (typeof zmApplyLoginPrefs === "function") zmApplyLoginPrefs(data.prefs);
      showSuccess(`Welcome back! Logged in as ${data.user.name}`);
      loginBtn.disabled = true;
      const nextUrl = nextParam || new URLSearchParams(window.location.search).get("next");
      const dest = (typeof zmSafeNext === "function") ? zmSafeNext(nextUrl) : (nextUrl && nextUrl.startsWith("/") ? nextUrl : "/index.html");
      setTimeout(() => { window.location.replace(dest); }, 700);
    } catch (e) {
      showError("Could not connect to the server.");
    } finally {
      if (!localStorage.getItem("zm_token")) {
        loginBtn.disabled = false;
        loginBtn.textContent = t("login");
      }
    }
  });
  window.addEventListener("langchange", () => {
    if (!loginBtn.disabled) loginBtn.textContent = t("login");
  });
</script>
</body>
</html>
