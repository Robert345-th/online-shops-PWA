<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Log In</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--subtext); margin-bottom: 32px; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .phone-row { display: flex; margin-bottom: 18px; gap: 8px; }
  .phone-prefix { background: var(--black); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--gold); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; cursor: pointer; }
  .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--subtext); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .checkbox.checked { background: var(--red-btn); border-color: var(--red-btn); }
  .checkbox-label { font-size: 12px; color: var(--subtext); }
  .forgot-link { display: block; text-align: right; color: var(--price-red); font-size: 12px; font-weight: 600; margin-bottom: 16px; text-decoration: none; }
  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.7; }
  .link { display: block; text-align: center; color: var(--price-red); margin-top: 20px; font-size: 13px; text-decoration: none; }

  /* Styled inline banners, replacing the browser's native alert() popups */
  .form-banner {
    display: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .form-banner.error {
    background: #FBE7E8;
    color: var(--price-red);
    border: 1px solid #F0C1C4;
  }
  .form-banner.success {
    background: #E7F5EC;
    color: #1F7A43;
    border: 1px solid #BFE5CE;
  }
  .form-banner.show { display: block; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="content">
  <div class="title" data-i18n="welcome_back">Welcome Back</div>
  <div class="subtitle" data-i18n="login_subtitle">Log in to ZedMarket</div>

  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>

  <div class="label" data-i18n="phone_number">Phone Number</div>
  <div class="phone-row">
    <div class="phone-prefix"><span>🇿🇲 +260</span></div>
    <input class="phone-input" id="phone" placeholder="e.g. 0977123456" maxlength="10" inputmode="tel" />
  </div>

  <div class="label" data-i18n="password">Password</div>
  <input class="field-input" id="password" type="password" placeholder="Enter your password" />

  <div class="checkbox-row" id="showPasswordRow">
    <div class="checkbox" id="checkboxBox"></div>
    <div class="checkbox-label" data-i18n="show_password">Show password</div>
  </div>

  <a class="forgot-link" href="/forgot-password.html" data-i18n="forgot_password">Forgot Password?</a>

  <button class="submit-btn" id="loginBtn" data-i18n="login">Log In</button>

  <a class="link" href="/signup.html" data-i18n="no_account_signup">Don't have an account? Sign up</a>
</div>

<script src="/js/lang.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const phoneInput = document.getElementById("phone");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const showPasswordRow = document.getElementById("showPasswordRow");
  const checkboxBox = document.getElementById("checkboxBox");
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");

  // Replaces alert() - shows a styled banner above the form instead of the
  // browser's native popup, and scrolls it into view so it's never missed.
  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
    errorBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
    successBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearBanners() {
    errorBanner.classList.remove("show");
    successBanner.classList.remove("show");
  }

  let showPassword = false;
  showPasswordRow.addEventListener("click", () => {
    showPassword = !showPassword;
    checkboxBox.classList.toggle("checked", showPassword);
    checkboxBox.textContent = showPassword ? "✓" : "";
    passwordInput.type = showPassword ? "text" : "password";
  });

  function isValidZambianPhone(phone) {
    return /^0(7|9)\d{8}$/.test(phone);
  }

  loginBtn.addEventListener("click", async () => {
    clearBanners();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;

    if (!phone || !password) {
      showError("Please enter your phone and password.");
      return;
    }
    if (!isValidZambianPhone(phone)) {
      showError("Please enter a valid Zambian phone number (e.g. 0977123456).");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = t("logging_in");

    try {
      const res = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Something went wrong.");
        return;
      }

      localStorage.setItem("zm_token", data.token);
      localStorage.setItem("zm_user", JSON.stringify(data.user));
      showSuccess(`Welcome back! Logged in as ${data.user.name}`);
      setTimeout(() => { window.location.href = "/index.html"; }, 700);
    } catch (e) {
      showError("Could not connect to the server.");
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = t("login");
    }
  });
  window.addEventListener("langchange", () => {
    if (!loginBtn.disabled) loginBtn.textContent = t("login");
  });
</script>
</body>
</html>
