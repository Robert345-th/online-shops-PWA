<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Chat</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: calc(var(--vh, 1vh) * 100); overflow: hidden; transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .menu-button {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; color: #fff; font-size: 18px; flex-shrink: 0;
  }
  .header-profile { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; background: none; border: none; text-align: left; }
  .header-avatar-wrap { position: relative; flex-shrink: 0; }
  .header-avatar { width: 34px; height: 34px; border-radius: 17px; background: #E01B27; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; color: #fff; font-weight: 700; font-size: 14px; }
  .header-avatar .input-icon { stroke: #fff; }
  .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .online-dot {
    position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px;
    border-radius: 6px; background: #4CAF50; border: 2px solid var(--black); display: none;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-name { color: var(--gold); font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-status { color: #8BC34A; font-size: 11px; font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-status.offline { color: #C9BFAF; }
  .header-status.typing { color: #8BC34A; font-style: italic; }

  .blocked-banner { background: var(--price-red); padding: 8px; color: #fff; font-size: 11px; text-align: center; font-weight: 600; flex-shrink: 0; }

  .messages-list { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
  .empty-text { text-align: center; color: var(--subtext); margin-top: 40px; }
  .bubble-row { display: flex; margin-bottom: 8px; align-items: flex-end; gap: 4px; }
  .bubble-row.mine { justify-content: flex-end; }
  .bubble-row.theirs { justify-content: flex-start; }
  .bubble { max-width: 78%; padding: 12px; border-radius: 16px; font-size: 14px; }
  .bubble.mine { background: var(--black); color: var(--gold); border-bottom-right-radius: 4px; }
  .bubble.theirs { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.deleted { background: transparent; border: 1px dashed var(--border); color: var(--subtext); font-style: italic; font-size: 12px; }
  .tick { font-size: 11px; color: var(--subtext); margin-bottom: 2px; }
  .photo-bubble { max-width: 65%; border-radius: 16px; overflow: hidden; padding: 3px; cursor: pointer; }
  .chat-photo { width: 180px; height: 180px; border-radius: 12px; object-fit: cover; background: var(--border); display: block; }
  .audio-bubble { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 16px; min-width: 150px; cursor: pointer; }
  .audio-wave { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; }

  #quickReplyWrap, #inputWrap { flex-shrink: 0; }
  .quick-reply-row { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px 4px; flex-shrink: 0; }
  .quick-reply-chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; flex-shrink: 0; }

  .input-row { display: flex; padding: 12px; gap: 8px; background: var(--bg); border-top: 1px solid var(--border); align-items: flex-end; flex-shrink: 0; }
  .photo-btn { width: 44px; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: var(--subtext); }
  .msg-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; font-size: 14px; max-height: 100px; resize: none; color: var(--text); }
  .send-btn { background: var(--red-btn); width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #fff; border: none; cursor: pointer; flex-shrink: 0; }
  .mic-btn { background: var(--orange); width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #fff; border: none; cursor: pointer; flex-shrink: 0; }
  .input-icon { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .input-icon-filled { fill: currentColor; stroke: none; }
  .audio-play-icon { width: 14px; height: 14px; flex-shrink: 0; fill: currentColor; stroke: none; }

  .recording-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); flex-shrink: 0; }
  .recording-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--red-btn); }
  .recording-text { flex: 1; font-size: 13px; font-weight: 600; }
  .cancel-record-btn { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; color: var(--subtext); font-size: 12px; font-weight: 600; cursor: pointer; }
  .stop-record-btn { background: var(--red-btn); padding: 8px 14px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }

  .viewer-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 300; align-items: center; justify-content: center; }
  .viewer-overlay.open { display: flex; }
  .viewer-back { position: absolute; top: 40px; left: 18px; z-index: 10; }
  .viewer-img { max-width: 100%; max-height: 100%; }

  .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .menu-overlay.open { display: flex; }
  .menu-box { background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; }
  .menu-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 8px; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; }
  .menu-row svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu-row.danger { color: var(--price-red); }
  .menu-cancel-btn { display: block; width: 100%; padding: 14px; text-align: center; background: none; border: none; color: var(--subtext); font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button class="header-profile" id="headerProfileBtn">
    <div class="header-avatar-wrap">
      <div class="header-avatar" id="headerAvatar">?</div>
      <span class="online-dot" id="headerOnlineDot"></span>
    </div>
    <div class="header-text">
      <div class="header-name" id="headerName">Chat</div>
      <div class="header-status" id="headerStatus"></div>
    </div>
  </button>
  <button class="menu-button" id="menuBtn">⋮</button>
</div>

<div id="blockedBannerWrap"></div>

<div class="messages-list" id="messagesList"><div class="empty-text">Loading…</div></div>

<div id="quickReplyWrap"></div>
<div id="inputWrap"></div>

<div class="viewer-overlay" id="viewerOverlay">
  <button class="back-button viewer-back" id="viewerBackBtn" aria-label="Close photo"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <img class="viewer-img" id="viewerImg" />
</div>

<div class="menu-overlay" id="menuOverlay">
  <div class="menu-box">
    <button class="menu-row" id="viewContactBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>View Contact Number</button>
    <button class="menu-row" id="reportUserBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>Report User</button>
    <button class="menu-row danger" id="blockToggleBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>Block User</button>
    <button class="menu-cancel-btn" id="menuCancelBtn">Cancel</button>
  </div>
</div>

<div class="menu-overlay" id="messageActionsOverlay">
  <div class="menu-box" id="messageActionsBox"></div>
</div>

<script src="/js/lang.js"></script>
<script src="/js/presence.js"></script>
<script src="/js/data-saver.js"></script>
<script>
  function setVH() {
    document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
  window.addEventListener('load', setVH);
  window.addEventListener('pageshow', setVH);
  setTimeout(setVH, 100);
  setTimeout(setVH, 400);

  const API_URL = "https://online-shops-production.up.railway.app";
  const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/kstg72vx/image/upload";
  const CLOUDINARY_AUDIO_URL = "https://api.cloudinary.com/v1_1/kstg72vx/video/upload";
  const UPLOAD_PRESET = "online_shops_uploads";
  const POLL_INTERVAL = 3000;
  const QUICK_REPLIES = ["✅ Still available", "💰 Price is negotiable", "❌ Sold, sorry", "📍 Where can we meet?"];

  function iconSvg(type, size = 20) {
    const icons = {
      camera: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="input-icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
      mic: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="input-icon"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`,
      send: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="input-icon"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" class="input-icon-filled"/></svg>`,
      play: `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" class="audio-play-icon"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
      pause: `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" class="audio-play-icon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
      support: `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" class="input-icon"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`,
      trash: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      block: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`,
      check: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`,
    };
    return icons[type] || "";
  }

  const params = new URLSearchParams(window.location.search);
  const userId = params.get("userId");
  const nameFromLink = params.get("name");
  const isKnownSupportChat = params.get("support") === "1";
  const token = localStorage.getItem("zm_token");
  const currentUser = JSON.parse(localStorage.getItem("zm_user") || "null");

  if (isKnownSupportChat) {
    document.getElementById("headerName").textContent = "ZedMarket Support";
    document.getElementById("headerAvatar").innerHTML = iconSvg("support");
    document.getElementById("menuBtn").style.display = "none";
  }

  let messages = [];
  let otherUser = null;
  let iBlockedThem = false;
  let theyBlockedMe = false;
  let pollTimer = null;
  let presenceTimer = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingSeconds = 0;
  let recordingTimer = null;
  let playingId = null;
  let currentAudio = null;

  const messagesList = document.getElementById("messagesList");

  function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, "0")}`;
  }

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  async function loadOtherUser() {
    const cacheKey = `zm_userinfo_${userId}`;
    try {
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        otherUser = JSON.parse(cached);
        renderHeader();
        updateComposerVisibility();
      }
    } catch (e) {}

    try {
      const res = await fetch(`${API_URL}/auth/user-info/${userId}`, { headers: authHeaders() });
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      otherUser = data;
      localStorage.setItem(cacheKey, JSON.stringify(data));
      renderHeader();
      updateComposerVisibility();
    } catch (e) {
      // One retry after a short delay, in case it was a transient network hiccup
      setTimeout(async () => {
        try {
          const res = await fetch(`${API_URL}/auth/user-info/${userId}`, { headers: authHeaders() });
          if (!res.ok) return;
          const data = await res.json();
          otherUser = data;
          localStorage.setItem(cacheKey, JSON.stringify(data));
          renderHeader();
          updateComposerVisibility();
        } catch (e2) {}
      }, 1000);
    }
  }

  function renderHeader() {
    if (otherUser?.is_admin) {
      document.getElementById("headerName").textContent = "ZedMarket Support";
      document.getElementById("headerAvatar").innerHTML = iconSvg("support");
      document.getElementById("menuBtn").style.display = "none";
      return;
    }
    const nameToShow = otherUser?.display_name || nameFromLink;
    if (!nameToShow && !otherUser) return;
    document.getElementById("headerName").textContent = nameToShow || "Chat";
    const avatar = document.getElementById("headerAvatar");
    if (otherUser?.shop_photo_url) {
      avatar.innerHTML = zmImg(otherUser.shop_photo_url, { preset: "avatar" });
    } else if (nameToShow) {
      avatar.textContent = nameToShow.charAt(0).toUpperCase();
    }
  }
  if (nameFromLink) renderHeader();

  async function refreshPresence() {
    if (isKnownSupportChat || otherUser?.is_admin || !userId) return;
    const map = await fetchPresenceMap([userId], { includeTyping: true });
    const data = map[userId];
    applyPresenceDot(document.getElementById("headerOnlineDot"), data);
    applyChatStatus(document.getElementById("headerStatus"), data);
  }

  document.getElementById("headerProfileBtn").addEventListener("click", () => {
    if (isKnownSupportChat || otherUser?.is_admin) return;
    window.location.href = `/seller-profile.html?id=${userId}`;
  });

  async function loadMessages(showSpinner) {
    try {
      if (showSpinner) messagesList.innerHTML = `<div class="empty-text">Loading…</div>`;
      const res = await fetch(`${API_URL}/messages/conversation/${userId}`, { headers: authHeaders() });
      const data = await res.json();
      messages = data.messages || [];
      iBlockedThem = data.i_blocked_them || false;
      theyBlockedMe = data.they_blocked_me || false;
      renderBlockedBanner();
      renderMessages();
      const recording = mediaRecorder && mediaRecorder.state !== "inactive";
      if (!recording) updateComposerVisibility();
    } catch (e) {}
  }

  function renderBlockedBanner() {
    const wrap = document.getElementById("blockedBannerWrap");
    if (theyBlockedMe) {
      wrap.innerHTML = `<div class="blocked-banner">This user has blocked you.</div>`;
    } else if (iBlockedThem) {
      wrap.innerHTML = `<div class="blocked-banner">You have blocked this user.</div>`;
    } else {
      wrap.innerHTML = "";
    }
    updateBlockButtonLabel();
  }

  function renderMessages() {
    if (!messages.length) {
      messagesList.innerHTML = `<div class="empty-text">Say hello 👋</div>`;
      return;
    }
    messagesList.innerHTML = messages.map(renderBubble).join("");
    messagesList.scrollTop = messagesList.scrollHeight;

    messages.forEach(msg => {
      const el = document.getElementById(`msg-${msg.id}`);
      if (el) {
        el.addEventListener("contextmenu", (e) => { e.preventDefault(); openMessageActions(msg.id); });
        let pressTimer;
        el.addEventListener("touchstart", () => { pressTimer = setTimeout(() => openMessageActions(msg.id), 500); });
        el.addEventListener("touchend", () => clearTimeout(pressTimer));
      }
      const photoEl = document.getElementById(`photo-${msg.id}`);
      if (photoEl) photoEl.addEventListener("click", () => openViewer(msg.photo_url));
      const audioEl = document.getElementById(`audio-${msg.id}`);
      if (audioEl) audioEl.addEventListener("click", () => handlePlayAudio(msg.id, msg.audio_url));
    });
    observeLazyImages(messagesList);
  }

  function renderBubble(msg) {
    const isMine = currentUser && msg.sender_id === currentUser.id;
    const rowClass = isMine ? "mine" : "theirs";

    if (msg.deleted_for_everyone) {
      return `<div class="bubble-row ${rowClass}"><div class="bubble deleted">This message was deleted</div></div>`;
    }

    let inner;
    if (msg.photo_url) {
      inner = `<div class="photo-bubble bubble ${isMine ? "mine" : "theirs"}" id="photo-${msg.id}" style="padding:3px;">${zmImg(msg.photo_url, { preset: "chat", className: "chat-photo", defer: true })}</div>`;
    } else if (msg.audio_url) {
      inner = `
        <div class="audio-bubble bubble ${isMine ? "mine" : "theirs"}" id="audio-${msg.id}">
          <span>${playingId === msg.id ? iconSvg("pause") : iconSvg("play")}</span>
          <div class="audio-wave"></div>
          <span>${formatDuration(msg.audio_duration || 0)}</span>
        </div>`;
    } else {
      inner = `<div class="bubble ${isMine ? "mine" : "theirs"}">${msg.content}</div>`;
    }

    const tick = isMine ? `<div class="tick">${msg.read_at ? "✓✓" : "✓"}</div>` : "";
    return `<div class="bubble-row ${rowClass}" id="msg-${msg.id}">${inner}${tick}</div>`;
  }

  function openViewer(url) {
    document.getElementById("viewerImg").src = optimizeImageUrl(url, "full");
    document.getElementById("viewerOverlay").classList.add("open");
  }
  document.getElementById("viewerBackBtn").addEventListener("click", () => {
    document.getElementById("viewerOverlay").classList.remove("open");
  });

  async function handlePlayAudio(messageId, audioUrl) {
    if (playingId === messageId) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      playingId = null;
      renderMessages();
      return;
    }
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    currentAudio = new Audio(audioUrl);
    currentAudio.preload = isLowData() ? "none" : "auto";
    playingId = messageId;
    renderMessages();
    currentAudio.play();
    currentAudio.onended = () => { playingId = null; renderMessages(); };
  }

  function buildComposerOnce() {
    const quickWrap = document.getElementById("quickReplyWrap");
    quickWrap.innerHTML = `<div class="quick-reply-row" id="quickReplyRow">${QUICK_REPLIES.map(r => `<div class="quick-reply-chip" data-reply="${r}">${r}</div>`).join("")}</div>`;
    quickWrap.querySelectorAll("[data-reply]").forEach(el =>
      el.addEventListener("click", () => sendMessagePayload({ content: el.dataset.reply }))
    );

    const inputWrap = document.getElementById("inputWrap");
    inputWrap.innerHTML = `
      <div class="input-row" id="inputRow">
        <button class="photo-btn" id="photoBtn" aria-label="Send photo">${iconSvg("camera")}</button>
        <input type="file" id="photoInput" accept="image/*" style="display:none;" />
        <textarea class="msg-input" id="msgInput" placeholder="Type a message..." rows="1"></textarea>
        <button class="mic-btn" id="composerActionBtn" aria-label="Record voice message">${iconSvg("mic")}</button>
      </div>
      <div class="recording-row" id="recordingRow" style="display:none;">
        <div class="recording-dot"></div>
        <div class="recording-text" id="recordingText">Recording... 0:00</div>
        <button class="cancel-record-btn" id="cancelRecordBtn">Cancel</button>
        <button class="stop-record-btn" id="stopRecordBtn">Send</button>
      </div>`;

    const msgInput = document.getElementById("msgInput");
    const actionBtn = document.getElementById("composerActionBtn");

    function updateActionBtn() {
      if (msgInput.value.trim()) {
        actionBtn.className = "send-btn";
        actionBtn.innerHTML = iconSvg("send");
        actionBtn.setAttribute("aria-label", "Send message");
      } else {
        actionBtn.className = "mic-btn";
        actionBtn.innerHTML = iconSvg("mic");
        actionBtn.setAttribute("aria-label", "Record voice message");
      }
    }
    msgInput.addEventListener("input", () => {
      updateActionBtn();
      notifyTyping(userId);
    });
    msgInput.addEventListener("blur", () => stopTyping(userId));
    msgInput.addEventListener("focus", () => setTimeout(setVH, 300));

    actionBtn.addEventListener("click", () => {
      if (msgInput.value.trim()) {
        const content = msgInput.value;
        msgInput.value = "";
        updateActionBtn();
        stopTyping(userId);
        sendMessagePayload({ content });
      } else {
        startRecording();
      }
    });

    document.getElementById("photoBtn").addEventListener("click", () => document.getElementById("photoInput").click());
    document.getElementById("photoInput").addEventListener("change", handlePickPhoto);
    document.getElementById("cancelRecordBtn").addEventListener("click", cancelRecording);
    document.getElementById("stopRecordBtn").addEventListener("click", stopRecording);
  }

  function updateComposerVisibility() {
    const isBlocked = iBlockedThem || theyBlockedMe;
    const isSupportChat = otherUser?.is_admin === true;
    const quickRow = document.getElementById("quickReplyRow");
    const inputRow = document.getElementById("inputRow");
    if (!quickRow || !inputRow) return;

    if (isBlocked) {
      quickRow.style.display = "none";
      inputRow.style.display = "none";
      return;
    }
    quickRow.style.display = isSupportChat ? "none" : "flex";
    inputRow.style.display = "flex";
  }

  function restoreComposerAfterRecording() {
    const recordingRow = document.getElementById("recordingRow");
    if (recordingRow) recordingRow.style.display = "none";
    updateComposerVisibility();
  }

  async function sendMessagePayload(payload) {
    try {
      const res = await fetch(`${API_URL}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ receiver_id: userId, ...payload })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Could not send message."); return; }
      loadMessages(false);
    } catch (e) {}
  }

  async function handlePickPhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
      const data = await res.json();
      if (!data.secure_url) { alert("Could not upload the photo. Please try again."); return; }
      await sendMessagePayload({ photo_url: data.secure_url });
    } catch (e) {
      alert("Could not upload the photo.");
    }
    e.target.value = "";
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      recordingSeconds = 0;

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.start();

      const quickRow = document.getElementById("quickReplyRow");
      const inputRow = document.getElementById("inputRow");
      const recordingRow = document.getElementById("recordingRow");
      if (quickRow) quickRow.style.display = "none";
      if (inputRow) inputRow.style.display = "none";
      recordingRow.style.display = "flex";
      document.getElementById("recordingText").textContent = "Recording... 0:00";

      recordingTimer = setInterval(() => {
        recordingSeconds++;
        document.getElementById("recordingText").textContent = `Recording... ${formatDuration(recordingSeconds)}`;
      }, 1000);
    } catch (e) {
      alert("We need microphone access to record a voice note.");
    }
  }

  function cancelRecording() {
    clearInterval(recordingTimer);
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    mediaRecorder = null;
    recordingSeconds = 0;
    restoreComposerAfterRecording();
  }

  function stopRecording() {
    clearInterval(recordingTimer);
    const duration = recordingSeconds;
    if (!mediaRecorder) return;

    mediaRecorder.onstop = async () => {
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      if (duration < 1) { restoreComposerAfterRecording(); return; }

      const blob = new Blob(audioChunks, { type: "audio/webm" });
      try {
        const formData = new FormData();
        formData.append("file", blob, `voice_${Date.now()}.webm`);
        formData.append("upload_preset", UPLOAD_PRESET);
        formData.append("resource_type", "video");

        const res = await fetch(CLOUDINARY_AUDIO_URL, { method: "POST", body: formData });
        const data = await res.json();
        if (!data.secure_url) { alert("Could not upload the voice note. Please try again."); restoreComposerAfterRecording(); return; }

        await sendMessagePayload({ audio_url: data.secure_url, audio_duration: duration });
      } catch (e) {
        alert("Could not save the voice note.");
      }
      recordingSeconds = 0;
      restoreComposerAfterRecording();
    };

    mediaRecorder.stop();
  }

  function openMessageActions(messageId) {
    const msg = messages.find(m => m.id === messageId);
    const isMine = currentUser && msg?.sender_id === currentUser.id;
    const canUnsend = isMine && msg && !msg.read_at;

    const box = document.getElementById("messageActionsBox");
    box.innerHTML = `
      ${canUnsend ? `<button class="menu-row danger" id="unsendBtn">${iconSvg("trash", 18)} Delete for Everyone</button>` : ""}
      <button class="menu-row" id="deleteForMeBtn">${iconSvg("trash", 18)} Delete for Me</button>
      <button class="menu-cancel-btn" id="msgActionsCancelBtn">Cancel</button>
    `;
    document.getElementById("messageActionsOverlay").classList.add("open");

    if (canUnsend) {
      document.getElementById("unsendBtn").addEventListener("click", () => handleDeleteForEveryone(messageId));
    }
    document.getElementById("deleteForMeBtn").addEventListener("click", () => handleDeleteForMe(messageId));
    document.getElementById("msgActionsCancelBtn").addEventListener("click", () => {
      document.getElementById("messageActionsOverlay").classList.remove("open");
    });
  }
  document.getElementById("messageActionsOverlay").addEventListener("click", (e) => {
    if (e.target.id === "messageActionsOverlay") e.target.classList.remove("open");
  });

  async function handleDeleteForMe(messageId) {
    document.getElementById("messageActionsOverlay").classList.remove("open");
    try {
      await fetch(`${API_URL}/messages/${messageId}/delete-for-me`, { method: "PUT", headers: authHeaders() });
      messages = messages.filter(m => m.id !== messageId);
      renderMessages();
    } catch (e) {
      alert("Could not delete message.");
    }
  }

  async function handleDeleteForEveryone(messageId) {
    document.getElementById("messageActionsOverlay").classList.remove("open");
    try {
      const res = await fetch(`${API_URL}/messages/${messageId}/delete-for-everyone`, { method: "PUT", headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Could not unsend this message."); return; }
      loadMessages(false);
    } catch (e) {
      alert("Could not unsend message.");
    }
  }

  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("viewContactBtn").style.display = otherUser?.is_admin ? "none" : "block";
    document.getElementById("menuOverlay").classList.add("open");
  });
  document.getElementById("menuCancelBtn").addEventListener("click", () => document.getElementById("menuOverlay").classList.remove("open"));
  document.getElementById("menuOverlay").addEventListener("click", (e) => {
    if (e.target.id === "menuOverlay") e.target.classList.remove("open");
  });

  document.getElementById("viewContactBtn").addEventListener("click", () => {
    document.getElementById("menuOverlay").classList.remove("open");
    if (otherUser?.is_admin) return;
    if (!otherUser?.phone) return;
    if (confirm(`${otherUser.display_name}\n${otherUser.phone}\n\nTap OK to call.`)) {
      window.location.href = `tel:${otherUser.phone}`;
    }
  });

  document.getElementById("reportUserBtn").addEventListener("click", () => {
    document.getElementById("menuOverlay").classList.remove("open");
    window.location.href = "/report-user.html";
  });

  document.getElementById("blockToggleBtn").addEventListener("click", async () => {
    document.getElementById("menuOverlay").classList.remove("open");
    if (iBlockedThem) {
      if (!confirm("Unblock this user? You will be able to message each other again.")) return;
      try {
        const res = await fetch(`${API_URL}/messages/block/${userId}`, { method: "DELETE", headers: authHeaders() });
        if (!res.ok) { alert("Could not unblock this user. Please try again."); return; }
        iBlockedThem = false;
        loadMessages(false);
      } catch (e) {
        alert("Could not connect to the server.");
      }
    } else {
      if (!confirm("Block this user? They will no longer be able to message you.")) return;
      try {
        const res = await fetch(`${API_URL}/messages/block/${userId}`, { method: "POST", headers: authHeaders() });
        if (!res.ok) { alert("Could not block this user. Please try again."); return; }
        iBlockedThem = true;
        loadMessages(false);
      } catch (e) {
        alert("Could not connect to the server.");
      }
    }
  });

  function updateBlockButtonLabel() {
    document.getElementById("blockToggleBtn").innerHTML = iBlockedThem
      ? `${iconSvg("check", 18)} Unblock User`
      : `${iconSvg("block", 18)} Block User`;
  }

  if (!currentUser) {
    window.location.href = "/login.html";
  } else {
    buildComposerOnce();
    updateComposerVisibility();
    setTimeout(updateComposerVisibility, 300);
    startPresenceHeartbeat();
    loadOtherUser();
    loadMessages(true);
    refreshPresence();
    pollTimer = setInterval(() => loadMessages(false), getPollInterval(POLL_INTERVAL));
    presenceTimer = setInterval(refreshPresence, getPollInterval(POLL_INTERVAL));
    window.addEventListener("langchange", refreshPresence);
    window.addEventListener("pagehide", () => {
      stopTyping(userId);
      stopPresenceHeartbeat();
    });
  }
</script>
</body>
</html>
