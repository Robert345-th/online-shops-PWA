<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<title>ZedMarket - Request Name Change</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .center-box { display: flex; align-items: center; justify-content: center; padding: 100px 24px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .current-name-text { font-size: 13px; margin-bottom: 14px; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; font-size: 14px; }
  .note-text { font-size: 11px; color: var(--subtext); margin-bottom: 16px; font-style: italic; }
  .pending-box { background: var(--warn-bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .pending-text { font-size: 12px; color: var(--warn-text); }

  .save-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 14px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .save-btn:disabled { opacity: 0.7; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title">Request Name Change</div>
</div>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const app = document.getElementById("app");

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  async function loadProfile() {
    let shopName = "", pendingShopName = "", shopNameStatus = null;
    try {
      const res = await fetch(`${API_URL}/auth/shop-profile`, { headers: authHeaders() });
      const data = await res.json();
      shopName = data.shop_name || "";
      pendingShopName = data.pending_shop_name || "";
      shopNameStatus = data.shop_name_status || null;
    } catch (e) {}
    render(shopName, pendingShopName, shopNameStatus);
  }

  function render(shopName, pendingShopName, shopNameStatus) {
    app.innerHTML = `
      <div class="content">
        <div class="label">Shop Name</div>
        <div class="current-name-text">Current: ${shopName}</div>

        ${shopNameStatus === "pending" ? `
          <div class="pending-box">
            <div class="pending-text">⏳ "${pendingShopName}" is awaiting approval. You can't submit another change until this is resolved.</div>
          </div>
        ` : `
          <input class="field-input" id="newNameInput" placeholder="Enter a new shop name" />
          <div class="note-text">Name changes require admin approval before they take effect.</div>
          <button class="save-btn" id="submitBtn">Request Name Change</button>
        `}
      </div>`;

    const submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.addEventListener("click", submitNameChange);
  }

  async function submitNameChange() {
    const newShopName = document.getElementById("newNameInput").value.trim();
    if (!newShopName) {
      alert("Please enter a new shop name.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const res = await fetch(`${API_URL}/auth/shop-profile`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ new_shop_name: newShopName })
      });

      if (!res.ok) {
        const data = await res.json();
        alert(data.error || "Could not submit your name change.");
        return;
      }

      alert("Submitted — your new shop name is awaiting approval.");
      window.location.href = "/edit-shop-profile.html";
    } catch (err) {
      alert("Could not submit your name change: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Request Name Change";
    }
  }

  if (!token) {
    window.location.href = "/login.html";
  } else {
    loadProfile();
  }
</script>
</body>
</html>
