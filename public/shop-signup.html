<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Register Your Shop</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 24px; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 18px; font-size: 14px; }
  .phone-row { display: flex; margin-bottom: 18px; gap: 8px; }
  .phone-prefix { background: var(--black); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--gold); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; }

  .upload-box {
    background: var(--card); border: 1.5px dashed var(--border); border-radius: 12px;
    height: 140px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px; overflow: hidden; cursor: pointer;
  }
  .upload-text { color: var(--subtext); font-size: 13px; }
  .upload-preview { width: 100%; height: 100%; object-fit: cover; }
  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.7; }
  .link { display: block; text-align: center; color: var(--price-red); margin-top: 20px; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="content">
  <div class="title">Register Your Shop</div>
  <div class="subtitle">Verified shops need an NRC and photo for trust & safety</div>

  <div class="label">Full Name</div>
  <input class="field-input" id="nameInput" placeholder="e.g. Robert Banda" />

  <div class="label">Date of Birth</div>
  <input class="field-input" id="dobInput" type="date" max="" />

  <div class="label">Phone Number</div>
  <div class="phone-row">
    <div class="phone-prefix"><span>🇿🇲 +260</span></div>
    <input class="phone-input" id="phoneInput" placeholder="e.g. 0977123456" maxlength="10" inputmode="tel" />
  </div>

  <div class="label">Password</div>
  <input class="field-input" id="passwordInput" type="password" placeholder="Create a password (8-15 characters)" maxlength="15" />

  <div class="label">Confirm Password</div>
  <input class="field-input" id="confirmPasswordInput" type="password" placeholder="Re-enter your password" maxlength="15" />

  <div class="label">NRC Number</div>
  <input class="field-input" id="nrcNumberInput" placeholder="e.g. 123456/78/1" />

  <div class="label">NRC Photo</div>
  <div class="upload-box" id="nrcBox"><div class="upload-text">📷 Tap to upload NRC photo</div></div>
  <input type="file" id="nrcInput" accept="image/*" style="display:none;" />

  <div class="label">Selfie Photo</div>
  <div class="upload-box" id="selfieBox"><div class="upload-text">🤳 Tap to upload a selfie</div></div>
  <input type="file" id="selfieInput" accept="image/*" capture="user" style="display:none;" />

  <button class="submit-btn" id="submitBtn">Submit for Review</button>

  <a class="link" href="/login.html">Already have an account? Log in</a>
</div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/kstg72vx/image/upload";
  const UPLOAD_PRESET = "online_shops_uploads";

  let nrcPhotoUrl = "";
  let selfiePhotoUrl = "";

  document.getElementById("dobInput").max = new Date().toISOString().slice(0, 10);

  function isValidZambianPhone(phone) {
    return /^0(7|9)\d{8}$/.test(phone);
  }

  document.getElementById("nrcBox").addEventListener("click", () => document.getElementById("nrcInput").click());
  document.getElementById("selfieBox").addEventListener("click", () => document.getElementById("selfieInput").click());
  document.getElementById("nrcInput").addEventListener("change", (e) => handleUpload(e, "nrc"));
  document.getElementById("selfieInput").addEventListener("change", (e) => handleUpload(e, "selfie"));

  async function handleUpload(e, target) {
    const file = e.target.files[0];
    if (!file) return;

    const boxId = target === "nrc" ? "nrcBox" : "selfieBox";
    const box = document.getElementById(boxId);
    box.innerHTML = `<div class="spinner"></div>`;

    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
      const data = await res.json();

      if (!data.secure_url) {
        alert("Could not upload the photo. Please try again.");
        box.innerHTML = `<div class="upload-text">${target === "nrc" ? "📷 Tap to upload NRC photo" : "🤳 Tap to upload a selfie"}</div>`;
        return;
      }

      if (target === "nrc") nrcPhotoUrl = data.secure_url;
      else selfiePhotoUrl = data.secure_url;

      box.innerHTML = `<img class="upload-preview" src="${data.secure_url}" />`;
    } catch (err) {
      alert("Could not upload the photo. Please try again.");
      box.innerHTML = `<div class="upload-text">${target === "nrc" ? "📷 Tap to upload NRC photo" : "🤳 Tap to upload a selfie"}</div>`;
    }
  }

  function isValidDateOfBirth(dob) {
    if (!dob) return false;
    const birth = new Date(dob + "T00:00:00");
    if (Number.isNaN(birth.getTime())) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (birth >= today) return false;
    const minAgeDate = new Date(today);
    minAgeDate.setFullYear(minAgeDate.getFullYear() - 18);
    return birth <= minAgeDate;
  }

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const name = document.getElementById("nameInput").value.trim();
    const dateOfBirth = document.getElementById("dobInput").value;
    const phone = document.getElementById("phoneInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const confirmPassword = document.getElementById("confirmPasswordInput").value;
    const nrcNumber = document.getElementById("nrcNumberInput").value.trim();

    if (!name || !dateOfBirth || !phone || !password || !confirmPassword || !nrcNumber) {
      alert("Please fill in all fields.");
      return;
    }
    if (!isValidDateOfBirth(dateOfBirth)) {
      alert("Please enter a valid date of birth. You must be at least 18 years old.");
      return;
    }
    if (!isValidZambianPhone(phone)) {
      alert("Please enter a valid Zambian phone number (e.g. 0977123456).");
      return;
    }
    if (password.length < 8 || password.length > 15) {
      alert("Password must be between 8 and 15 characters.");
      return;
    }
    if (password !== confirmPassword) {
      alert("Passwords don't match. Please make sure both passwords are the same.");
      return;
    }
    if (!nrcPhotoUrl) {
      alert("Please upload a photo of your NRC.");
      return;
    }
    if (!selfiePhotoUrl) {
      alert("Please upload a selfie.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const res = await fetch(`${API_URL}/auth/shop-signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name, date_of_birth: dateOfBirth, phone, password, confirmPassword,
          nrc_number: nrcNumber,
          nrc_photo_url: nrcPhotoUrl,
          selfie_photo_url: selfiePhotoUrl
        })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      window.location.href = `/verify-otp.html?phone=${encodeURIComponent(phone)}`;
    } catch (err) {
      alert("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit for Review";
    }
  });
</script>
</body>
</html>
