<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Sign Up</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --btn-disabled: #D6A3A6;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { min-height: 100vh; padding: 24px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; }
  .title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--subtext); margin-bottom: 32px; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 18px; font-size: 14px; }
  .phone-row { display: flex; margin-bottom: 6px; gap: 8px; }
  .phone-prefix { background: var(--black); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--gold); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; }
  .phone-hint { font-size: 11.5px; color: var(--subtext); margin-bottom: 18px; }
  .phone-hint b { color: var(--text); }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: -8px; margin-bottom: 14px; cursor: pointer; }
  .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--subtext); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .checkbox.checked { background: var(--red-btn); border-color: var(--red-btn); }
  .checkbox-label { font-size: 12px; color: var(--subtext); flex: 1; }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { background: var(--btn-disabled); cursor: not-allowed; }
  .link { display: block; text-align: center; color: var(--price-red); margin-top: 20px; font-size: 13px; text-decoration: none; }

  /* Styled inline banners, replacing the browser's native alert() popups */
  .form-banner {
    display: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .form-banner.error {
    background: #FBE7E8;
    color: var(--price-red);
    border: 1px solid #F0C1C4;
  }
  .form-banner.show { display: block; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="content">
  <div class="title">Create Account</div>
  <div class="subtitle">Join ZedMarket</div>

  <div class="form-banner error" id="errorBanner"></div>

  <div class="label">Full Name</div>
  <input class="field-input" id="nameInput" placeholder="e.g. Robert Banda" />

  <div class="label">Phone Number</div>
  <div class="phone-row">
    <div class="phone-prefix"><span>🇿🇲 +260</span></div>
    <input class="phone-input" id="phoneInput" placeholder="e.g. 0977123456" maxlength="10" inputmode="tel" />
  </div>
  <div class="phone-hint">Only <b>Airtel</b> allowed</div>

  <div class="label">Password</div>
  <input class="field-input" id="passwordInput" type="password" placeholder="Create a password (8-15 characters)" maxlength="15" />

  <div class="label">Confirm Password</div>
  <input class="field-input" id="confirmPasswordInput" type="password" placeholder="Re-enter your password" maxlength="15" />

  <div class="checkbox-row" id="showPasswordRow">
    <div class="checkbox" id="showPasswordBox"></div>
    <div class="checkbox-label">Show password</div>
  </div>

  <div class="label">Referral Code (optional)</div>
  <input class="field-input" id="referralInput" placeholder="Have a friend's code? Enter it here" style="text-transform:uppercase;" />

  <div class="checkbox-row" id="ageConfirmRow">
    <div class="checkbox" id="ageConfirmBox"></div>
    <div class="checkbox-label">I confirm that I am 18 years of age or older</div>
  </div>

  <button class="submit-btn" id="signupBtn" disabled>Sign Up</button>

  <a class="link" href="/login.html">Already have an account? Log in</a>
</div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";

  const nameInput = document.getElementById("nameInput");
  const phoneInput = document.getElementById("phoneInput");
  const passwordInput = document.getElementById("passwordInput");
  const confirmPasswordInput = document.getElementById("confirmPasswordInput");
  const referralInput = document.getElementById("referralInput");
  const signupBtn = document.getElementById("signupBtn");
  const errorBanner = document.getElementById("errorBanner");

  // Replaces alert() - shows a styled banner above the form instead of the
  // browser's native popup, and scrolls it into view so it's never missed.
  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
    errorBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearError() {
    errorBanner.classList.remove("show");
  }

  let showPassword = false;
  const showPasswordBox = document.getElementById("showPasswordBox");
  document.getElementById("showPasswordRow").addEventListener("click", () => {
    showPassword = !showPassword;
    showPasswordBox.classList.toggle("checked", showPassword);
    showPasswordBox.textContent = showPassword ? "✓" : "";
    passwordInput.type = showPassword ? "text" : "password";
    confirmPasswordInput.type = showPassword ? "text" : "password";
  });

  let ageConfirmed = false;
  const ageConfirmBox = document.getElementById("ageConfirmBox");
  document.getElementById("ageConfirmRow").addEventListener("click", () => {
    ageConfirmed = !ageConfirmed;
    ageConfirmBox.classList.toggle("checked", ageConfirmed);
    ageConfirmBox.textContent = ageConfirmed ? "✓" : "";
    signupBtn.disabled = !ageConfirmed;
  });

  // Only allows Airtel Zambia number ranges: 0573, 0574, 077, 097
  // (each variant must total 10 digits, e.g. 0573123456, 0771234567)
  function isValidZambianPhone(phone) {
    return /^(0573\d{6}|0574\d{6}|077\d{7}|097\d{7})$/.test(phone);
  }

  signupBtn.addEventListener("click", async () => {
    clearError();
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    const referralCode = referralInput.value.trim();

    if (!name || !phone || !password || !confirmPassword) {
      showError("Please fill in all fields.");
      return;
    }
    if (!isValidZambianPhone(phone)) {
      showError("Only Airtel allowed.");
      return;
    }
    if (password.length < 8 || password.length > 15) {
      showError("Password must be between 8 and 15 characters.");
      return;
    }
    if (password !== confirmPassword) {
      showError("Passwords don't match. Please make sure both passwords are the same.");
      return;
    }
    if (!ageConfirmed) {
      showError("You must confirm you are 18 years or older to create an account.");
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = "Creating account…";

    try {
      const res = await fetch(`${API_URL}/auth/signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name, phone, password, confirmPassword,
          referral_code: referralCode || undefined
        })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Something went wrong.");
        return;
      }

      window.location.href = `/verify-otp.html?phone=${encodeURIComponent(phone)}`;
    } catch (e) {
      showError("Could not connect to the server.");
    } finally {
      signupBtn.disabled = !ageConfirmed;
      signupBtn.textContent = "Sign Up";
    }
  });
</script>
</body>
</html>
