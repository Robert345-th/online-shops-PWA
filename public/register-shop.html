<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Register Your Shop</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }
  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .step-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 20px; line-height: 1.4; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .skip-hint { font-size: 11px; color: var(--subtext); margin-top: -12px; margin-bottom: 18px; font-style: italic; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 18px; font-size: 14px; }
  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.7; }

  .form-banner {
    display: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .form-banner.error { background: #FBE7E8; color: var(--price-red); border: 1px solid #F0C1C4; }
  .form-banner.success { background: #E7F5EA; color: #1E7A38; border: 1px solid #BFE6C9; }
  .form-banner.show { display: block; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" id="backBtn" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title">Register Your Shop</div>
</div>
<div class="content" id="content"></div>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const content = document.getElementById("content");

  document.getElementById("backBtn").addEventListener("click", () => history.back());

  function showError(message) {
    const banner = document.getElementById("formBanner");
    if (!banner) return;
    banner.textContent = message;
    banner.className = "form-banner error show";
    banner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function showSuccess(message) {
    const banner = document.getElementById("formBanner");
    if (!banner) return;
    banner.textContent = message;
    banner.className = "form-banner success show";
    banner.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function render() {
    const user = JSON.parse(localStorage.getItem("zm_user") || "null");
    const defaultName = user?.name || user?.display_name || "";
    content.innerHTML = `
      <div class="step-title">Shop Details</div>
      <div class="subtitle">Set up your shop to start selling on ZedMarket. We need your name and date of birth for verification.</div>
      <div class="form-banner" id="formBanner"></div>
      <div class="label">Full Name</div>
      <input class="field-input" id="fullNameInput" placeholder="e.g. Robert Banda" value="${defaultName.replace(/"/g, "&quot;")}" />
      <div class="label">Date of Birth</div>
      <input class="field-input" id="dobInput" type="date" max="${new Date().toISOString().slice(0, 10)}" />
      <div class="label">Shop Name (optional)</div>
      <input class="field-input" id="shopNameInput" placeholder="e.g. Robert's Electronics" />
      <div class="skip-hint">Leave shop name blank to use your account name — you can add one later anytime.</div>
      <button class="submit-btn" id="submitBtn">Submit for Review</button>
    `;
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
  }

  function isValidDateOfBirth(dob) {
    if (!dob) return false;
    const birth = new Date(dob + "T00:00:00");
    if (Number.isNaN(birth.getTime())) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (birth >= today) return false;
    const minAgeDate = new Date(today);
    minAgeDate.setFullYear(minAgeDate.getFullYear() - 18);
    return birth <= minAgeDate;
  }

  async function handleSubmit() {
    const fullName = document.getElementById("fullNameInput").value.trim();
    const dateOfBirth = document.getElementById("dobInput").value;
    const shopName = document.getElementById("shopNameInput").value.trim();
    if (!fullName) {
      showError("Please enter your full name.");
      return;
    }
    if (!dateOfBirth) {
      showError("Please enter your date of birth.");
      return;
    }
    if (!isValidDateOfBirth(dateOfBirth)) {
      showError("You must be at least 18 years old to register a shop.");
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    try {
      const res = await fetch(`${API_URL}/auth/register-shop`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          name: fullName,
          date_of_birth: dateOfBirth,
          shop_name: shopName || null
        })
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || "Could not submit registration.");
        return;
      }
      showSuccess("Submitted — your shop registration is under review. You will be notified once approved.");
      setTimeout(() => { window.location.href = "/my-shop.html"; }, 1800);
    } catch (e) {
      showError("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit for Review";
    }
  }

  if (!token) {
    window.location.href = "/login.html";
  } else {
    render();
  }
</script>
</body>
</html>
