<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Verify Phone</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --price-red: #A3131C; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 28px; }
  .otp-input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 20px; font-size: 24px; text-align: center; letter-spacing: 8px;
  }
  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 20px; }
  .submit-btn:disabled { opacity: 0.7; }
  .link { display: block; width: 100%; text-align: center; color: var(--price-red); font-size: 13px; background: none; border: none; cursor: pointer; }
  .link:disabled { opacity: 0.6; cursor: default; color: var(--subtext); }

  .form-banner {
    display: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .form-banner.error {
    background: #FBE7E8;
    color: var(--price-red);
    border: 1px solid #F0C1C4;
  }
  .form-banner.success {
    background: #E7F5EC;
    color: #1F7A43;
    border: 1px solid #BFE5CE;
  }
  .form-banner.show { display: block; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="content">
  <div class="title" data-i18n="verify_phone">Verify Your Phone</div>
  <div class="subtitle" id="subtitleText" data-i18n="verify_otp_sub_generic">Enter the 6-digit code sent to your phone</div>

  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>

  <input class="otp-input" id="otpInput" data-i18n-placeholder="otp_placeholder" placeholder="000000" maxlength="6" inputmode="numeric" />

  <button class="submit-btn" id="verifyBtn" data-i18n="verify">Verify</button>

  <button class="link" id="resendBtn" data-i18n="resend_code">Didn't get a code? Resend</button>
</div>

<script src="/js/lang.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const params = new URLSearchParams(window.location.search);
  const phone = params.get("phone") || "";

  const RESEND_COOLDOWN_MS = 60 * 1000;
  const RESEND_STORAGE_KEY = "zm_otp_resend_until_" + (phone || "unknown");

  const otpInput = document.getElementById("otpInput");
  const verifyBtn = document.getElementById("verifyBtn");
  const resendBtn = document.getElementById("resendBtn");
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");
  const subtitleText = document.getElementById("subtitleText");

  let countdownInterval = null;

  function updateSubtitle() {
    subtitleText.textContent = phone
      ? t("verify_otp_sub", { phone })
      : t("verify_otp_sub_generic");
  }
  updateSubtitle();

  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
    errorBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
    successBanner.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearBanners() {
    errorBanner.classList.remove("show");
    successBanner.classList.remove("show");
  }

  // Persistent resend cooldown — stores the timestamp resend becomes available
  // again in localStorage, so closing/reloading the page (or trying to cheat
  // the timer) doesn't reset it. The countdown always resumes from the real
  // remaining time, not from zero.
  function startResendCountdown(untilTimestamp) {
    if (countdownInterval) clearInterval(countdownInterval);
    resendBtn.disabled = true;

    function tick() {
      const remainingMs = untilTimestamp - Date.now();
      if (remainingMs <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        localStorage.removeItem(RESEND_STORAGE_KEY);
        resendBtn.disabled = false;
        resendBtn.textContent = t("resend_code");
        return;
      }
      const secondsLeft = Math.ceil(remainingMs / 1000);
      resendBtn.textContent = t("resend_available_in", { seconds: secondsLeft }) ||
        `Resend available in ${secondsLeft}s`;
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function checkExistingCooldown() {
    const stored = parseInt(localStorage.getItem(RESEND_STORAGE_KEY) || "0", 10);
    if (stored && stored > Date.now()) {
      startResendCountdown(stored);
    }
  }
  checkExistingCooldown();

  verifyBtn.addEventListener("click", async () => {
    clearBanners();
    const otp = otpInput.value.trim();
    if (!otp) {
      showError(t("otp_enter_code"));
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = t("verifying");

    try {
      const res = await fetch(`${API_URL}/auth/verify-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, otp })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || t("chat_server_fail"));
        return;
      }

      localStorage.setItem("zm_token", data.token);
      localStorage.setItem("zm_user", JSON.stringify(data.user));
      showSuccess(t("otp_verified_welcome", { name: data.user.name }));
      setTimeout(() => { window.location.href = "/index.html"; }, 700);
    } catch (e) {
      showError(t("chat_server_fail"));
    } finally {
      verifyBtn.disabled = false;
      verifyBtn.textContent = t("verify");
    }
  });

  resendBtn.addEventListener("click", async () => {
    clearBanners();
    resendBtn.disabled = true;
    resendBtn.textContent = t("sending");

    try {
      const res = await fetch(`${API_URL}/auth/resend-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || t("otp_resend_fail"));
        resendBtn.disabled = false;
        resendBtn.textContent = t("resend_code");
        return;
      }

      showSuccess(t("otp_sent"));
      const until = Date.now() + RESEND_COOLDOWN_MS;
      localStorage.setItem(RESEND_STORAGE_KEY, String(until));
      startResendCountdown(until);
    } catch (e) {
      showError(t("chat_server_fail"));
      resendBtn.disabled = false;
      resendBtn.textContent = t("resend_code");
    }
  });

  window.addEventListener("langchange", () => {
    updateSubtitle();
    if (!verifyBtn.disabled) verifyBtn.textContent = t("verify");
  });
</script>
</body>
</html>
