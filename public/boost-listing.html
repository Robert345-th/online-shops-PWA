<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Boost Listing</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --red-btn: #E01B27;
    --warn-bg: #FFF3E0; --warn-text: #7A3E00; --green-bg: #E7F5E9; --green-text: #2F4F3E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .center-box { display: flex; align-items: center; justify-content: center; padding: 100px 24px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-button {
    width: 36px; height: 36px; border-radius: 18px; background: var(--black);
    display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: var(--gold); font-size: 18px;
  }
  .header-title { font-size: 18px; font-weight: 700; }

  .info-box { background: var(--warn-bg); border: 1px solid var(--orange); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .info-title { font-size: 14px; font-weight: 700; color: var(--warn-text); margin-bottom: 6px; }
  .info-text { font-size: 12px; color: var(--warn-text); line-height: 1.4; }

  .credit-box { background: var(--black); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .credit-title { color: var(--gold); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .credit-text { color: #C9BFAF; font-size: 12px; margin-bottom: 12px; }
  .use-credit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 10px; padding: 13px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .use-credit-btn:disabled { opacity: 0.7; }

  .free-box { background: var(--green-bg); border: 1px solid var(--green-text); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .free-title { font-size: 14px; font-weight: 700; color: var(--green-text); margin-bottom: 6px; }
  .free-text { font-size: 12px; color: var(--green-text); line-height: 1.4; }

  .price-box { background: var(--card); border: 1.5px solid var(--orange); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px; }
  .price-label { font-size: 11px; color: var(--subtext); text-transform: uppercase; font-weight: 600; }
  .price-value { font-size: 32px; font-weight: 700; color: var(--price-red); margin-top: 4px; }
  .price-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }

  .instructions-box { background: var(--black); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .instructions-title { color: var(--gold); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .instructions-text { color: #C9BFAF; font-size: 12px; margin-bottom: 4px; }
  .phone-number { color: #fff; font-size: 18px; font-weight: 700; }
  .instructions-sub { color: #C9BFAF; font-size: 12px; margin-bottom: 8px; }

  .label { font-size: 11px; font-weight: 600; color: var(--subtext); margin-bottom: 8px; text-transform: uppercase; }
  .field-textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; font-size: 14px; min-height: 100px; resize: vertical; }

  .warning-box { background: var(--warn-bg); border-radius: 10px; padding: 10px; margin-bottom: 16px; }
  .warning-text { font-size: 11px; color: var(--warn-text); line-height: 1.3; }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .submit-btn:disabled { opacity: 0.7; }
</style>
</head>
<body>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const BOOST_PRICE = 50;
  const params = new URLSearchParams(window.location.search);
  const listingId = params.get("id");
  const token = localStorage.getItem("zm_token");
  const app = document.getElementById("app");

  let paymentEnforced = false;
  let freeCredits = 0;

  function maskBalance(text) {
    return text.replace(/(bal\s*is\s*(?:ZMW)?\s*)([\d,.]+)/i, (full, prefix, amount) => {
      return prefix + "█".repeat(amount.length);
    });
  }

  async function checkStatus() {
    try {
      const [statusRes, creditsRes] = await Promise.all([
        fetch(`${API_URL}/settings/payment-status`),
        fetch(`${API_URL}/boost/my-credits`, { headers: { Authorization: `Bearer ${token}` } })
      ]);
      const statusData = await statusRes.json();
      const creditsData = await creditsRes.json();
      paymentEnforced = statusData.enforced === true;
      freeCredits = creditsData.free_boost_credits || 0;
      render();
    } catch (e) {
      render();
    }
  }

  function render() {
    app.innerHTML = `
      <div class="content">
        <div class="top-row">
          <button class="back-button" onclick="history.back()">←</button>
          <div class="header-title">Boost This Listing</div>
        </div>

        <div class="info-box">
          <div class="info-title">🚀 What is Boosting?</div>
          <div class="info-text">Your listing jumps to the very top of the Home feed for 24 hours, getting seen by way more buyers.</div>
        </div>

        ${freeCredits > 0 ? `
          <div class="credit-box">
            <div class="credit-title">🎁 You have ${freeCredits} free Boost${freeCredits === 1 ? "" : "s"}!</div>
            <div class="credit-text">Earned from inviting friends. Use one now, no payment needed.</div>
            <button class="use-credit-btn" id="useCreditBtn">Use a Free Boost</button>
          </div>` : ""}

        ${!paymentEnforced ? `
          <div class="free-box">
            <div class="free-title">🎉 Free During Launch</div>
            <div class="free-text">Boosting is free for now while ZedMarket is growing. Just tap below to request a boost — it'll be reviewed and applied shortly.</div>
          </div>
          <button class="submit-btn" id="freeSubmitBtn">Request Boost</button>
        ` : `
          <div class="price-box">
            <div class="price-label">Boost Price</div>
            <div class="price-value">K${BOOST_PRICE}</div>
            <div class="price-sub">for 24 hours at the top</div>
          </div>

          <div class="instructions-box">
            <div class="instructions-title">How to Pay</div>
            <div class="instructions-text">1. Send K${BOOST_PRICE} via MTN MoMo or Airtel Money to:</div>
            <div class="phone-number">0778727201</div>
            <div class="instructions-sub">Name: Robert Zulu</div>
            <div class="instructions-text">2. Copy the transaction reference from your confirmation SMS</div>
            <div class="instructions-text">3. Paste it below and submit</div>
          </div>

          <div class="label">Transaction Reference</div>
          <textarea class="field-textarea" id="transactionRefInput" placeholder="Paste your confirmation SMS here"></textarea>
          <div class="warning-box">
            <div class="warning-text">⚠️ Submitting a fake or altered transaction reference is not allowed and may result in your account being blocked.</div>
          </div>

          <button class="submit-btn" id="paidSubmitBtn">Submit for Review</button>
        `}
      </div>`;

    const useCreditBtn = document.getElementById("useCreditBtn");
    if (useCreditBtn) useCreditBtn.addEventListener("click", handleUseCredit);

    const freeSubmitBtn = document.getElementById("freeSubmitBtn");
    if (freeSubmitBtn) freeSubmitBtn.addEventListener("click", () => handleSubmit(freeSubmitBtn));

    const paidSubmitBtn = document.getElementById("paidSubmitBtn");
    if (paidSubmitBtn) paidSubmitBtn.addEventListener("click", () => handleSubmit(paidSubmitBtn));

    const transactionRefInput = document.getElementById("transactionRefInput");
    if (transactionRefInput) {
      transactionRefInput.addEventListener("input", (e) => {
        const masked = maskBalance(e.target.value);
        if (masked !== e.target.value) e.target.value = masked;
      });
    }
  }

  async function handleUseCredit() {
    const btn = document.getElementById("useCreditBtn");
    btn.disabled = true;
    btn.textContent = "Boosting…";
    try {
      const res = await fetch(`${API_URL}/boost/${listingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ use_credit: true })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Something went wrong."); btn.disabled = false; btn.textContent = "Use a Free Boost"; return; }
      alert("Boosted! 🚀 Your listing is now at the top of the feed for 24 hours.");
      window.location.href = "/my-shop.html";
    } catch (e) {
      alert("Could not connect to the server.");
      btn.disabled = false;
      btn.textContent = "Use a Free Boost";
    }
  }

  async function handleSubmit(btn) {
    const refInput = document.getElementById("transactionRefInput");
    const transactionRef = refInput ? refInput.value.trim() : "";

    if (paymentEnforced && !transactionRef) {
      alert("Please enter your MoMo/Airtel transaction reference.");
      return;
    }

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Submitting…";

    try {
      const res = await fetch(`${API_URL}/boost/${listingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ transaction_ref: transactionRef || null })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      alert("Submitted — your boost request is being reviewed. Your listing will be boosted once approved.");
      window.location.href = "/my-shop.html";
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  if (!listingId) {
    app.innerHTML = `<div class="center-box">No listing specified.</div>`;
  } else if (!token) {
    window.location.href = "/login.html";
  } else {
    checkStatus();
  }
</script>
</body>
</html>
