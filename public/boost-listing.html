<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Boost Listing</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --red-btn: #E01B27;
    --warn-bg: #FFF3E0; --warn-text: #7A3E00; --green-bg: #E7F5E9; --green-text: #2F4F3E;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 24px; text-align: center; }
  .error-text { color: var(--price-red); margin-bottom: 16px; }
  .back-link { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-button {
    width: 40px; height: 40px; padding: 0; border-radius: 20px; background: var(--black);
    display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { font-size: 18px; font-weight: 700; }

  .info-box { background: var(--warn-bg); border: 1px solid var(--orange); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .info-title { font-size: 14px; font-weight: 700; color: var(--warn-text); margin-bottom: 6px; }
  .info-text { font-size: 12px; color: var(--warn-text); line-height: 1.4; }

  .credit-box { background: var(--black); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .credit-title { color: var(--gold); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .credit-text { color: #C9BFAF; font-size: 12px; margin-bottom: 12px; }
  .use-credit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 10px; padding: 13px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .use-credit-btn:disabled { opacity: 0.7; }

  .free-box { background: var(--green-bg); border: 1px solid var(--green-text); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .free-title { font-size: 14px; font-weight: 700; color: var(--green-text); margin-bottom: 6px; }
  .free-text { font-size: 12px; color: var(--green-text); line-height: 1.4; }

  .price-box { background: var(--card); border: 1.5px solid var(--orange); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px; }
  .price-label { font-size: 11px; color: var(--subtext); text-transform: uppercase; font-weight: 600; }
  .price-value { font-size: 32px; font-weight: 700; color: var(--price-red); margin-top: 4px; }
  .price-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }

  .instructions-box { background: var(--black); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .instructions-title { color: var(--gold); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .instructions-text { color: #C9BFAF; font-size: 12px; margin-bottom: 4px; }
  .phone-number { color: #fff; font-size: 18px; font-weight: 700; }
  .instructions-sub { color: #C9BFAF; font-size: 12px; margin-bottom: 8px; }

  .label { font-size: 11px; font-weight: 600; color: var(--subtext); margin-bottom: 8px; text-transform: uppercase; }
  .field-textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; font-size: 14px; min-height: 100px; resize: vertical; }

  .warning-box { background: var(--warn-bg); border-radius: 10px; padding: 10px; margin-bottom: 16px; }
  .warning-text { font-size: 11px; color: var(--warn-text); line-height: 1.3; }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .submit-btn:disabled { opacity: 0.7; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script src="/js/lang.js"></script>
<script src="/js/shop-gate.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const BOOST_PRICE = 50;
  const params = new URLSearchParams(window.location.search);
  const listingId = params.get("id");
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");
  const app = document.getElementById("app");

  let paymentEnforced = false;
  let freeCredits = 0;
  let payeePhone = "0778727201";
  let payeeName = "Robert Zulu";

  function maskBalance(text) {
    return text.replace(/(bal\s*is\s*(?:ZMW)?\s*)([\d,.]+)/i, (full, prefix, amount) => {
      return prefix + "█".repeat(amount.length);
    });
  }

  function showBlocked(message) {
    app.innerHTML = `
      <div class="center-box">
        <div class="error-text">${message}</div>
        <button class="back-link" onclick="window.location.href='/my-shop.html'">${t("go_back")}</button>
      </div>`;
  }

  async function checkStatus() {
    try {
      const [statusRes, creditsRes, listingRes, payeeRes] = await Promise.all([
        fetch(`${API_URL}/settings/payment-status`),
        fetch(`${API_URL}/boost/my-credits`, { headers: { Authorization: `Bearer ${token}` } }),
        fetch(`${API_URL}/listings/${listingId}`),
        fetch(`${API_URL}/settings/payment-details`).catch(() => null),
      ]);
      const statusData = await statusRes.json();
      const creditsData = await creditsRes.json();
      const listing = await listingRes.json();
      paymentEnforced = statusData.enforced === true;
      freeCredits = creditsData.free_boost_credits || 0;

      if (payeeRes && payeeRes.ok) {
        const payee = await payeeRes.json();
        if (payee.phone) payeePhone = payee.phone;
        if (payee.name) payeeName = payee.name;
      }

      if (!listingRes.ok) {
        showBlocked(listing.error || "Listing not found.");
        return;
      }
      if (Number(listing.seller_id) !== Number(user?.id)) {
        showBlocked("You can only boost your own listings.");
        return;
      }

      render();
    } catch (e) {
      showBlocked("Could not load this listing.");
    }
  }

  function render() {
    app.innerHTML = `
      <div class="content">
        <div class="top-row">
          <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
          <div class="header-title">${t("boost_title")}</div>
        </div>

        <div class="info-box">
          <div class="info-title">${t("boost_what_title")}</div>
          <div class="info-text">${t("boost_what_text")}</div>
        </div>

        ${freeCredits > 0 ? `
          <div class="credit-box">
            <div class="credit-title">${t("boost_free_credits", { count: freeCredits })}</div>
            <div class="credit-text">${t("boost_free_credits_sub")}</div>
            <button class="use-credit-btn" id="useCreditBtn">${t("use_free_boost")}</button>
          </div>` : ""}

        ${!paymentEnforced ? `
          <div class="free-box">
            <div class="free-title">${t("free_launch_upgrade_title")}</div>
            <div class="free-text">${t("boost_free_launch_text")}</div>
          </div>
          <button class="submit-btn" id="freeSubmitBtn">${t("request_boost")}</button>
        ` : `
          <div class="price-box">
            <div class="price-label">${t("boost_price_label")}</div>
            <div class="price-value">K${BOOST_PRICE}</div>
            <div class="price-sub">${t("boost_price_sub")}</div>
          </div>

          <div class="instructions-box">
            <div class="instructions-title">${t("how_to_pay")}</div>
            <div class="instructions-text">${t("pay_step_send", { amount: BOOST_PRICE })}</div>
            <div class="phone-number">${payeePhone}</div>
            <div class="instructions-sub">${t("pay_name")}: ${payeeName}</div>
            <div class="instructions-text">${t("pay_step_copy")}</div>
            <div class="instructions-text">${t("pay_step_paste")}</div>
          </div>

          <div class="label">${t("transaction_ref")}</div>
          <textarea class="field-textarea" id="transactionRefInput" placeholder="${t("paste_sms_placeholder")}"></textarea>
          <div class="warning-box">
            <div class="warning-text">${t("fake_ref_warning")}</div>
          </div>

          <button class="submit-btn" id="paidSubmitBtn">${t("submit_for_review")}</button>
        `}
      </div>`;

    const useCreditBtn = document.getElementById("useCreditBtn");
    if (useCreditBtn) useCreditBtn.addEventListener("click", handleUseCredit);

    const freeSubmitBtn = document.getElementById("freeSubmitBtn");
    if (freeSubmitBtn) freeSubmitBtn.addEventListener("click", () => handleSubmit(freeSubmitBtn));

    const paidSubmitBtn = document.getElementById("paidSubmitBtn");
    if (paidSubmitBtn) paidSubmitBtn.addEventListener("click", () => handleSubmit(paidSubmitBtn));

    const transactionRefInput = document.getElementById("transactionRefInput");
    if (transactionRefInput) {
      transactionRefInput.addEventListener("input", (e) => {
        const masked = maskBalance(e.target.value);
        if (masked !== e.target.value) e.target.value = masked;
      });
    }
  }

  async function handleUseCredit() {
    const btn = document.getElementById("useCreditBtn");
    btn.disabled = true;
    btn.textContent = t("boosting");
    try {
      const res = await fetch(`${API_URL}/boost/${listingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ use_credit: true })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Something went wrong."); btn.disabled = false; btn.textContent = t("use_free_boost"); return; }
      alert(t("boost_success"));
      window.location.href = "/my-shop.html";
    } catch (e) {
      alert("Could not connect to the server.");
      btn.disabled = false;
      btn.textContent = t("use_free_boost");
    }
  }

  async function handleSubmit(btn) {
    const refInput = document.getElementById("transactionRefInput");
    const transactionRef = refInput ? refInput.value.trim() : "";

    if (paymentEnforced && !transactionRef) {
      alert(t("enter_transaction_ref"));
      return;
    }

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = t("submitting");

    try {
      const res = await fetch(`${API_URL}/boost/${listingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ transaction_ref: transactionRef || null })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      alert(t("boost_submitted"));
      window.location.href = "/my-shop.html";
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  async function boot() {
    if (!listingId) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("no_listing_specified")}</div></div>`;
      return;
    }
    if (!token) {
      window.location.href = "/login.html";
      return;
    }
    try {
      const access = await fetchShopAccess(API_URL, token);
      if (!access.canSell) {
        showBlocked(t("post_need_shop_text"));
        return;
      }
      checkStatus();
    } catch (e) {
      showBlocked(t("post_need_shop_text"));
    }
  }

  boot();
</script>
</body>
</html>
