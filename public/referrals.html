<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Invite Friends</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; color: #fff; font-size: 18px;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .center-box { display: flex; align-items: center; justify-content: center; padding: 100px 24px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .explainer { font-size: 13px; color: var(--subtext); line-height: 1.5; margin-bottom: 20px; }

  .code-box { background: var(--black); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; }
  .code-label { color: #C9BFAF; font-size: 11px; text-transform: uppercase; margin-bottom: 8px; }
  .code-value { color: var(--gold); font-size: 32px; font-weight: 700; letter-spacing: 4px; }

  .share-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 20px; }

  .stats-row { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .stat-box { flex: 1; text-align: center; }
  .stat-number { font-size: 20px; font-weight: 700; color: var(--price-red); }
  .stat-label { font-size: 10px; color: var(--subtext); margin-top: 4px; text-align: center; }

  .credit-banner { background: var(--warn-bg); border-radius: 10px; padding: 14px; }
  .credit-banner-text { font-size: 12px; color: var(--warn-text); line-height: 1.4; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-button" onclick="history.back()">←</button>
  <div class="header-title">🎁 Invite Friends</div>
</div>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const app = document.getElementById("app");

  async function loadReferralInfo() {
    try {
      const res = await fetch(`${API_URL}/auth/referral-info`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      render(data);
    } catch (e) {
      app.innerHTML = `<div class="center-box">Could not load referral info.</div>`;
    }
  }

  function render(data) {
    const referralCode = data.referral_code;
    const totalReferrals = data.total_referrals;
    const approvedReferrals = data.approved_referrals;
    const freeBoostCredits = data.free_boost_credits;

    app.innerHTML = `
      <div class="content">
        <div class="explainer">Share your code with a friend. When they sign up and register a shop that gets approved, you both get a free 24-hour Boost!</div>

        <div class="code-box">
          <div class="code-label">Your Referral Code</div>
          <div class="code-value">${referralCode}</div>
        </div>

        <button class="share-btn" id="shareBtn">📤 Share My Code</button>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number">${totalReferrals}</div>
            <div class="stat-label">Friends Joined</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${approvedReferrals}</div>
            <div class="stat-label">Shops Approved</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">${freeBoostCredits}</div>
            <div class="stat-label">Free Boosts</div>
          </div>
        </div>

        ${freeBoostCredits > 0 ? `
          <div class="credit-banner">
            <div class="credit-banner-text">🚀 You have ${freeBoostCredits} free Boost${freeBoostCredits === 1 ? "" : "s"} ready to use! Go to My Shop → pick a listing → Boost, and use a credit instead of paying.</div>
          </div>` : ""}
      </div>`;

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const message = `Join me on ZedMarket, Zambia's marketplace app! Use my code ${referralCode} when you sign up, and if you register a shop, we both get a free Boost!`;
      if (navigator.share) {
        try { await navigator.share({ text: message }); } catch (e) {}
      } else {
        navigator.clipboard.writeText(message);
        alert("Copied to clipboard — paste it wherever you'd like to share!");
      }
    });
  }

  if (!token) {
    window.location.href = "/login.html";
  } else {
    loadReferralInfo();
  }
</script>
</body>
</html>
