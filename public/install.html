<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>Install ZedMarket App</title>
<meta name="description" content="Install ZedMarket on your phone — Zambia's local marketplace app." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ZedMarket" />
<meta property="og:title" content="Install ZedMarket — Zambia Marketplace App" />
<meta property="og:description" content="Get ZedMarket on your home screen. Buy and sell locally in Zambia." />
<meta property="og:url" content="https://www.zedmarket.app/install.html" />
<meta property="og:image" content="https://www.zedmarket.app/icon-512.png" />
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111; --gold: #F5C518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .hero { text-align: center; margin-bottom: 24px; }
  .hero img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 12px; }
  .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .hero p { font-size: 14px; color: var(--subtext); line-height: 1.5; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .step { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
  .step:last-child { margin-bottom: 0; }
  .step-num {
    width: 28px; height: 28px; border-radius: 8px; background: var(--black); color: var(--gold);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .step-text { font-size: 14px; line-height: 1.5; padding-top: 3px; }
  .btn {
    width: 100%; border: none; border-radius: 12px; padding: 14px;
    font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 16px;
  }
  .btn-primary { background: var(--black); color: var(--gold); }
  .btn-gold { background: var(--gold); color: var(--black); }
  .link-row { text-align: center; margin-top: 16px; }
  .link-row a { color: #A3131C; font-size: 13px; font-weight: 600; text-decoration: none; }
  #browserBox { display: none; }
</style>
</head>
<body>
<script>
  if (window.matchMedia("(display-mode: standalone)").matches) {
    window.location.replace("/index.html");
  }
</script>
<div class="wrap">
  <div class="hero">
    <img src="https://www.zedmarket.app/icon-192.png" alt="ZedMarket" />
    <h1 data-i18n="install_page_title">Get ZedMarket on your phone</h1>
    <p data-i18n="install_page_sub">Copy the link and paste it in Chrome.</p>
    <p style="font-size:13px;color:#A3131C;font-weight:600;margin-top:8px;word-break:break-all;">www.zedmarket.app/install.html</p>
  </div>

  <div id="embeddedBox">
    <div class="card">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text" data-i18n="install_page_step_copy">Tap <strong>Copy link</strong> below</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text" data-i18n="install_page_step_chrome">Open the <strong>Chrome</strong> app</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text" data-i18n="install_page_step_paste">Paste the link in the address bar, then tap <strong>Install App</strong></div>
      </div>
      <button class="btn btn-primary" id="copyLinkBtn" type="button" data-i18n="install_page_copy_btn">Copy link</button>
    </div>
  </div>

  <div id="browserBox">
    <div class="card">
      <p style="font-size:14px;line-height:1.5;margin-bottom:14px;" data-i18n="install_page_ready_sub">You're in a browser that can install ZedMarket.</p>
      <button class="btn btn-gold" id="installBtn" type="button" data-i18n="install_app">Install App</button>
    </div>
  </div>

  <div class="link-row">
    <a href="/index.html" data-i18n="install_page_browse">Just browse the website →</a>
  </div>
</div>

<script src="/js/lang.js"></script>
<script src="/js/pwa-install.js"></script>
<script>
  const SITE_URL = "https://www.zedmarket.app/install.html";
  let installPromptReady = false;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPromptReady = true;
    refreshLayout();
  });

  function refreshLayout() {
    document.getElementById("embeddedBox").style.display = installPromptReady ? "none" : "block";
    document.getElementById("browserBox").style.display = installPromptReady ? "block" : "none";
    applyTranslations(document.body);
  }

  document.getElementById("copyLinkBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(SITE_URL);
      alert(t("install_page_copied", "Link copied! Open Chrome and paste it in the address bar."));
    } catch {
      prompt(t("inapp_copy_link_prompt", "Copy this link and paste it in Chrome:"), SITE_URL);
    }
  });

  initPwaInstall({ buttonIds: ["installBtn"], showBanner: false });
  refreshLayout();
  applyTranslations(document.body);
</script>
</body>
</html>
