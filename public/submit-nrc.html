<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Submit NRC</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A;
    --warn-bg: #FFF3E0; --warn-text: #7A3E00; --green: #2F4F3E;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }
  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button { background: none; border: none; cursor: pointer; display: flex; padding: 0; }
  .back-button svg { width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 2.5; }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }
  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .info-box { background: var(--warn-bg); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 12px; color: var(--warn-text); line-height: 1.5; }
  .step-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .step-dot.active { background: var(--orange); }
  .step-dot.done { background: var(--gold); }
  .step-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .step-subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 18px; line-height: 1.45; }
  .step-panel { display: none; }
  .step-panel.active { display: block; }
  .label { font-size: 12px; font-weight: 700; margin-bottom: 6px; display: block; }
  .input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 14px; }
  .upload-box {
    background: var(--card); border: 1.5px dashed var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px; text-align: center;
  }
  .upload-box.has-photo { border-style: solid; cursor: default; }
  .preview-wrap { position: relative; border-radius: 8px; overflow: hidden; }
  .preview-img { width: 100%; max-height: 180px; object-fit: cover; display: block; cursor: pointer; }
  .upload-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700; gap: 8px;
  }
  .upload-spinner {
    width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .view-hint, .change-link { font-size: 11px; }
  .view-hint { color: var(--subtext); flex: 1; text-align: left; }
  .change-link { color: var(--orange); font-weight: 700; cursor: pointer; padding: 4px 0; }
  .upload-hint { font-size: 12px; color: var(--subtext); cursor: pointer; }
  .guide-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 16px;
  }
  .guide-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .guide-item {
    display: flex; gap: 10px; align-items: flex-start; font-size: 12px;
    color: var(--subtext); margin-bottom: 8px; line-height: 1.4;
  }
  .guide-item:last-child { margin-bottom: 0; }
  .guide-icon {
    width: 18px; height: 18px; border-radius: 50%; background: var(--warn-bg); color: var(--warn-text);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .selfie-example {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; text-align: center; margin-bottom: 16px;
  }
  .face-outline {
    width: 120px; height: 150px; margin: 0 auto 10px; border: 2px dashed var(--orange);
    border-radius: 50% 50% 45% 45%; position: relative;
  }
  .face-outline::after {
    content: ""; position: absolute; left: 50%; top: 58%; width: 36px; height: 18px;
    transform: translateX(-50%); border: 2px dashed var(--orange); border-top: none; border-radius: 0 0 18px 18px;
  }
  .example-text { font-size: 11px; color: var(--subtext); line-height: 1.4; }
  .selfie-preview {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; margin-bottom: 16px; display: none;
  }
  .selfie-preview.show { display: block; cursor: pointer; }
  .selfie-preview img { width: 100%; max-height: 280px; object-fit: cover; display: block; cursor: pointer; }
  .selfie-preview-label {
    padding: 8px 12px; font-size: 11px; font-weight: 700; color: var(--green);
    background: #E8F5E9; text-align: center;
  }
  body.dark .selfie-preview-label { background: #1B3A24; color: #8FD19E; }
  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  .submit-btn, .next-btn {
    flex: 1; background: var(--orange); color: #fff; border: none;
    padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .back-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .submit-btn:disabled, .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-text { color: var(--price-red); font-size: 12px; margin-bottom: 10px; }
  .success-text { color: var(--green); font-size: 13px; margin-bottom: 10px; font-weight: 600; }
  .center-box { padding: 60px 24px; text-align: center; color: var(--subtext); }
  .camera-modal {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  .camera-modal.open { display: flex; }
  .camera-wrap {
    position: relative; width: 100%; max-width: 360px; border-radius: 16px; overflow: hidden; background: #000;
  }
  .camera-video { width: 100%; display: block; transform: scaleX(-1); }
  .camera-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .face-guide {
    width: 62%; height: 72%; border: 3px solid rgba(245, 197, 24, 0.95);
    border-radius: 50% 50% 46% 46%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  }
  .camera-top { color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 10px; text-align: center; max-width: 360px; }
  .camera-checklist { color: #fff; font-size: 11px; margin-bottom: 12px; text-align: left; max-width: 360px; line-height: 1.5; }
  .camera-checklist li { margin-bottom: 4px; }
  .camera-actions { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 360px; }
  .camera-btn {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .camera-btn.primary { background: var(--orange); color: #fff; }
  .camera-btn.secondary { background: var(--card); color: var(--text); }
  .photo-viewer {
    display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0.92); flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  .photo-viewer.open { display: flex; }
  .photo-viewer img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 8px; }
  .photo-viewer-close {
    margin-top: 14px; background: var(--card); border: none; border-radius: 10px;
    padding: 12px 20px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
</script>

<div class="topbar">
  <button class="back-button" id="pageBackBtn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </button>
  <div class="header-title" data-i18n="submit_nrc_title">Submit NRC Verification</div>
</div>

<div class="content" id="app">
  <div class="center-box">Loading…</div>
</div>

<input type="file" accept="image/*" capture="environment" id="nrcFrontInput" hidden />
<input type="file" accept="image/*" capture="environment" id="nrcBackInput" hidden />
<input type="file" accept="image/*" id="selfieInput" hidden />

<div class="camera-modal" id="selfieCameraModal">
  <div class="camera-top" id="cameraTopText"></div>
  <ul class="camera-checklist" id="cameraChecklist"></ul>
  <div class="camera-wrap">
    <video class="camera-video" id="selfieVideo" autoplay playsinline muted></video>
    <div class="camera-overlay"><div class="face-guide"></div></div>
  </div>
  <div class="camera-actions">
    <button type="button" class="camera-btn secondary" id="cancelSelfieBtn" data-i18n="cancel">Cancel</button>
    <button type="button" class="camera-btn primary" id="captureSelfieBtn" data-i18n="take_selfie">Take Selfie</button>
  </div>
</div>

<div class="photo-viewer" id="photoViewerModal">
  <img id="photoViewerImg" alt="" />
  <button type="button" class="photo-viewer-close" id="photoViewerCloseBtn" data-i18n="close">Close</button>
</div>

<script src="/js/lang.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/kstg72vx/image/upload";
  const UPLOAD_PRESET = "online_shops_uploads";
  const token = localStorage.getItem("zm_token");
  const app = document.getElementById("app");

  let step = 1;
  let nrcFrontUrl = null;
  let nrcBackUrl = null;
  let selfieUrl = null;
  let activeUpload = null;
  let selfieStream = null;
  let deadlineText = "";
  const uploadBoxMap = { front: "nrcFrontBox", back: "nrcBackBox" };
  const uploading = { front: false, back: false, selfie: false };

  function openPhotoViewer(url) {
    if (!url) return;
    document.getElementById("photoViewerImg").src = url;
    document.getElementById("photoViewerModal").classList.add("open");
  }

  function closePhotoViewer() {
    document.getElementById("photoViewerModal").classList.remove("open");
    document.getElementById("photoViewerImg").src = "";
  }

  document.getElementById("photoViewerCloseBtn").addEventListener("click", closePhotoViewer);
  document.getElementById("photoViewerModal").addEventListener("click", (e) => {
    if (e.target.id === "photoViewerModal" || e.target.id === "photoViewerImg") closePhotoViewer();
  });

  function showError(msg) {
    const el = document.getElementById("formError");
    if (el) el.textContent = msg;
  }

  async function compressImage(file, maxDim, quality) {
    if (!file || !file.type.startsWith("image/")) return file;
    const objectUrl = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = reject;
        el.src = objectUrl;
      });
      let width = img.naturalWidth || img.width;
      let height = img.naturalHeight || img.height;
      const scale = Math.min(1, maxDim / Math.max(width, height));
      width = Math.max(1, Math.round(width * scale));
      height = Math.max(1, Math.round(height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
      if (!blob) return file;
      return new File([blob], "nrc-photo.jpg", { type: "image/jpeg" });
    } catch {
      return file;
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  }

  async function uploadPhoto(file) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 120000);
    try {
      const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData, signal: controller.signal });
      const data = await res.json();
      if (!data.secure_url) throw new Error("Upload failed");
      return data.secure_url;
    } finally {
      clearTimeout(timer);
    }
  }

  function formatNrcNumber(value) {
    const digits = String(value || "").replace(/\D/g, "").slice(0, 9);
    if (digits.length <= 6) return digits;
    if (digits.length <= 8) return `${digits.slice(0, 6)}/${digits.slice(6)}`;
    return `${digits.slice(0, 6)}/${digits.slice(6, 8)}/${digits.slice(8)}`;
  }

  function isValidNrcNumber(value) {
    return /^\d{6}\/\d{2}\/\d{1}$/.test(String(value || "").trim());
  }

  function bindNrcNumberInput() {
    const input = document.getElementById("nrcNumberInput");
    if (!input) return;
    input.addEventListener("input", () => {
      const formatted = formatNrcNumber(input.value);
      if (input.value !== formatted) {
        input.value = formatted;
      }
    });
  }

  function updateNextButtonState() {
    const btn = document.getElementById("nextStepBtn");
    if (!btn) return;
    const busy = uploading.front || uploading.back;
    btn.disabled = busy;
    btn.textContent = busy ? t("uploading") : t("next");
  }

  function updateStepUI() {
    document.querySelectorAll(".step-dot").forEach((dot, i) => {
      dot.classList.toggle("active", i + 1 === step);
      dot.classList.toggle("done", i + 1 < step);
    });
    document.querySelectorAll(".step-panel").forEach((panel, i) => {
      panel.classList.toggle("active", i + 1 === step);
    });
  }

  function renderForm() {
    app.innerHTML = `
      <div class="info-box">${t("submit_nrc_info")}${deadlineText ? `<br><strong>${deadlineText}</strong>` : ""}</div>
      <div class="step-row">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>
      <div id="formError" class="error-text"></div>

      <div class="step-panel active" id="step1Panel">
        <div class="step-title">${t("nrc_step1_title")}</div>
        <div class="step-subtitle">${t("nrc_step1_subtitle")}</div>
        <label class="label" for="nrcNumberInput">${t("nrc_number")}</label>
        <input class="input" id="nrcNumberInput" inputmode="numeric" autocomplete="off" placeholder="121904/09/1" maxlength="11" />
        <div class="label">${t("nrc_front")}</div>
        <div class="upload-box" id="nrcFrontBox"><div class="upload-hint">${t("tap_to_upload")}</div></div>
        <div class="label">${t("nrc_back")}</div>
        <div class="upload-box" id="nrcBackBox"><div class="upload-hint">${t("tap_to_upload")}</div></div>
        <button class="next-btn" id="nextStepBtn">${t("next")}</button>
      </div>

      <div class="step-panel" id="step2Panel">
        <div class="step-title">${t("nrc_step2_title")}</div>
        <div class="step-subtitle">${t("nrc_step2_subtitle")}</div>
        <div class="selfie-preview" id="selfiePreview">
          <img id="selfiePreviewImg" alt="" />
          <div class="selfie-preview-label">${t("selfie_preview_ok")}</div>
        </div>
        <div class="btn-row">
          <button class="back-btn" id="backStepBtn">${t("back")}</button>
          <button class="next-btn" id="takeSelfieBtn">${selfieUrl ? t("retake_selfie") : t("take_selfie")}</button>
        </div>
        <button class="submit-btn" id="submitBtn" style="margin-top:10px;width:100%;" ${selfieUrl ? "" : "disabled"}>${t("submit_nrc_btn")}</button>
      </div>
    `;

    document.getElementById("nrcFrontBox").addEventListener("click", (e) => onUploadBoxClick("front", "nrcFrontBox", e));
    document.getElementById("nrcBackBox").addEventListener("click", (e) => onUploadBoxClick("back", "nrcBackBox", e));
    document.getElementById("nextStepBtn").addEventListener("click", goToStep2);
    document.getElementById("backStepBtn").addEventListener("click", () => { step = 1; updateStepUI(); });
    document.getElementById("takeSelfieBtn").addEventListener("click", openSelfieCamera);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    document.getElementById("pageBackBtn").onclick = () => {
      if (step === 2) { step = 1; updateStepUI(); }
      else window.location.href = "/my-shop.html";
    };

    bindNrcNumberInput();
    if (nrcFrontUrl) setPreview("nrcFrontBox", nrcFrontUrl, false);
    if (nrcBackUrl) setPreview("nrcBackBox", nrcBackUrl, false);
    if (selfieUrl) showSelfiePreview(selfieUrl, false);
    updateStepUI();
    updateNextButtonState();
  }

  function goToStep2() {
    if (uploading.front || uploading.back) {
      showError(t("wait_for_upload"));
      return;
    }
    const nrcNumber = document.getElementById("nrcNumberInput").value.trim();
    if (!isValidNrcNumber(nrcNumber)) {
      showError(t("nrc_number_invalid"));
      return;
    }
    if (!nrcFrontUrl || !nrcBackUrl) {
      showError(t("nrc_step1_missing"));
      return;
    }
    showError("");
    step = 2;
    updateStepUI();
  }

  function onUploadBoxClick(uploadKey, boxId, e) {
    if (e.target.classList.contains("preview-img")) {
      openPhotoViewer(e.target.dataset.fullUrl || e.target.src);
      return;
    }
    if (e.target.classList.contains("change-link") || !document.getElementById(boxId).querySelector(".preview-img")) {
      activeUpload = uploadKey;
      document.getElementById(uploadKey === "front" ? "nrcFrontInput" : "nrcBackInput").click();
    }
  }

  function showSelfiePreview(url, uploading) {
    const wrap = document.getElementById("selfiePreview");
    const img = document.getElementById("selfiePreviewImg");
    const btn = document.getElementById("takeSelfieBtn");
    const submitBtn = document.getElementById("submitBtn");
    if (!wrap || !img) return;
    img.src = url;
    img.dataset.fullUrl = url;
    wrap.classList.add("show");
    wrap.onclick = (e) => {
      if (uploading) return;
      if (e.target === img) openPhotoViewer(url);
    };
    const label = wrap.querySelector(".selfie-preview-label");
    if (label) label.textContent = uploading ? t("uploading") : t("selfie_preview_ok");
    if (btn) btn.textContent = uploading ? t("uploading") : (selfieUrl ? t("retake_selfie") : t("take_selfie"));
    if (submitBtn) submitBtn.disabled = uploading || !selfieUrl;
  }

  function setPreview(boxId, url, uploading) {
    const box = document.getElementById(boxId);
    if (!box) return;
    box.classList.add("has-photo");
    if (uploading) {
      box.innerHTML = `
        <div class="preview-wrap">
          <img class="preview-img" src="${url}" alt="" />
          <div class="upload-overlay"><div class="upload-spinner"></div><div>${t("uploading")}</div></div>
        </div>`;
      return;
    }
    box.innerHTML = `
      <div class="preview-wrap">
        <img class="preview-img" src="${url}" alt="" data-full-url="${url}" />
      </div>
      <div class="preview-actions">
        <span class="view-hint">${t("tap_to_view_photo")}</span>
        <span class="change-link">${t("change_photo")}</span>
      </div>`;
  }

  async function handleFile(file) {
    if (!file) return;
    const slot = activeUpload;
    if (!slot) return;
    const boxId = uploadBoxMap[slot];
    let localUrl = null;
    uploading[slot] = true;
    updateNextButtonState();

    try {
      const maxDim = slot === "selfie" ? 1000 : 1400;
      const compressed = await compressImage(file, maxDim, 0.82);
      localUrl = URL.createObjectURL(compressed);
      if (boxId) setPreview(boxId, localUrl, true);
      else if (slot === "selfie") showSelfiePreview(localUrl, true);

      const url = await uploadPhoto(compressed);
      if (slot === "front") { nrcFrontUrl = url; setPreview("nrcFrontBox", url, false); }
      else if (slot === "back") { nrcBackUrl = url; setPreview("nrcBackBox", url, false); }
      else if (slot === "selfie") { selfieUrl = url; showSelfiePreview(url, false); }
    } catch {
      showError(t("upload_failed"));
      if (boxId) {
        const box = document.getElementById(boxId);
        box.classList.remove("has-photo");
        box.innerHTML = `<div class="upload-hint">${t("tap_to_upload")}</div>`;
        if (slot === "front") nrcFrontUrl = null;
        if (slot === "back") nrcBackUrl = null;
      } else if (slot === "selfie") {
        selfieUrl = null;
        const wrap = document.getElementById("selfiePreview");
        if (wrap) wrap.classList.remove("show");
      }
    } finally {
      uploading[slot] = false;
      updateNextButtonState();
      if (localUrl) URL.revokeObjectURL(localUrl);
    }
  }

  function closeSelfieCamera() {
    if (selfieStream) {
      selfieStream.getTracks().forEach((track) => track.stop());
      selfieStream = null;
    }
    const video = document.getElementById("selfieVideo");
    if (video) video.srcObject = null;
    document.getElementById("selfieCameraModal").classList.remove("open");
  }

  function updateCameraText() {
    document.getElementById("cameraTopText").textContent = t("selfie_camera_hint");
    document.getElementById("cameraChecklist").innerHTML = "";
  }

  async function openSelfieCamera() {
    updateCameraText();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById("selfieInput").click();
      return;
    }
    try {
      closeSelfieCamera();
      selfieStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      const video = document.getElementById("selfieVideo");
      video.srcObject = selfieStream;
      await video.play();
      document.getElementById("selfieCameraModal").classList.add("open");
    } catch {
      document.getElementById("selfieInput").click();
    }
  }

  function captureSelfieFrame() {
    const video = document.getElementById("selfieVideo");
    if (!video.videoWidth) return null;
    const maxDim = 1000;
    let width = video.videoWidth;
    let height = video.videoHeight;
    const scale = Math.min(1, maxDim / Math.max(width, height));
    width = Math.max(1, Math.round(width * scale));
    height = Math.max(1, Math.round(height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, width, height);
    return new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.82);
    });
  }

  document.getElementById("cancelSelfieBtn").addEventListener("click", closeSelfieCamera);
  document.getElementById("captureSelfieBtn").addEventListener("click", async () => {
    const blob = await captureSelfieFrame();
    closeSelfieCamera();
    if (!blob) {
      showError(t("upload_failed"));
      return;
    }
    activeUpload = "selfie";
    await handleFile(new File([blob], "selfie.jpg", { type: "image/jpeg" }));
  });

  document.getElementById("nrcFrontInput").addEventListener("change", (e) => { handleFile(e.target.files[0]); e.target.value = ""; });
  document.getElementById("nrcBackInput").addEventListener("change", (e) => { handleFile(e.target.files[0]); e.target.value = ""; });
  document.getElementById("selfieInput").addEventListener("change", (e) => { handleFile(e.target.files[0]); e.target.value = ""; });

  async function handleSubmit() {
    const nrcNumber = document.getElementById("nrcNumberInput").value.trim();
    if (!isValidNrcNumber(nrcNumber) || !nrcFrontUrl || !nrcBackUrl || !selfieUrl) {
      showError(!isValidNrcNumber(nrcNumber) ? t("nrc_number_invalid") : t("submit_nrc_missing"));
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = t("submitting");
    try {
      const res = await fetch(`${API_URL}/auth/submit-nrc`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          nrc_number: nrcNumber,
          nrc_photo_url: nrcFrontUrl,
          nrc_back_photo_url: nrcBackUrl,
          selfie_photo_url: selfieUrl,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || t("submit_failed"));
        return;
      }
      app.innerHTML = `<div class="success-text">${t("submit_nrc_success")}</div><div class="center-box"><button class="submit-btn" onclick="window.location.href='/my-shop.html'">${t("go_back")}</button></div>`;
    } catch {
      showError(t("submit_failed"));
    } finally {
      btn.disabled = false;
      btn.textContent = t("submit_nrc_btn");
    }
  }

  async function boot() {
    if (!token) { window.location.href = "/login.html"; return; }
    try {
      const res = await fetch(`${API_URL}/auth/shop-status`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (data.account_type !== "shop" || data.shop_status !== "approved") {
        window.location.href = "/my-shop.html";
        return;
      }
      if (data.nrc_verified) {
        app.innerHTML = `<div class="center-box">${t("nrc_already_verified")}</div>`;
        return;
      }
      if (data.nrc_status === "pending" && data.nrc_submitted) {
        app.innerHTML = `<div class="center-box">${t("nrc_pending_review")}</div>`;
        return;
      }
      if (data.nrc_grace_end) {
        deadlineText = t("nrc_deadline", { date: new Date(data.nrc_grace_end).toLocaleString() });
      }
      renderForm();
    } catch {
      app.innerHTML = `<div class="center-box">${t("submit_failed")}</div>`;
    }
  }

  boot();
</script>
</body>
</html>
