<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<title>ZedMarket - Sample listing menu</title>
<meta name="theme-color" content="#111111" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A; --red-btn: #E01B27;
    --thumb-bg: #E9E2D3; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

  .sample-banner {
    flex-shrink: 0;
    background: var(--orange); color: #7A3E00;
    font-size: 11px; font-weight: 800; text-align: center;
    padding: 8px 12px; letter-spacing: 0.03em; text-transform: uppercase;
  }

  .listing-shell { display: flex; flex-direction: column; height: 100dvh; min-height: 100vh; }
  .hero-wrap { position: relative; flex: 1 1 auto; max-height: 380px; min-height: 200px; background: var(--thumb-bg); }
  .hero-photo { width: 100%; height: 100%; object-fit: cover; }
  .round-btn {
    position: absolute; top: 8px; width: 48px; height: 48px;
    min-width: 48px; max-width: 48px; min-height: 48px; max-height: 48px;
    border-radius: 24px; background: var(--black);
    display: flex; align-items: center; justify-content: center;
    border: none; padding: 0; margin: 0; overflow: hidden; cursor: pointer; z-index: 10;
  }
  .back-button { left: 12px; }
  .round-btn svg {
    display: block; width: 22px; height: 22px;
    stroke: var(--gold); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .hero-actions {
    position: absolute; top: 8px; right: 12px; z-index: 10;
    display: grid; grid-template-columns: 48px 48px; column-gap: 8px; width: 104px;
  }
  .hero-actions .round-btn { position: relative; top: auto; left: auto; right: auto; }
  .favorite-button svg.filled { fill: var(--red-btn); stroke: var(--red-btn); }
  .more-button svg { fill: var(--gold); stroke: none; }

  .listing-bottom {
    flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--bg); border-radius: 16px 16px 0 0; margin-top: -10px;
    position: relative; z-index: 5; box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
  }
  .body-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 14px 18px calc(84px + env(safe-area-inset-bottom, 0px));
  }
  .price { font-size: 24px; font-weight: 700; color: var(--price-red); }
  .item-title { font-size: 15px; font-weight: 600; margin: 4px 0; }
  .view-count { font-size: 11px; color: var(--subtext); margin-bottom: 8px; }
  .badge-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { padding: 4px 10px; border-radius: 20px; background: var(--black); color: #fff; font-size: 11px; font-weight: 600; }
  .badge.dist { color: var(--gold); }

  .seller-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 2px solid var(--text);
    padding: 10px 12px; margin-top: 4px;
  }
  .seller-avatar {
    width: 36px; height: 36px; border-radius: 18px; background: var(--red-btn);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex-shrink: 0;
  }
  .seller-info { flex: 1; min-width: 0; }
  .seller-name { font-size: 13px; font-weight: 600; }
  .seller-sub { font-size: 11px; color: var(--subtext); }
  .seller-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .view-shop-btn, .review-btn {
    padding: 8px 10px; border-radius: 10px; font-size: 11px; font-weight: 700;
    border: none; cursor: pointer; flex-shrink: 0;
  }
  .view-shop-btn { background: var(--black); color: var(--gold); }
  .review-btn { background: var(--card); color: var(--text); border: 2px solid var(--text); }
  .safety-row { display: flex; gap: 8px; margin-top: 12px; }
  .safety-btn {
    flex: 1; background: var(--warn-bg); border: 1px solid var(--orange); border-radius: 10px;
    padding: 10px; text-align: center; color: var(--warn-text); font-size: 11px; font-weight: 700;
  }

  .fixed-cta-row {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; gap: 8px;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .cta-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; }
  .msg-btn { background: var(--red-btn); }
  .msg-btn svg { width: 22px; height: 22px; fill: #fff; }
  .wa-btn { background: var(--black); }
  .wa-btn svg { width: 22px; height: 22px; fill: #25D366; }
  .sms-btn { background: var(--card); border: 1.5px solid var(--black); }
  .sms-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--black); stroke-width: 2; }
  .call-btn { background: var(--card); border: 1.5px solid var(--red-btn); }
  .call-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--red-btn); stroke-width: 2; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .menu-box {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .menu-handle {
    width: 40px; height: 4px; background: var(--border); border-radius: 2px;
    margin: 4px auto 14px;
  }
  .menu-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 0 8px 10px; }
  .menu-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; background: var(--card); border: 2px solid var(--border);
    padding: 14px 12px; margin-bottom: 8px; cursor: pointer;
    font-size: 14px; font-weight: 700; color: var(--text); text-align: left;
  }
  .menu-row svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .menu-row.danger { color: var(--price-red); }
  .menu-row.danger svg { stroke: var(--price-red); }
  .menu-cancel {
    width: 100%; margin-top: 4px; padding: 14px; background: var(--black); color: var(--gold);
    border: none; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
  }
  .toast {
    display: none; position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    z-index: 250; background: var(--black); color: var(--gold); text-align: center;
    padding: 12px; font-size: 12px; font-weight: 700;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
<script>
  document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
</script>

<div class="listing-shell">
  <div class="sample-banner">Sample only — tap the 3 dots. Real listing is unchanged.</div>
  <div class="hero-wrap">
    <button class="round-btn back-button" type="button" onclick="history.back()" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="hero-actions">
      <button class="round-btn favorite-button" id="favoriteBtn" type="button" aria-label="Save listing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="round-btn more-button" id="moreBtn" type="button" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
    <img class="hero-photo" alt="D shoe" src="https://res.cloudinary.com/kstg72vx/image/upload/v1785387706/v91e7pfqupvzihnxckkv.jpg" />
  </div>

  <div class="listing-bottom">
    <div class="body-scroll">
      <div class="price">K350.00</div>
      <div class="item-title">D shoe</div>
      <div class="view-count">39 views</div>
      <div class="badge-row">
        <div class="badge">Electronics</div>
        <div class="badge dist">Chawama, Lusaka Province</div>
      </div>
      <div class="seller-row">
        <div class="seller-avatar">J</div>
        <div class="seller-info">
          <div class="seller-name">JOEL</div>
          <div class="seller-sub">Shop Seller</div>
        </div>
        <div class="seller-actions">
          <button class="view-shop-btn" type="button">View</button>
          <button class="review-btn" type="button">Rate Seller</button>
        </div>
      </div>
      <div class="safety-row">
        <div class="safety-btn">Safety Tips</div>
        <div class="safety-btn">Share My Meetup</div>
      </div>
    </div>
  </div>
</div>

<div class="fixed-cta-row">
  <button class="cta-btn msg-btn" type="button" aria-label="Message"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
  <button class="cta-btn wa-btn" type="button" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></button>
  <button class="cta-btn sms-btn" type="button" aria-label="SMS"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></button>
  <button class="cta-btn call-btn" type="button" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
</div>

<div class="modal-overlay" id="moreMenu">
  <div class="menu-box">
    <div class="menu-handle"></div>
    <div class="menu-title">More</div>
    <button class="menu-row" type="button" data-action="share-listing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Share listing
    </button>
    <button class="menu-row" type="button" data-action="share-shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Share shop
    </button>
    <button class="menu-row danger" type="button" data-action="report">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      Report listing
    </button>
    <button class="menu-cancel" type="button" id="menuCancel">Cancel</button>
  </div>
</div>
<div class="toast" id="toast">Sample only — this does not share or report yet.</div>

<script>
  const menu = document.getElementById("moreMenu");
  const toast = document.getElementById("toast");
  const favBtn = document.getElementById("favoriteBtn");
  const favSvg = favBtn.querySelector("svg");
  let saved = false;

  document.getElementById("moreBtn").addEventListener("click", () => menu.classList.add("open"));
  document.getElementById("menuCancel").addEventListener("click", () => menu.classList.remove("open"));
  menu.addEventListener("click", (e) => { if (e.target === menu) menu.classList.remove("open"); });

  favBtn.addEventListener("click", () => {
    saved = !saved;
    favSvg.classList.toggle("filled", saved);
  });

  function showToast() {
    menu.classList.remove("open");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  document.querySelectorAll(".menu-row").forEach((btn) => {
    btn.addEventListener("click", showToast);
  });
</script>
</body>
</html>
