<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Explore</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --border: #E2E0DC;
    --text: #211D1A;
    --subtext: #5C5955;
    --black: #111111;
    --gold: #F5C518;
    --price-red: #A3131C;
    --orange: #FF7A1A;
    --thumb-bg: #E9E2D3;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text); transition: background 0.2s, color 0.2s;
  }
  .topbar { background: var(--black); padding: 16px; }
  .brand { color: var(--gold); font-size: 20px; font-weight: 700; }
  .auth-line { color: var(--gold); font-size: 12px; margin-top: 6px; background: none; border: none; cursor: pointer; padding: 0; }

  .loc-row { display: flex; gap: 8px; padding: 12px; }
  .loc-pill {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; text-align: center; cursor: pointer;
  }
  .loc-pill.active { background: var(--black); border-color: var(--black); }
  .loc-text { font-size: 12px; font-weight: 600; color: var(--subtext); }
  .loc-text.active { color: var(--gold); }

  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
  }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; padding-bottom: 40px; }
  .card {
    width: calc(47% - 5px);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden;
  }
  .thumb {
    height: 90px; background: var(--thumb-bg);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .card-info { padding: 10px; }
  .price { font-weight: 700; font-size: 14px; color: var(--price-red); }
  .title { font-size: 12px; color: var(--text); margin: 3px 0; }
  .loc { font-size: 10.5px; color: var(--subtext); }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .error-text { color: var(--price-red); margin-bottom: 12px; }
  .retry-btn { background: var(--black); color: var(--gold); border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .empty-text { color: var(--subtext); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item { flex: 1; text-align: center; text-decoration: none; color: var(--subtext); font-size: 11px; padding: 4px 0; }
  .nav-item.active { color: var(--orange); font-weight: 700; }
  button.nav-item {
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--subtext); font-size: 11px; width: 100%;
  }
  .nav-icon { display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
  .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body { padding-bottom: 60px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <div class="brand">Online Shops</div>
  <button class="auth-line" id="authBtn">Login / Sign Up</button>
</div>

<div class="loc-row">
  <div class="loc-pill active" id="locHome"><span class="loc-text active">📍 Home</span></div>
  <div class="loc-pill" id="locCurrent"><span class="loc-text">🎯 Use current location</span></div>
</div>

<div class="chips-row" id="categoryRow"></div>

<div id="feed"><div class="center-box"><div class="spinner"></div></div></div>

<div class="bottom-nav">
  <a href="/index.html" class="nav-item"><div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg></div><div>Home</div></a>
  <a href="/my-shop.html" class="nav-item"><div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div>My Shop</div></a>
  <button type="button" id="installBtn" class="nav-item nav-install" aria-label="Install App"><div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div><div>Install</div></button>
</div>

<script src="/js/pwa-install.js"></script>
<script src="/js/data-saver.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Furniture', 'Produce', 'Cars', 'Land'];
  let activeCategory = "All";
  let listings = [];

  const feed = document.getElementById("feed");
  const categoryRow = document.getElementById("categoryRow");
  const authBtn = document.getElementById("authBtn");
  const locHome = document.getElementById("locHome");
  const locCurrent = document.getElementById("locCurrent");

  function renderChips() {
    categoryRow.innerHTML = CATEGORIES.map(c =>
      `<div class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${c}</div>`
    ).join("");
    categoryRow.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); renderFeed(); })
    );
  }

  locHome.addEventListener("click", () => {
    locHome.classList.add("active"); locHome.querySelector(".loc-text").classList.add("active");
    locCurrent.classList.remove("active"); locCurrent.querySelector(".loc-text").classList.remove("active");
  });
  locCurrent.addEventListener("click", () => {
    locCurrent.classList.add("active"); locCurrent.querySelector(".loc-text").classList.add("active");
    locHome.classList.remove("active"); locHome.querySelector(".loc-text").classList.remove("active");
  });

  async function fetchListings() {
    feed.innerHTML = `<div class="center-box"><div class="spinner"></div></div>`;
    try {
      const res = await fetch(`${API_URL}/listings`);
      listings = await res.json();
      renderFeed();
    } catch (e) {
      feed.innerHTML = `
        <div class="center-box">
          <div class="error-text">Could not load listings. Check your internet connection.</div>
          <button class="retry-btn" id="retryBtn">Try Again</button>
        </div>`;
      document.getElementById("retryBtn").addEventListener("click", fetchListings);
    }
  }

  function renderFeed() {
    const items = activeCategory === "All" ? listings : listings.filter(i => i.category === activeCategory);
    if (!items.length) {
      feed.innerHTML = `<div class="center-box"><div class="empty-text">No listings yet in this category.</div></div>`;
      return;
    }
    feed.innerHTML = `<div class="grid">${items.map(renderCard).join("")}</div>`;
    observeLazyImages(feed);
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    return `
      <div class="card">
        <div class="thumb">${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(32)}</div>
        <div class="card-info">
          <div class="price">K${item.price}</div>
          <div class="title">${item.title}</div>
          <div class="loc">📍 ${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  authBtn.addEventListener("click", () => { window.location.href = "/login.html"; });

  const savedUser = JSON.parse(localStorage.getItem("zm_user") || "null");
  if (savedUser) {
    authBtn.textContent = `Hi, ${savedUser.name} · Logout`;
    authBtn.addEventListener("click", () => {
      localStorage.removeItem("zm_user");
      localStorage.removeItem("zm_token");
      location.reload();
    });
  }

  renderChips();
  fetchListings();
  initPwaInstall({ buttonIds: ["installBtn"], showBanner: false });
</script>
</body>
</html>
