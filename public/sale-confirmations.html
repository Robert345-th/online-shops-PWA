<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Confirm Your Purchases</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111; --gold: #F5C518;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-text { color: var(--subtext); text-align: center; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: #A3131C;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { padding: 16px; max-width: 560px; margin: 0 auto; }
  .subtitle { font-size: 12px; color: var(--subtext); margin-bottom: 14px; line-height: 1.4; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card-title { font-size: 14px; font-weight: 700; }
  .card-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; margin-bottom: 10px; }
  .card-actions { display: flex; gap: 8px; }
  .confirm-btn { flex: 1; background: #2F4F3E; border: none; padding: 12px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
  .confirm-btn:disabled { opacity: 0.7; }
  .deny-btn { background: var(--card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; color: var(--subtext); font-weight: 600; font-size: 12px; cursor: pointer; }
  .deny-btn:disabled { opacity: 0.7; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title">Confirm Your Purchases</div>
</div>

<div id="content"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const content = document.getElementById("content");
  let confirmations = [];

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  async function loadConfirmations() {
    content.innerHTML = `<div class="center-box"><div class="spinner"></div></div>`;
    try {
      const res = await fetch(`${API_URL}/sale-confirmations/pending`, { headers: authHeaders() });
      confirmations = await res.json();
      render();
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">Could not load confirmations.</div></div>`;
    }
  }

  function render() {
    if (!confirmations.length) {
      content.innerHTML = `
        <div class="center-box">
          <div class="empty-icon">—</div>
          <div class="empty-text">No purchases waiting for your confirmation.</div>
        </div>`;
      return;
    }

    content.innerHTML = `
      <div class="list">
        <div class="subtitle">Confirming a real purchase helps build trust for sellers on ZedMarket. Only confirm if you actually bought the item.</div>
        ${confirmations.map(renderCard).join("")}
      </div>`;

    confirmations.forEach(c => {
      document.getElementById(`confirm-${c.id}`).addEventListener("click", () => handleConfirm(c.id));
      document.getElementById(`deny-${c.id}`).addEventListener("click", () => handleDeny(c.id));
    });
  }

  function renderCard(c) {
    return `
      <div class="card">
        <div class="card-title">"${c.listing_title}"</div>
        <div class="card-sub">From ${c.shop_name || c.seller_name}</div>
        <div class="card-actions">
          <button class="confirm-btn" id="confirm-${c.id}">Yes, I bought this</button>
          <button class="deny-btn" id="deny-${c.id}">Not me</button>
        </div>
      </div>`;
  }

  async function handleConfirm(id) {
    const btn = document.getElementById(`confirm-${id}`);
    btn.disabled = true;
    btn.textContent = "Confirming…";
    try {
      const res = await fetch(`${API_URL}/sale-confirmations/${id}/confirm`, {
        method: "PUT",
        headers: authHeaders()
      });
      if (!res.ok) {
        alert("Could not confirm this sale.");
        btn.disabled = false;
        btn.textContent = "Yes, I bought this";
        return;
      }
      confirmations = confirmations.filter(c => c.id !== id);
      render();
      alert("Thanks! Your confirmation helps build trust on ZedMarket.");
    } catch (e) {
      alert("Could not connect to the server.");
      btn.disabled = false;
      btn.textContent = "Yes, I bought this";
    }
  }

  async function handleDeny(id) {
    if (!confirm("Not your purchase? Let the seller know this wasn't a confirmed sale?")) return;
    const btn = document.getElementById(`deny-${id}`);
    btn.disabled = true;
    try {
      await fetch(`${API_URL}/sale-confirmations/${id}/deny`, {
        method: "PUT",
        headers: authHeaders()
      });
      confirmations = confirmations.filter(c => c.id !== id);
      render();
    } catch (e) {
      alert("Could not connect to the server.");
      btn.disabled = false;
    }
  }

  if (!token) {
    window.location.href = "/login.html";
  } else {
    loadConfirmations();
  }
</script>
</body>
</html>
