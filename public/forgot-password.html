<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Forgot Password</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --red-btn: #E01B27;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .content { padding: 20px; max-width: 480px; margin: 0 auto; }
  .label { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .subtext { font-size: 12px; color: var(--subtext); margin-bottom: 16px; }

  .phone-row { display: flex; margin-bottom: 12px; gap: 8px; }
  .phone-prefix { background: var(--black); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--gold); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; }

  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 14px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--subtext); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .checkbox.checked { background: var(--red-btn); border-color: var(--red-btn); }
  .checkbox-label { font-size: 12px; color: var(--subtext); }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.7; }
  .resend-text { display: block; width: 100%; text-align: center; color: var(--price-red); font-size: 12px; font-weight: 600; background: none; border: none; cursor: pointer; margin-top: 14px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title">Forgot Password</div>
</div>

<div class="content" id="content"></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  let step = "phone";
  let phone = "";
  let showPassword = false;

  const content = document.getElementById("content");

  function isValidZambianPhone(p) {
    return /^0(7|9)\d{8}$/.test(p);
  }

  function renderPhoneStep() {
    content.innerHTML = `
      <div class="label">Enter your phone number</div>
      <div class="subtext">We'll send a code by SMS to reset your password.</div>
      <div class="phone-row">
        <div class="phone-prefix"><span>🇿🇲 +260</span></div>
        <input class="phone-input" id="phoneInput" placeholder="e.g. 0977123456" maxlength="10" inputmode="tel" />
      </div>
      <button class="submit-btn" id="sendCodeBtn">Send Code</button>
    `;
    document.getElementById("sendCodeBtn").addEventListener("click", handleSendCode);
  }

  function renderResetStep() {
    content.innerHTML = `
      <div class="label">Enter the code and your new password</div>
      <div class="subtext">A 6-digit code was sent to ${phone}.</div>
      <input class="field-input" id="otpInput" placeholder="6-digit code" maxlength="6" inputmode="numeric" />
      <input class="field-input" id="newPasswordInput" type="password" placeholder="New password (8-15 characters)" maxlength="15" />
      <input class="field-input" id="confirmNewPasswordInput" type="password" placeholder="Confirm new password" maxlength="15" />
      <div class="checkbox-row" id="showPasswordRow">
        <div class="checkbox" id="showPasswordBox"></div>
        <div class="checkbox-label">Show password</div>
      </div>
      <button class="submit-btn" id="resetBtn">Reset Password</button>
      <button class="resend-text" id="resendBtn">Didn't get a code? Resend</button>
    `;

    const showPasswordBox = document.getElementById("showPasswordBox");
    document.getElementById("showPasswordRow").addEventListener("click", () => {
      showPassword = !showPassword;
      showPasswordBox.classList.toggle("checked", showPassword);
      showPasswordBox.textContent = showPassword ? "✓" : "";
      document.getElementById("newPasswordInput").type = showPassword ? "text" : "password";
      document.getElementById("confirmNewPasswordInput").type = showPassword ? "text" : "password";
    });

    document.getElementById("resetBtn").addEventListener("click", handleResetPassword);
    document.getElementById("resendBtn").addEventListener("click", handleSendCode);
  }

  async function handleSendCode() {
    if (step === "phone") {
      phone = document.getElementById("phoneInput").value.trim();
      if (!phone) {
        alert("Please enter your phone number.");
        return;
      }
      if (!isValidZambianPhone(phone)) {
        alert("Please enter a valid Zambian phone number (e.g. 0977123456).");
        return;
      }
    }

    const btn = document.getElementById(step === "phone" ? "sendCodeBtn" : "resendBtn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = step === "phone" ? "Sending…" : "Sending...";

    try {
      const res = await fetch(`${API_URL}/auth/forgot-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Could not send reset code.");
        return;
      }

      if (step === "phone") {
        step = "reset";
        renderResetStep();
      } else {
        alert("A new code has been sent.");
      }
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      if (document.getElementById(step === "phone" ? "sendCodeBtn" : "resendBtn")) {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  }

  async function handleResetPassword() {
    const otp = document.getElementById("otpInput").value.trim();
    const newPassword = document.getElementById("newPasswordInput").value.trim();
    const confirmNewPassword = document.getElementById("confirmNewPasswordInput").value.trim();

    if (!otp || !newPassword || !confirmNewPassword) {
      alert("Please fill in all fields.");
      return;
    }
    if (newPassword.length < 8 || newPassword.length > 15) {
      alert("Password must be between 8 and 15 characters.");
      return;
    }
    if (newPassword !== confirmNewPassword) {
      alert("Passwords do not match.");
      return;
    }

    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "Resetting…";

    try {
      const res = await fetch(`${API_URL}/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, otp, newPassword, confirmNewPassword })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Could not reset password.");
        return;
      }

      alert("Success — your password has been reset. Please log in.");
      window.location.href = "/login.html";
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  }

  renderPhoneStep();
</script>
</body>
</html>
