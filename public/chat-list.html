<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Chats</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .header-title svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .topbar-icon-btn {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; color: #fff; flex-shrink: 0;
  }
  .topbar-icon-btn svg {
    width: 18px; height: 18px; stroke: var(--gold); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .topbar-icon-btn .bars { stroke: var(--gold); }

  .support-banner {
    background: #2F4F3E; padding: 12px; text-align: center;
    color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; border: none; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .support-banner svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); margin-bottom: 16px; }
  .login-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }

  .list { padding: 12px; }
  .row {
    display: flex; align-items: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; gap: 12px; cursor: pointer;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 22px; background: #E01B27;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .online-dot {
    position: absolute; bottom: 0; right: 0; width: 12px; height: 12px;
    border-radius: 6px; background: #4CAF50; border: 2px solid var(--bg); display: none;
  }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 700; }
  .row-preview-line { display: flex; align-items: center; gap: 4px; min-width: 0; margin-top: 2px; }
  .row-preview { font-size: 12px; color: var(--subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .row-preview.typing { color: #4CAF50; font-style: italic; font-weight: 600; }
  .read-tick { font-size: 11px; color: var(--subtext); flex-shrink: 0; line-height: 1; }
  .read-tick.read { color: #53BDEB; }
  .row-side { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
  .row-time { font-size: 10px; color: var(--subtext); }
  .unread-badge {
    background: #E01B27; border-radius: 10px; min-width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px; margin-top: 4px;
    color: #fff; font-size: 10px; font-weight: 700;
  }

  .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .menu-overlay.open { display: flex; }
  .menu-box { background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .menu-section-label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; margin-bottom: 8px; }
  .setting-row {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .setting-title { font-size: 13px; font-weight: 600; }
  .setting-sub { font-size: 10px; color: var(--subtext); margin-top: 2px; line-height: 1.35; }
  .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 26px; transition: 0.2s; }
  .slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider { background: var(--price-red); }
  input:checked + .slider::before { transform: translateX(18px); }
  .menu-cancel-btn { display: block; width: 100%; padding: 14px; text-align: center; background: none; border: none; color: var(--subtext); font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="chats">Chats</span></div>
  <div class="topbar-actions" id="topbarActions" style="display:none">
    <button class="topbar-icon-btn" id="chatSettingsBtn" aria-label="Chat settings"><svg class="bars" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
  </div>
</div>

<div class="menu-overlay" id="settingsOverlay">
  <div class="menu-box">
    <div class="menu-section-label" data-i18n="section_chat">Chat</div>
    <div class="setting-row">
      <div>
        <div class="setting-title" data-i18n="show_online">Show Online Status</div>
        <div class="setting-sub" data-i18n="show_online_sub">Let others see when you are online</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="showOnlineToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-title" data-i18n="show_last_seen">Show Last Seen</div>
        <div class="setting-sub" data-i18n="show_last_seen_sub">Let others see when you were last active</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="showLastSeenToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-title" data-i18n="push_notifications">Message Notifications</div>
        <div class="setting-sub" data-i18n="push_notifications_sub">Get alerted when someone messages you</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="pushNotificationsToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <button class="menu-cancel-btn" id="settingsCancelBtn" data-i18n="cancel">Cancel</button>
  </div>
</div>

<button class="support-banner" id="supportBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg><span data-i18n="contact_support">Contact Support</span></button>

<div id="content"><div class="center-box" data-i18n="loading">Loading…</div></div>

<script src="/js/utils.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/data-saver.js"></script>
<script src="/js/presence.js"></script>
<script src="/js/chat-receipts.js"></script>
<script src="/js/push-notifications.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const content = document.getElementById("content");
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");
  if (!user || !token) {
    window.location.href = "/login.html";
  }
  let conversationsCache = [];
  let listPollTimer = null;
  const previewCache = new Map();
  const unreadCache = new Map();
  const settingsOverlay = document.getElementById("settingsOverlay");

  function initChatSettings() {
    if (!user) {
      document.getElementById("topbarActions").style.display = "none";
      return;
    }
    document.getElementById("topbarActions").style.display = "flex";

    document.getElementById("chatSettingsBtn").addEventListener("click", () => {
      settingsOverlay.classList.add("open");
    });
    document.getElementById("settingsCancelBtn").addEventListener("click", () => {
      settingsOverlay.classList.remove("open");
    });
    settingsOverlay.addEventListener("click", (e) => {
      if (e.target.id === "settingsOverlay") settingsOverlay.classList.remove("open");
    });

    const showOnlineToggle = document.getElementById("showOnlineToggle");
    const showLastSeenToggle = document.getElementById("showLastSeenToggle");
    showOnlineToggle.checked = getShowOnline();
    showLastSeenToggle.checked = getShowLastSeen();
    loadPresenceSettingsFromServer().then((data) => {
      showOnlineToggle.checked = data.show_online !== false;
      showLastSeenToggle.checked = data.show_last_seen !== false;
    });

    async function updatePresenceSetting(changed) {
      const showOnline = showOnlineToggle.checked;
      const showLastSeen = showLastSeenToggle.checked;
      const ok = await savePresenceSettings(showOnline, showLastSeen);
      if (!ok) {
        if (changed === "online") showOnlineToggle.checked = !showOnline;
        if (changed === "last_seen") showLastSeenToggle.checked = !showLastSeen;
        alert("Could not update chat privacy setting.");
      }
    }
    showOnlineToggle.addEventListener("change", () => updatePresenceSetting("online"));
    showLastSeenToggle.addEventListener("change", () => updatePresenceSetting("last_seen"));

    const pushToggle = document.getElementById("pushNotificationsToggle");
    refreshPushToggle(pushToggle);
    autoEnablePushNotifications().finally(() => {
      if (!isPushOptOut()) {
        startMessageNotificationPoll(API_URL, token, user.id);
      }
    });

    pushToggle.addEventListener("change", async () => {
      if (pushToggle.checked) {
        setPushOptOut(false);
        try {
          await enablePushNotifications();
          startMessageNotificationPoll(API_URL, token, user.id);
        } catch (e) {
          pushToggle.checked = false;
          setPushEnabled(false);
          if (e.message === "denied") alert(t("push_denied"));
          else if (e.message === "unsupported") alert(t("push_unsupported"));
          else if (e.message === "vapid_unavailable" || e.message === "subscribe_failed") {
            alert(t("push_server_unavailable", "Push server is unavailable. Make sure the app is running on zedmarket.app with Node.js."));
          } else alert(t("push_enable_failed"));
        }
      } else {
        setPushOptOut(true);
        await unsubscribeFromPush();
        stopMessageNotificationPoll();
      }
    });
  }

  function formatTime(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    if (isToday) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    return date.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  async function loadConversations() {
    try {
      const res = await fetch(`${API_URL}/messages/conversations`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const conversations = await res.json();

      if (!conversations.length) {
        content.innerHTML = `<div class="center-box"><div class="empty-text">${t("no_conversations")}</div></div>`;
        return;
      }

      conversationsCache = conversations;
      conversations.forEach((conv) => unreadCache.set(conv.other_user_id, parseInt(conv.unread_count) || 0));
      await loadSupportContactId();
      content.innerHTML = `<div class="list">${conversations.map(renderRow).join("")}</div>`;
      await applyListPresence(conversations);
      applyConversationNames(conversations);

      conversations.forEach(conv => {
        const row = document.getElementById(`convrow-${conv.other_user_id}`);
        if (row) row.addEventListener("click", () => {
          const supportName = t("support_chat_name", "Customer Support");
          const name = isSupportConversation(conv) ? supportName : (conv.other_user_name || "");
          window.location.href = `/chat-room.html?userId=${conv.other_user_id}&name=${encodeURIComponent(name)}${isSupportConversation(conv) ? "&support=1" : ""}`;
        });
      });
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">Could not load conversations.</div></div>`;
    }
  }

  function buildPreviewText(conv) {
    const isMine = conv.sender_id === user.id;
    let preview = isMine ? `${t("you_prefix")}: ${conv.last_message || ""}` : (conv.last_message || "");
    if (conv.last_photo_url) preview = isMine ? `${t("you_prefix")}: ${t("preview_photo")}` : t("preview_photo");
    if (conv.last_audio_url) preview = isMine ? `${t("you_prefix")}: ${t("preview_voice")}` : t("preview_voice");
    return preview;
  }

  function renderRow(conv) {
    const isMine = conv.sender_id === user.id;
    const preview = buildPreviewText(conv);
    previewCache.set(conv.other_user_id, preview);
    const read = isConversationLastMessageRead(conv);
    const displayName = getConversationName(conv);

    return `
      <div class="row" id="convrow-${conv.other_user_id}">
        <div class="avatar-wrap">
          <div class="avatar">${displayName ? displayName.charAt(0).toUpperCase() : "?"}</div>
          <span class="online-dot" id="dot-${conv.other_user_id}"></span>
        </div>
        <div class="row-info">
          <div class="row-name">${displayName}</div>
          <div class="row-preview-line">
            <span class="read-tick ${read ? "read" : "sent"} list-tick" id="tick-${conv.other_user_id}" style="${isMine ? "" : "display:none;"}">${read ? "✓✓" : "✓"}</span>
            <div class="row-preview" id="preview-${conv.other_user_id}">${preview}</div>
          </div>
        </div>
        <div class="row-side">
          <div class="row-time">${formatTime(conv.last_sent_at)}</div>
          ${parseInt(conv.unread_count) > 0 ? `<div class="unread-badge">${conv.unread_count}</div>` : ""}
        </div>
      </div>`;
  }

  function updateRowFromConversation(conv) {
    const id = conv.other_user_id;
    const isMine = conv.sender_id === user.id;
    const preview = buildPreviewText(conv);
    previewCache.set(id, preview);

    updateReadTickElement(
      document.getElementById(`tick-${id}`),
      isConversationLastMessageRead(conv),
      isMine
    );

    const rowNameEl = document.querySelector(`#convrow-${id} .row-name`);
    if (rowNameEl) {
      rowNameEl.textContent = getConversationName(conv);
    }
    const avatarEl = document.querySelector(`#convrow-${id} .avatar`);
    if (avatarEl) {
      const name = getConversationName(conv);
      if (name) avatarEl.textContent = name.charAt(0).toUpperCase();
    }

    const previewEl = document.getElementById(`preview-${id}`);
    if (previewEl && !previewEl.classList.contains("typing")) {
      previewEl.textContent = preview;
    }

    const timeEl = document.querySelector(`#convrow-${id} .row-time`);
    if (timeEl) timeEl.textContent = formatTime(conv.last_sent_at);

    const sideEl = document.querySelector(`#convrow-${id} .row-side`);
    if (sideEl) {
      const unread = parseInt(conv.unread_count) > 0;
      let badge = sideEl.querySelector(".unread-badge");
      if (unread) {
        if (!badge) {
          badge = document.createElement("div");
          badge.className = "unread-badge";
          sideEl.appendChild(badge);
        }
        badge.textContent = conv.unread_count;
      } else if (badge) {
        badge.remove();
      }
    }
  }

  async function refreshConversationsQuiet() {
    if (!user) return;
    try {
      const res = await fetch(`${API_URL}/messages/conversations`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) return;
      const conversations = await res.json();
      conversationsCache = conversations;
      conversations.forEach((conv) => {
        const id = conv.other_user_id;
        const prevUnread = unreadCache.get(id) || 0;
        const nextUnread = parseInt(conv.unread_count) || 0;
        if (nextUnread > prevUnread && conv.sender_id !== user.id) {
          const preview = buildPreviewText(conv);
          showLocalMessageNotification(
            conv.other_user_name || "ZedMarket",
            preview,
            `/chat-room.html?userId=${id}&name=${encodeURIComponent(conv.other_user_name || "")}`
          );
        }
        unreadCache.set(id, nextUnread);
        updateRowFromConversation(conv);
      });
      await applyListPresence(conversations);
      applyConversationNames(conversations);
    } catch (e) {}
  }

  async function applyListPresence(conversations) {
    const ids = conversations.map((c) => c.other_user_id);
    const map = await fetchPresenceMap(ids, { includeTyping: true });
    conversations.forEach((conv) => {
      const id = conv.other_user_id;
      const data = map[id];
      applyPresenceDot(document.getElementById(`dot-${id}`), data);
      const previewEl = document.getElementById(`preview-${id}`);
      if (previewEl && data?.typing) {
        previewEl.textContent = typeof t === "function" ? t("status_typing") : "typing...";
        previewEl.classList.add("typing");
      } else if (previewEl) {
        previewEl.textContent = previewCache.get(id) || previewEl.textContent;
        previewEl.classList.remove("typing");
      }
    });
  }

  document.getElementById("supportBtn").addEventListener("click", async () => {
    try {
      const res = await fetch(`${API_URL}/admin/support-contact`);
      if (res.ok) {
        const data = await res.json();
        window.location.href = `/chat-room.html?userId=${data.id}&support=1`;
      }
    } catch (e) {}
  });

  let supportContactId = null;
  const displayNameCache = new Map();

  function myDisplayName() {
    return user?.display_name || user?.name || user?.shop_name || "";
  }

  async function loadSupportContactId() {
    if (supportContactId) return supportContactId;
    try {
      const res = await fetch(`${API_URL}/admin/support-contact`);
      if (res.ok) {
        const data = await res.json();
        supportContactId = String(data.id);
      }
    } catch (e) {}
    return supportContactId;
  }

  function isSupportConversation(conv) {
    const otherId = String(conv.other_user_id);
    if (supportContactId && otherId === supportContactId) return true;
    if (conv.other_user_is_admin || conv.other_is_admin) return true;
    const apiName = (conv.other_user_name || "").trim();
    if (/^customer support$/i.test(apiName) || /^zedmarket support$/i.test(apiName)) return true;
    const mine = myDisplayName().trim();
    if (mine && apiName.toLowerCase() === mine.toLowerCase()) return true;
    return false;
  }

  function getConversationName(conv) {
    const otherId = String(conv.other_user_id);
    if (isSupportConversation(conv)) {
      const label = t("support_chat_name", "Customer Support");
      displayNameCache.set(otherId, label);
      return label;
    }
    const cached = displayNameCache.get(otherId);
    if (cached) return cached;
    const apiName = (conv.other_user_name || "").trim();
    return apiName || t("chat_unknown_user", "Chat");
  }

  function updateRowName(userId, name) {
    displayNameCache.set(String(userId), name);
    const rowName = document.querySelector(`#convrow-${userId} .row-name`);
    const avatar = document.querySelector(`#convrow-${userId} .avatar`);
    if (rowName) rowName.textContent = name;
    if (avatar && name) avatar.textContent = name.charAt(0).toUpperCase();
  }

  function applyConversationNames(conversations) {
    conversations.forEach((conv) => {
      updateRowName(conv.other_user_id, getConversationName(conv));
    });
  }

  function stopListPoll() {
    if (listPollTimer) { clearInterval(listPollTimer); listPollTimer = null; }
  }

  function startListPoll() {
    stopListPoll();
    listPollTimer = setInterval(async () => {
      if (conversationsCache.length) await refreshConversationsQuiet();
    }, getPollInterval(5000));
  }

  initChatSettings();
  startPresenceHeartbeat();
  loadConversations();
  startListPoll();
  window.addEventListener("pageshow", () => {
    if (conversationsCache.length) refreshConversationsQuiet();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopListPoll();
    else startListPoll();
  });
  window.addEventListener("pagehide", () => {
    stopPresenceHeartbeat();
    stopListPoll();
  });
</script>
</body>
</html>
