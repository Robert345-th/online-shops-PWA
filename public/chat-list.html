<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Chats</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; color: #fff; font-size: 18px;
  }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .support-banner {
    background: #2F4F3E; padding: 12px; text-align: center;
    color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; border: none; width: 100%;
  }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); margin-bottom: 16px; }
  .login-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }

  .list { padding: 12px; }
  .row {
    display: flex; align-items: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; gap: 12px; cursor: pointer;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 22px; background: #E01B27;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 700; }
  .row-preview { font-size: 12px; color: var(--subtext); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-side { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
  .row-time { font-size: 10px; color: var(--subtext); }
  .unread-badge {
    background: #E01B27; border-radius: 10px; min-width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px; margin-top: 4px;
    color: #fff; font-size: 10px; font-weight: 700;
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-button" onclick="history.back()">←</button>
  <div class="header-title">💬 Chats</div>
</div>

<button class="support-banner" id="supportBtn">🛟 Contact Support</button>

<div id="content"><div class="center-box">Loading…</div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const content = document.getElementById("content");
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");

  function formatTime(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    if (isToday) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    return date.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  async function loadConversations() {
    if (!user) {
      content.innerHTML = `
        <div class="center-box">
          <div class="empty-text">Log in to see your chats.</div>
          <button class="login-btn" onclick="window.location.href='/login.html'">Log In</button>
        </div>`;
      return;
    }

    try {
      const res = await fetch(`${API_URL}/messages/conversations`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const conversations = await res.json();

      if (!conversations.length) {
        content.innerHTML = `<div class="center-box"><div class="empty-text">No conversations yet.</div></div>`;
        return;
      }

      content.innerHTML = `<div class="list">${conversations.map(renderRow).join("")}</div>`;

      conversations.forEach(conv => {
        const row = document.getElementById(`convrow-${conv.other_user_id}`);
        if (row) row.addEventListener("click", () => {
          window.location.href = `/chat-room.html?userId=${conv.other_user_id}`;
        });
      });
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="empty-text">Could not load conversations.</div></div>`;
    }
  }

  function renderRow(conv) {
    const isMine = conv.sender_id === user.id;
    let preview = isMine ? `You: ${conv.last_message}` : conv.last_message;
    if (conv.last_photo_url) preview = "📷 Photo";
    if (conv.last_audio_url) preview = "🎤 Voice note";

    return `
      <div class="row" id="convrow-${conv.other_user_id}">
        <div class="avatar">${conv.other_user_name ? conv.other_user_name.charAt(0).toUpperCase() : "?"}</div>
        <div class="row-info">
          <div class="row-name">${conv.other_user_name}</div>
          <div class="row-preview">${preview}</div>
        </div>
        <div class="row-side">
          <div class="row-time">${formatTime(conv.last_sent_at)}</div>
          ${parseInt(conv.unread_count) > 0 ? `<div class="unread-badge">${conv.unread_count}</div>` : ""}
        </div>
      </div>`;
  }

  document.getElementById("supportBtn").addEventListener("click", async () => {
    try {
      const res = await fetch(`${API_URL}/admin/support-contact`);
      if (res.ok) {
        const data = await res.json();
        window.location.href = `/chat-room.html?userId=${data.id}`;
      }
    } catch (e) {}
  });

  loadConversations();
</script>
</body>
</html>
