<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Favorites</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --thumb-bg: #E9E2D3;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
    --thumb-bg: #2A2A2A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg {
    width: 22px; height: 22px; stroke: var(--gold); fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .brand { color: var(--gold); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); margin-bottom: 16px; }
  .error-text { color: var(--price-red); text-align: center; }
  .login-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid { display: flex; flex-wrap: wrap; padding: 12px; gap: 10px; }
  .card { width: calc(47% - 5px); background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; }
  .thumb { height: 130px; background: var(--thumb-bg); display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .info { padding: 10px; }
  .price { font-weight: 700; font-size: 14px; color: var(--price-red); }
  .title { font-size: 12px; color: var(--text); margin: 3px 0; }
  .loc { font-size: 10.5px; color: var(--subtext); }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span data-i18n="favorites">Favorites</span></div>
</div>

<div id="content"><div class="center-box"><div class="spinner"></div></div></div>

<script src="/js/lang.js"></script>
<script src="/js/data-saver.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");
  const content = document.getElementById("content");

  async function loadFavorites() {
    if (!user) {
      content.innerHTML = `
        <div class="center-box">
          <div class="empty-text">${t("log_in_to_see")}</div>
          <button class="login-btn" onclick="window.location.href='/login.html'">${t("login")}</button>
        </div>`;
      return;
    }

    try {
      const res = await fetch(`${API_URL}/favorites`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const favorites = await res.json();

      if (!favorites.length) {
        content.innerHTML = `<div class="center-box"><div class="empty-text">${t("no_favorites")}</div></div>`;
        return;
      }

      content.innerHTML = `<div class="grid">${favorites.map(renderCard).join("")}</div>`;

      favorites.forEach(item => {
        const card = document.getElementById(`fav-${item.id}`);
        if (card) card.addEventListener("click", () => window.location.href = `/listing.html?id=${item.id}`);
      });
      observeLazyImages(content);
    } catch (e) {
      content.innerHTML = `<div class="center-box"><div class="error-text">Could not load favorites.</div></div>`;
    }
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    return `
      <div class="card" id="fav-${item.id}">
        <div class="thumb">
          ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(32)}
        </div>
        <div class="info">
          <div class="price">K${item.price}</div>
          <div class="title">${item.title}</div>
          <div class="loc">📍 ${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  loadFavorites();
</script>
</body>
</html>
