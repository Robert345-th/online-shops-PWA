<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket - Edit Listing</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #111111; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --orange: #FF7A1A; --red-btn: #E01B27;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

  .content { padding: 20px; max-width: 560px; margin: 0 auto; }
  .center-box { display: flex; align-items: center; justify-content: center; padding: 100px 24px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: #A3131C;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-button {
    width: 36px; height: 36px; border-radius: 18px; background: var(--black);
    display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: var(--gold); font-size: 18px;
  }
  .title { font-size: 20px; font-weight: 700; }

  .label { font-size: 11px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 14px; }
  textarea.field-input { height: 80px; resize: vertical; }

  .cat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .cat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .cat-chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }

  .submit-btn { width: 100%; background: var(--red-btn); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
  .submit-btn:disabled { opacity: 0.7; }
</style>
</head>
<body>

<div id="app"><div class="center-box"><div class="spinner"></div></div></div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORY_OPTIONS = [
    { label: "Electronics", id: 1 },
    { label: "Clothing", id: 2 },
    { label: "Furniture", id: 3 },
    { label: "Produce", id: 4 },
    { label: "Cars", id: 5 },
    { label: "Land", id: 6 },
  ];

  const params = new URLSearchParams(window.location.search);
  const listingId = params.get("id");
  const token = localStorage.getItem("zm_token");
  const app = document.getElementById("app");

  let categoryId = CATEGORY_OPTIONS[0].id;
  let photos = [];

  async function loadListing() {
    try {
      const res = await fetch(`${API_URL}/listings/${listingId}`);
      const data = await res.json();
      categoryId = data.category_id || CATEGORY_OPTIONS[0].id;
      photos = data.photos || [];
      render(data);
    } catch (e) {
      alert("Could not load listing.");
    }
  }

  function render(data) {
    app.innerHTML = `
      <div class="content">
        <div class="top-row">
          <button class="back-button" onclick="history.back()">←</button>
          <div class="title">Edit Listing</div>
        </div>

        <div class="label">Title</div>
        <input class="field-input" id="titleInput" value="${data.title || ""}" />

        <div class="label">Price (ZMW)</div>
        <input class="field-input" id="priceInput" type="number" value="${data.price || ""}" />

        <div class="label">Category</div>
        <div class="cat-row" id="catRow"></div>

        <div class="label">Description</div>
        <textarea class="field-input" id="descInput">${data.description || ""}</textarea>

        <button class="submit-btn" id="saveBtn">Save Changes</button>
      </div>`;

    renderCatRow();
    document.getElementById("saveBtn").addEventListener("click", handleSave);
  }

  function renderCatRow() {
    const row = document.getElementById("catRow");
    row.innerHTML = CATEGORY_OPTIONS.map(c =>
      `<div class="cat-chip ${categoryId === c.id ? "active" : ""}" data-cat="${c.id}">${c.label}</div>`
    ).join("");
    row.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => {
        categoryId = parseInt(el.dataset.cat);
        renderCatRow();
      })
    );
  }

  async function handleSave() {
    const title = document.getElementById("titleInput").value.trim();
    const price = document.getElementById("priceInput").value;
    const description = document.getElementById("descInput").value.trim();

    if (!title || !price) {
      alert("Title and price are required.");
      return;
    }

    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const res = await fetch(`${API_URL}/listings/${listingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          title, description,
          price: parseFloat(price),
          category_id: categoryId,
          photos
        })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      alert("Updated! Your listing has been updated.");
      window.location.href = "/my-shop.html";
    } catch (e) {
      alert("Could not connect to the server.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save Changes";
    }
  }

  if (!listingId) {
    app.innerHTML = `<div class="center-box">No listing specified.</div>`;
  } else if (!token) {
    window.location.href = "/login.html";
  } else {
    loadListing();
  }
</script>
</body>
</html>
