<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - My Shop</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C; --orange: #FF7A1A;
    --thumb-bg: #E9E2D3; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
  }
  body.dark {
    --bg: #121212; --card: #252525; --border: #505050;
    --text: #F5F2ED; --subtext: #C9C0B6; --black: #111111;
    --thumb-bg: #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar {
    background: var(--black); padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { color: var(--gold); font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .sub-brand { color: #C9BFAF; font-size: 12px; margin-top: 2px; }
  .countdown { color: var(--gold); font-size: 11px; margin-top: 2px; font-weight: 600; }
  .sell-btn { background: var(--orange); color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }

  .action-row { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; }
  .share-shop-btn {
    background: var(--card); border: 2px solid var(--text); padding: 12px 14px;
    border-radius: 0; color: var(--text); font-weight: 800; font-size: 11px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .sold-section { padding: 0 14px 8px; }
  .sold-section-title { font-size: 11px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .sold-chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .sold-chip {
    flex-shrink: 0; background: var(--card); border: 2px solid var(--border); border-radius: 0;
    padding: 10px 12px; font-size: 12px; font-weight: 600; cursor: pointer; max-width: 180px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .edit-profile-btn {
    background: var(--card); border: 2px solid var(--text); padding: 12px 14px;
    border-radius: 0; color: var(--text); font-weight: 800; font-size: 11px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .upgrade-btn { flex: 1; background: var(--black); color: var(--gold); border: none; padding: 12px; border-radius: 0; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
  .admin-btn { background: var(--card); border: 2px solid var(--text); padding: 12px 16px; border-radius: 0; color: var(--text); font-weight: 800; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .admin-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .warning-banner { background: var(--warn-bg); border: 2px solid var(--orange); border-radius: 0; padding: 12px; margin: 0 12px 8px; }
  .warning-text { color: var(--warn-text); font-size: 12px; margin-bottom: 8px; }
  .warning-btn { background: var(--orange); color: #fff; border: none; padding: 8px; width: 100%; border-radius: 0; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }

  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .gate-icon { margin-bottom: 12px; color: var(--orange); display: flex; justify-content: center; }
  .gate-icon svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .gate-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .gate-text { font-size: 13px; color: var(--subtext); margin-bottom: 20px; line-height: 1.5; }
  .reason-box { background: var(--warn-bg); border-radius: 0; padding: 12px; margin-bottom: 16px; width: 100%; text-align: left; }
  .reason-label { font-size: 10px; color: var(--warn-text); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
  .reason-text { font-size: 13px; color: var(--warn-text); }
  .register-btn { background: #E01B27; color: #fff; border: none; padding: 14px 24px; border-radius: 0; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
  .login-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 0; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px; }
  .empty-text { color: var(--subtext); margin-bottom: 16px; }
  .error-text { color: var(--price-red); }

  .list { padding: 14px; }
  .row { display: flex; align-items: center; background: var(--card); border-radius: 0; border: 2px solid var(--border); padding: 10px; margin-bottom: 10px; }
  .row.disabled { opacity: 0.6; border-color: var(--price-red); }
  .row-main { display: flex; flex: 1; align-items: center; cursor: pointer; }
  .thumb { width: 60px; height: 60px; border-radius: 0; background: var(--thumb-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-right: 12px; position: relative; flex-shrink: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .boost-badge { position: absolute; top: 2px; right: 2px; background: var(--orange); min-width: 18px; height: 18px; border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #fff; padding: 0 3px; }
  .row-info { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-price { font-size: 13px; color: var(--price-red); font-weight: 700; margin-top: 2px; }
  .row-views { font-size: 10px; color: var(--subtext); margin-top: 2px; }
  .status-badge { display: inline-block; background: var(--black); color: var(--gold); padding: 2px 8px; border-radius: 0; font-size: 9px; font-weight: 800; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .disabled-badge { display: inline-block; background: var(--price-red); color: #fff; padding: 2px 8px; border-radius: 0; font-size: 9px; font-weight: 800; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .boosted-badge { display: inline-block; background: var(--orange); color: #fff; padding: 2px 8px; border-radius: 0; font-size: 9px; font-weight: 800; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .manage-btn { width: 40px; height: 40px; border-radius: 0; background: var(--bg); border: 2px solid var(--text); display: flex; align-items: center; justify-content: center; margin-left: 8px; font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg); width: 100%; max-width: 480px; border-radius: 0; border-top: 3px solid var(--black); padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .modal-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: -0.01em; }
  .modal-subtitle { font-size: 12px; color: var(--subtext); margin-bottom: 14px; }
  .modal-row { display: block; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--text); border-radius: 0; padding: 16px; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; text-transform: uppercase; letter-spacing: 0.02em; }
  .modal-row.danger { color: var(--price-red); border-color: var(--price-red); }
  .picker-label { font-size: 11px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 8px; }
  .contact-row { background: var(--card); border: 2px solid var(--border); border-radius: 0; padding: 14px; margin-bottom: 8px; font-weight: 600; cursor: pointer; }
  .phone-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .phone-input { flex: 1; background: var(--card); border: none; border-bottom: 2px solid var(--text); border-radius: 0; padding: 12px 2px; font-size: 14px; }
  .phone-send-btn { background: var(--black); color: var(--gold); border: none; padding: 0 18px; border-radius: 0; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
  .skip-btn { display: block; width: 100%; padding: 14px; text-align: center; margin-top: 6px; background: none; border: none; color: var(--price-red); font-weight: 700; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em; }
  .modal-cancel-btn { display: block; width: 100%; padding: 12px; text-align: center; background: none; border: none; color: var(--subtext); font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body data-nav-active="shop">
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div id="app"></div>

<div class="modal-overlay" id="manageModal">
  <div class="modal-box">
    <div class="modal-title" id="manageModalTitle"></div>
    <button class="modal-row" id="sellSimilarBtn"></button>
    <button class="modal-row" id="editListingBtn"></button>
    <button class="modal-row" id="boostListingBtn"></button>
    <button class="modal-row" id="markReservedBtn"></button>
    <button class="modal-row danger" id="markSoldBtn"></button>
    <button class="modal-cancel-btn" id="manageCancelBtn" data-i18n="cancel">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="buyerModal">
  <div class="modal-box">
    <div class="modal-title">Who bought this?</div>
    <div class="modal-subtitle">Confirming with a real buyer helps build your trust badge once they confirm.</div>
    <div id="contactsSection"></div>
    <div class="picker-label">Or enter their phone number</div>
    <div class="phone-row">
      <input class="phone-input" id="buyerPhoneInput" placeholder="e.g. 0977123456" />
      <button class="phone-send-btn" id="phoneSendBtn">Send</button>
    </div>
    <button class="skip-btn" id="skipConfirmBtn" data-i18n="remove_listing_only">Remove listing only</button>
    <button class="modal-cancel-btn" id="buyerCancelBtn">Cancel</button>
  </div>
</div>

<script src="/js/lang.js"></script>
<script src="/js/bottom-nav.js"></script>
<script src="/js/data-saver.js"></script>
<script src="/js/pwa-install.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  function myShopBrand() {
    return `<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>${t("my_shop")}</div>`;
  }
  const ADMIN_BTN = '<button class="admin-btn" onclick="window.location.href=\'/admin.html\'"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Admin</button>';
  const app = document.getElementById("app");
  const manageModal = document.getElementById("manageModal");
  const buyerModal = document.getElementById("buyerModal");

  let user = JSON.parse(localStorage.getItem("zm_user") || "null");
  let token = localStorage.getItem("zm_token");
  let listings = [];
  let subscription = null;
  let paymentEnforced = false;
  let shopAccountType = "individual";
  let shopStatus = null;
  let rejectionReason = null;
  let shopCompliance = null;
  let manageItem = null;
  let buyerPickerItem = null;
  let contacts = [];

  function gateIcon(type) {
    const icons = {
      pending: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      rejected: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      register: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    };
    return `<div class="gate-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[type] || icons.register}</svg></div>`;
  }

  function renewLabel(daysLeft) {
    if (daysLeft <= 0) return t("expires_today");
    return daysLeft === 1 ? t("renews_in_one") : t("renews_in", { days: daysLeft });
  }

  document.getElementById("sellSimilarBtn").textContent = t("sell_similar");
  document.getElementById("editListingBtn").textContent = t("edit_listing");
  document.getElementById("boostListingBtn").textContent = t("boost_listing");
  document.getElementById("markReservedBtn").textContent = t("mark_reserved");
  document.getElementById("markSoldBtn").textContent = t("mark_sold");

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  function applyShopStatus(data) {
    shopAccountType = data.account_type || "individual";
    shopStatus = data.shop_status || null;
    rejectionReason = data.shop_rejection_reason || null;
    shopCompliance = data;
  }

  async function loadData() {
    if (!user || !token) { window.location.href = "/login.html"; return; }

    app.innerHTML = `
      <div class="topbar">
        <div>
          ${myShopBrand()}
          <div class="sub-brand">${user.name || ""}</div>
        </div>
      </div>
      <div class="center-box"><div>${t("loading")}</div></div>`;

    try {
      const [listingsRes, shopStatusRes, subRes, statusRes] = await Promise.all([
        fetch(`${API_URL}/listings/mine/all`, { headers: authHeaders() }),
        fetch(`${API_URL}/auth/shop-status`, { headers: authHeaders() }),
        fetch(`${API_URL}/subscriptions/mine`, { headers: authHeaders() }),
        fetch(`${API_URL}/settings/payment-status`),
      ]);

      listings = await listingsRes.json();
      applyShopStatus(await shopStatusRes.json());
      subscription = await subRes.json();
      const statusData = await statusRes.json();
      paymentEnforced = statusData.enforced === true;
      render();
    } catch (e) {
      app.innerHTML = `<div class="topbar">${myShopBrand()}</div><div class="center-box"><div class="error-text">Could not load your listings.</div></div>`;
    }
  }

  function renderLoggedOut() {
    app.innerHTML = `
      <div class="topbar">${myShopBrand()}</div>
      <div class="center-box">
        <div class="empty-text">${t("log_in_to_shop")}</div>
        <button class="login-btn" onclick="window.location.href='/login.html'">${t("login")}</button>
      </div>`;
  }

  function render() {
    const isApprovedShop = shopAccountType === "shop" && shopStatus === "approved";
    const isPendingShop = shopAccountType === "shop" && shopStatus === "pending";
    const isRejectedShop = shopAccountType === "shop" && shopStatus === "rejected";
    const isBuyerOnly = shopStatus === null || shopAccountType !== "shop";

    if (isBuyerOnly || isPendingShop || isRejectedShop) {
      let gateHtml = "";
      if (isPendingShop) {
        gateHtml = `
          ${gateIcon("pending")}
          <div class="gate-title">${t("gate_shop_pending_title")}</div>
          <div class="gate-text">${t("gate_shop_pending_text")}</div>`;
      } else if (isRejectedShop) {
        gateHtml = `
          ${gateIcon("rejected")}
          <div class="gate-title">${t("gate_shop_rejected_title")}</div>
          ${rejectionReason ? `<div class="reason-box"><div class="reason-label">${t("reason_given")}</div><div class="reason-text">${rejectionReason}</div></div>` : ""}
          <div class="gate-text">${t("gate_shop_rejected_text")}</div>
          <button class="register-btn" onclick="window.location.href='/register-shop.html'">${t("gate_try_again")}</button>`;
      } else {
        gateHtml = `
          ${gateIcon("register")}
          <div class="gate-title">${t("gate_register_title")}</div>
          <div class="gate-text">${t("gate_register_text")}</div>
          <button class="register-btn" onclick="window.location.href='/register-shop.html'">${t("register_shop")}</button>`;
      }

      app.innerHTML = `
        <div class="topbar">
          <div>
            ${myShopBrand()}
            <div class="sub-brand">${user.name}</div>
          </div>
        </div>
        <div class="center-box">${gateHtml}</div>`;
      return;
    }

    const isVerifiedShop = subscription?.payment_status === "active";
    const isPending = subscription?.payment_status === "pending";
    let daysLeft = null;
    if (isVerifiedShop && subscription?.end_date) {
      const end = new Date(subscription.end_date).getTime();
      daysLeft = Math.max(0, Math.ceil((end - Date.now()) / (1000 * 60 * 60 * 24)));
    }
    const disabledCount = listings.filter(i => i.payment_disabled).length;
    const nrcBlocked = shopCompliance?.nrc_grace_expired === true && shopCompliance?.nrc_verified !== true;
    const canPost = isApprovedShop && !nrcBlocked;
    const nrcBanner = buildNrcBanner();

    app.innerHTML = `
      <div class="topbar">
        <div>
          ${myShopBrand()}
          <div class="sub-brand">${user.name} ${isVerifiedShop ? `· ${t("verified_shop")}` : isPending ? `· ${t("status_pending")}` : ""}</div>
          ${isVerifiedShop && daysLeft !== null ? `<div class="countdown">${renewLabel(daysLeft)}</div>` : ""}
        </div>
        ${canPost ? `<button class="sell-btn" onclick="window.location.href='/post-listing.html'">${t("sell_btn")}</button>` : ""}
      </div>

      <div class="action-row">
        <button class="edit-profile-btn" onclick="window.location.href='/edit-shop-profile.html'">${t("edit_shop_profile")}</button>
        <button class="edit-profile-btn" onclick="window.location.href='/seller-insights.html'">${t("shop_insights")}</button>
        <button class="edit-profile-btn" onclick="window.location.href='/seller-profile.html?id=${user.id}'">${t("view_my_shop")}</button>
        <button class="share-shop-btn" id="shareShopBtn">${t("share_shop")}</button>
        ${paymentEnforced && !isVerifiedShop ? `<button class="upgrade-btn" onclick="window.location.href='/upgrade-shop.html'">${isPending ? t("upgrade_pending") : t("upgrade_to_shop")}</button>` : ""}
        ${isVerifiedShop && daysLeft !== null && daysLeft <= 5 ? `<button class="upgrade-btn" onclick="window.location.href='/upgrade-shop.html'">${t("renew_now")}</button>` : ""}
        ${user.is_admin ? ADMIN_BTN : ""}
      </div>

      ${nrcBanner}

      ${disabledCount > 0 ? `
        <div class="warning-banner">
          <div class="warning-text">${t("hidden_listings_warning", { count: disabledCount })}</div>
          <button class="warning-btn" onclick="window.location.href='/upgrade-shop.html'">${t("subscribe_now")}</button>
        </div>` : ""}

      ${renderSoldTemplatesSection()}

      ${listings.length === 0 ? `
        <div class="center-box">
          <div class="empty-text">${t("no_listings_yet")}</div>
          ${canPost ? `<button class="login-btn" onclick="window.location.href='/post-listing.html'">${t("post_first_listing")}</button>` : ""}
        </div>` : `
        <div class="list">${listings.map(renderRow).join("")}</div>`}
    `;

    listings.forEach(item => {
      const rowMain = document.getElementById(`rowmain-${item.id}`);
      if (rowMain) rowMain.addEventListener("click", () => window.location.href = `/listing.html?id=${item.id}`);
      const manageBtn = document.getElementById(`manage-${item.id}`);
      if (manageBtn) manageBtn.addEventListener("click", () => openManageModal(item));
    });
    document.getElementById("shareShopBtn")?.addEventListener("click", shareShop);
    document.querySelectorAll("[data-similar]").forEach((el) => {
      el.addEventListener("click", () => {
        window.location.href = `/post-listing.html?similar=${el.dataset.similar}`;
      });
    });
    observeLazyImages(app);
  }

  function getSoldTemplates() {
    try {
      return JSON.parse(localStorage.getItem("zm_sold_templates") || "[]");
    } catch {
      return [];
    }
  }

  function saveSoldTemplate(item) {
    if (!item) return;
    const templates = getSoldTemplates().filter((t) => t.title !== item.title);
    templates.unshift({
      title: item.title,
      description: item.description || "",
      price: item.price,
      category: item.category,
      category_id: item.category_id,
      condition: item.condition,
      location_label: item.location_label || "",
      photos: item.photos || [],
      saved_at: Date.now(),
    });
    localStorage.setItem("zm_sold_templates", JSON.stringify(templates.slice(0, 5)));
  }

  function renderSoldTemplatesSection() {
    const templates = getSoldTemplates();
    if (!templates.length) return "";
    return `
      <div class="sold-section">
        <div class="sold-section-title">${t("sell_similar_again")}</div>
        <div class="sold-chip-row">
          ${templates.map((item, index) => `<button type="button" class="sold-chip" data-similar="${index}">${item.title}</button>`).join("")}
        </div>
      </div>`;
  }

  async function shareShop() {
    const shopName = user.shop_name || user.name || "My Shop";
    const url = `${window.location.origin}/seller-profile.html?id=${user.id}`;
    const text = `${shopName} on ZedMarket\n${url}`;
    const waText = encodeURIComponent(text);
    if (navigator.share) {
      try {
        await navigator.share({ title: shopName, text: `${shopName} on ZedMarket`, url });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    window.open(`https://wa.me/?text=${waText}`, "_blank");
  }

  function buildNrcBanner() {
    const c = shopCompliance;
    if (!c || c.nrc_verified) return "";

    if (c.nrc_grace_expired && !c.nrc_verified) {
      const msg = c.nrc_status === "pending" && c.nrc_submitted
        ? t("nrc_expired_pending")
        : t("nrc_expired_blocked");
      const btn = c.nrc_submitted && c.nrc_status === "pending"
        ? ""
        : `<button class="warning-btn" onclick="window.location.href='/submit-nrc.html'">${t("submit_nrc_btn")}</button>`;
      return `<div class="warning-banner"><div class="warning-text">${msg}</div>${btn}</div>`;
    }

    if (c.nrc_grace_active && !c.nrc_verified) {
      const deadline = c.nrc_grace_end ? new Date(c.nrc_grace_end).toLocaleString() : "";
      if (c.nrc_status === "pending" && c.nrc_submitted) {
        return `<div class="warning-banner"><div class="warning-text">${t("nrc_pending_review")}</div></div>`;
      }
      if (c.nrc_status === "rejected") {
        return `<div class="warning-banner"><div class="warning-text">${t("nrc_rejected_resubmit")}</div><button class="warning-btn" onclick="window.location.href='/submit-nrc.html'">${t("submit_nrc_btn")}</button></div>`;
      }
      return `<div class="warning-banner"><div class="warning-text">${t("nrc_grace_warning", { date: deadline })}</div><button class="warning-btn" onclick="window.location.href='/submit-nrc.html'">${t("submit_nrc_btn")}</button></div>`;
    }

    return "";
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderRow(item) {
    const img = (item.photos && item.photos[0])
      || (item.video_url && typeof videoPosterUrl === "function" ? videoPosterUrl(item.video_url) : null);
    let badge = `<div class="status-badge">${item.status}</div>`;
    if (item.payment_disabled) {
      badge = `<div class="disabled-badge">${t("disabled_needs_sub", { category: item.category })}</div>`;
    } else if (item.is_boosted) {
      badge = `<div class="boosted-badge">${t("boosted_label")}</div>`;
    }
    return `
      <div class="row ${item.payment_disabled ? "disabled" : ""}">
        <div class="row-main" id="rowmain-${item.id}">
          <div class="thumb">
            ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(24)}
            ${item.is_boosted ? `<div class="boost-badge">B</div>` : ""}
          </div>
          <div class="row-info">
            <div class="row-title">${item.title}</div>
            <div class="row-price">K${item.price}</div>
            ${item.view_count > 0 ? `<div class="row-views">${t("listing_views_count", { count: item.view_count })}</div>` : ""}
            ${badge}
          </div>
        </div>
        <button class="manage-btn" id="manage-${item.id}">⋮</button>
      </div>`;
  }

  function openManageModal(item) {
    manageItem = item;
    document.getElementById("manageModalTitle").textContent = item.title;
    document.getElementById("boostListingBtn").style.display = item.is_boosted || item.status === "sold" ? "none" : "block";
    const reservedBtn = document.getElementById("markReservedBtn");
    if (item.status === "sold") {
      reservedBtn.textContent = t("relist_listing");
    } else if (item.status === "reserved") {
      reservedBtn.textContent = t("mark_available");
    } else {
      reservedBtn.textContent = t("mark_reserved");
    }
    manageModal.classList.add("open");
  }

  document.getElementById("manageCancelBtn").addEventListener("click", () => { manageModal.classList.remove("open"); manageItem = null; });
  document.getElementById("sellSimilarBtn").addEventListener("click", () => {
    if (!manageItem) return;
    window.location.href = `/post-listing.html?copy=${manageItem.id}`;
  });
  document.getElementById("editListingBtn").addEventListener("click", () => { window.location.href = `/edit-listing.html?id=${manageItem.id}`; });
  document.getElementById("boostListingBtn").addEventListener("click", () => { window.location.href = `/boost-listing.html?id=${manageItem.id}`; });
  document.getElementById("markReservedBtn").addEventListener("click", async () => {
    if (!manageItem) return;
    const next = manageItem.status === "reserved" || manageItem.status === "sold" ? "active" : "reserved";
    manageModal.classList.remove("open");
    await setListingStatus(manageItem.id, next);
    manageItem = null;
  });
  document.getElementById("markSoldBtn").addEventListener("click", () => { manageModal.classList.remove("open"); openBuyerPicker(manageItem); });

  async function openBuyerPicker(item) {
    buyerPickerItem = item;
    document.getElementById("buyerPhoneInput").value = "";
    document.getElementById("contactsSection").innerHTML = `<div style="text-align:center;padding:14px;">Loading…</div>`;
    buyerModal.classList.add("open");
    try {
      const res = await fetch(`${API_URL}/sale-confirmations/recent-contacts`, { headers: authHeaders() });
      contacts = await res.json();
    } catch (e) {
      contacts = [];
    }
    renderContacts();
  }

  function renderContacts() {
    if (!contacts.length) {
      document.getElementById("contactsSection").innerHTML = "";
      return;
    }
    document.getElementById("contactsSection").innerHTML = `
      <div class="picker-label">From your chats</div>
      ${contacts.map(c => `<div class="contact-row" data-id="${c.id}">${c.name}</div>`).join("")}`;
    document.querySelectorAll(".contact-row").forEach(el =>
      el.addEventListener("click", () => confirmWithBuyerId(el.dataset.id))
    );
  }

  async function confirmWithBuyerId(buyerId) {
    buyerModal.classList.remove("open");
    const listingId = buyerPickerItem?.id;
    const listingTitle = buyerPickerItem?.title;
    buyerPickerItem = null;
    try {
      const res = await fetch(`${API_URL}/sale-confirmations`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ buyer_id: buyerId, listing_title: listingTitle })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Please try again.");
        return;
      }
      alert("Sent — we've asked the buyer to confirm.");
      await setListingStatus(listingId, "sold");
    } catch (e) {
      alert("Could not connect to the server.");
    }
  }

  document.getElementById("phoneSendBtn").addEventListener("click", async () => {
    const phone = document.getElementById("buyerPhoneInput").value.trim();
    if (!phone) { alert("Please enter the buyer's phone number."); return; }
    try {
      const res = await fetch(`${API_URL}/sale-confirmations`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ buyer_phone: phone, listing_title: buyerPickerItem.title })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Please try again."); return; }
      buyerModal.classList.remove("open");
      alert("Sent — we've asked the buyer to confirm.");
      await setListingStatus(buyerPickerItem.id, "sold");
      buyerPickerItem = null;
    } catch (e) {
      alert("Could not connect to the server.");
    }
  });

  document.getElementById("skipConfirmBtn").addEventListener("click", async () => {
    if (!buyerPickerItem) return;
    if (!confirm(t("remove_listing_confirm"))) return;
    buyerModal.classList.remove("open");
    await setListingStatus(buyerPickerItem.id, "sold");
    buyerPickerItem = null;
  });
  document.getElementById("buyerCancelBtn").addEventListener("click", () => { buyerModal.classList.remove("open"); buyerPickerItem = null; });

  async function setListingStatus(id, status) {
    const item = listings.find((i) => i.id === id);
    if (status === "sold" && item) saveSoldTemplate(item);
    try {
      const res = await fetch(`${API_URL}/listings/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ status }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || "Could not update listing.");
        return;
      }
      listings = listings.map((i) => i.id === id ? { ...i, status } : i);
      render();
    } catch (e) {
      alert("Could not connect to the server.");
    }
  }

  async function removeListing(id) {
    const item = listings.find((i) => i.id === id);
    if (item) saveSoldTemplate(item);
    try {
      const res = await fetch(`${API_URL}/listings/${id}`, { method: "DELETE", headers: authHeaders() });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || "Could not remove listing.");
        return;
      }
      listings = listings.filter(i => i.id !== id);
      render();
    } catch (e) {
      alert("Could not connect to the server.");
    }
  }

  loadData();
  initPwaInstall({ showBanner: false });
</script>
</body>
</html>
