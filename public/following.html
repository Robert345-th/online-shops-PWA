<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/android-chrome.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app-touch.js"></script>
<title>ZedMarket - Following</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --gold: #F5C518; --price-red: #A3131C;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  .topbar { background: var(--black); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .back-button {
    width: 40px; height: 40px; padding: 0; background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .back-button svg { width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: var(--gold); font-size: 18px; font-weight: 700; }

  .content { padding: 16px; max-width: 560px; margin: 0 auto; }
  .hint { font-size: 11px; color: var(--subtext); margin: 0 0 14px; line-height: 1.45; }
  .shop-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 2px solid var(--border);
    padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .avatar {
    width: 48px; height: 48px; background: var(--black); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; flex-shrink: 0;
  }
  .shop-meta { flex: 1; min-width: 0; }
  .shop-name { font-size: 13px; font-weight: 800; text-transform: uppercase; }
  .shop-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
  .mini-follow {
    background: var(--card); border: 2px solid var(--text); color: var(--text);
    padding: 10px 12px; font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; flex-shrink: 0;
  }
  .mini-follow.off { background: var(--black); color: var(--gold); border-color: var(--black); }
  .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
  .empty-text { color: var(--subtext); font-size: 13px; margin-bottom: 8px; }
  .error-text { color: var(--price-red); }
  .login-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--price-red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>
<div class="topbar">
  <button class="back-button" onclick="history.back()" data-i18n-aria="back" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-title" data-i18n="following_title">Following</div>
</div>
<div id="app"><div class="center-box"><div class="spinner"></div></div></div>
<script src="/js/lang.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const app = document.getElementById("app");
  const token = localStorage.getItem("zm_token");
  const user = JSON.parse(localStorage.getItem("zm_user") || "null");

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  function newListingsLabel(count) {
    const n = Number(count) || 0;
    if (n <= 0) return t("following_no_new");
    if (n === 1) return t("following_one_new");
    return t("following_new_count", { count: n });
  }

  async function setFollowing(shopId, following) {
    const method = following ? "POST" : "DELETE";
    const res = await fetch(`${API_URL}/follows/${shopId}`, { method, headers: authHeaders() });
    if (!res.ok) throw new Error("fail");
  }

  function renderShops(shops) {
    if (!shops.length) {
      app.innerHTML = `
        <div class="content">
          <p class="hint">${t("following_hint")}</p>
          <div class="empty-text">${t("following_empty")}</div>
        </div>`;
      return;
    }
    app.innerHTML = `
      <div class="content">
        <p class="hint">${t("following_hint")}</p>
        ${shops.map((shop) => {
          const name = shop.display_name || shop.shop_name || shop.name || "";
          const initial = name.charAt(0).toUpperCase() || "?";
          return `
            <div class="shop-row" data-id="${shop.id}">
              <div class="avatar">${initial}</div>
              <div class="shop-meta">
                <div class="shop-name">${name}</div>
                <div class="shop-sub">${newListingsLabel(shop.new_listings)}</div>
              </div>
              <button class="mini-follow" data-id="${shop.id}" type="button">${t("following_btn")}</button>
            </div>`;
        }).join("")}
      </div>`;

    app.querySelectorAll(".shop-row").forEach((row) => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".mini-follow")) return;
        window.location.href = `/seller-profile.html?id=${row.dataset.id}`;
      });
    });
    app.querySelectorAll(".mini-follow").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const shopId = btn.dataset.id;
        const currentlyFollowing = !btn.classList.contains("off");
        btn.disabled = true;
        try {
          await setFollowing(shopId, !currentlyFollowing);
          btn.classList.toggle("off", currentlyFollowing);
          btn.textContent = currentlyFollowing ? t("follow_shop") : t("following_btn");
        } catch (err) {
          alert(t("follow_fail"));
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  async function loadFollowing() {
    if (!user || !token) {
      app.innerHTML = `
        <div class="center-box">
          <div class="empty-text">${t("following_login")}</div>
          <button class="login-btn" onclick="location.href=zmLoginUrl('/following.html')">${t("login")}</button>
        </div>`;
      return;
    }
    try {
      const res = await fetch(`${API_URL}/follows`, { headers: authHeaders() });
      if (res.status === 401) {
        location.href = zmLoginUrl("/following.html");
        return;
      }
      if (!res.ok) throw new Error("fail");
      const shops = await res.json();
      renderShops(Array.isArray(shops) ? shops : []);
    } catch (e) {
      app.innerHTML = `<div class="center-box"><div class="error-text">${t("following_load_fail")}</div></div>`;
    }
  }

  loadFollowing();
</script>
</body>
</html>
