<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --border: #E2E0DC;
    --text: #1A1A1A;
    --subtext: #6B6B66;
    --black: #111111;
    --gold: #F5C518;
    --price-red: #A3131C;
    --red-btn: #E01B27;
    --orange: #FF7A1A;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overscroll-behavior-y: contain; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior-y: contain;
    transition: background 0.2s, color 0.2s;
  }
  .topbar {
    background: var(--black);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
  .topbar-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  .gear { text-align: center; background: none; border: none; cursor: pointer; }
  .gear .icon { font-size: 26px; color: var(--gold); }
  .gear .label { color: #C9BFAF; font-size: 9px; margin-top: 2px; }
  .brand { color: var(--gold); font-size: 20px; font-weight: 700; }
  .brand-tagline { color: #C9BFAF; font-size: 10px; font-weight: 500; margin-top: 2px; line-height: 1.3; }
  .auth-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1.5px solid rgba(245, 197, 24, 0.7);
    background: rgba(245, 197, 24, 0.1);
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    white-space: nowrap;
    max-width: 148px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .auth-btn svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
  }
  .auth-btn.logged-in {
    border-color: rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
  }
  .auth-btn.guest {
    padding: 0 12px;
  }
  .icon-row { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; position: relative; font-size: 18px;
  }
  .map-loc-needed {
    display: none;
    text-align: center;
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
    background: var(--card);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .map-loc-needed.is-visible { display: block; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: #E01B27; border-radius: 8px; min-width: 16px; height: 16px;
    color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }
  .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .toggle-tab {
    background: var(--black); display: flex; align-items: center; justify-content: center;
    padding: 4px 0 7px; cursor: pointer;
  }
  .collapsible-filters { overflow: hidden; transition: max-height 0.25s ease; }
  .search-row { padding: 12px; background: var(--bg); }
  .search-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; font-size: 14px; color: var(--text);
  }
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
  }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  .sort-chip { padding: 6px 12px; font-size: 11px; }
  .sort-chip.active { background: var(--black); border-color: var(--black); color: var(--gold); font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; padding-bottom: 40px; }
  .load-more-wrap { padding: 0 12px 80px; text-align: center; }
  .load-more-btn {
    background: var(--black); color: var(--gold); border: none;
    padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .load-more-btn:disabled { opacity: 0.6; cursor: wait; }
  .verified-chip {
    display: inline-block; background: #1B7A4A; color: #fff;
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; margin-top: 4px;
  }
  .top-sellers-wrap { padding: 10px 0 4px; border-bottom: 1px solid var(--border); }
  .top-sellers-head { padding: 0 12px 8px; }
  .top-sellers-title { font-size: 15px; font-weight: 700; }
  .top-sellers-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
  .top-sellers-row {
    display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .top-sellers-row::-webkit-scrollbar { display: none; }
  .top-seller-card {
    flex-shrink: 0; width: 118px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer;
  }
  .top-seller-avatar {
    width: 40px; height: 40px; border-radius: 20px; background: #E01B27; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; margin: 0 auto 8px;
  }
  .top-seller-name { font-size: 12px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
  .top-seller-rating { font-size: 11px; color: var(--price-red); font-weight: 600; }
  .card {
    width: calc(50% - 5px);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer;
  }
  .thumb {
    height: 170px; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .fav-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 16px;
    background: rgba(17, 17, 17, 0.65); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; padding: 0;
  }
  .fav-btn svg {
    width: 16px; height: 16px; stroke: #fff; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .fav-btn svg.filled { fill: var(--red-btn); stroke: var(--red-btn); }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .card-info { padding: 10px; }
  .price { font-weight: 700; font-size: 14px; color: var(--price-red); }
  .title { font-size: 12px; color: var(--text); margin: 3px 0; }
  .loc { font-size: 10.5px; color: var(--subtext); }
  .loc-dist { color: var(--orange); font-weight: 700; }
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; color: var(--subtext);
  }
  .empty-btn { background: var(--black); color: var(--gold); border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .error { color: var(--price-red); }
</style>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Furniture', 'Produce', 'Cars', 'Land'];
  const SORT_OPTIONS = ['Newest', 'Nearest', 'Price: Low-High', 'Price: High-Low'];
  const PAGE_SIZE = 20;
  const FEED_CACHE_KEY = "zm_feed_cache_v1";
  const FEED_CACHE_MAX_AGE_MS = 5 * 60 * 1000;

  function showCachedFeedIfFresh() {
    try {
      const raw = sessionStorage.getItem(FEED_CACHE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.items) || !parsed.items.length) return false;
      if (Date.now() - parsed.ts > FEED_CACHE_MAX_AGE_MS) return false;
      listings = parsed.items;
      serverOffset = parsed.items.length;
      hasMore = parsed.hasMore !== false;
      applyListingDistances();
      renderFeed();
      return true;
    } catch {
      return false;
    }
  }

  function saveFeedCache() {
    try {
      sessionStorage.setItem(FEED_CACHE_KEY, JSON.stringify({
        ts: Date.now(),
        items: listings.slice(0, PAGE_SIZE),
        hasMore,
      }));
    } catch { /* ignore */ }
  }

  let activeCategory = "All";
  let sortBy = "Newest";
  let listings = [];
  let serverOffset = 0;
  let hasMore = true;
  let loadingMore = false;
  let favoriteIds = new Set();
  let myCoords = readSavedCoords("zm_home_location");
  if (myCoords) sortBy = "Nearest";

  const feed = document.getElementById("feed");
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const sortRow = document.getElementById("sortRow");
  const categoryRow = document.getElementById("categoryRow");

  const filtersPanel = document.getElementById("collapsibleFilters");
  const filtersToggle = document.getElementById("filtersToggle");
  const toggleChevron = document.getElementById("toggleChevron");
  let filtersExpanded = true;
  filtersToggle.addEventListener("click", () => {
    if (filtersExpanded) {
      filtersPanel.style.maxHeight = filtersPanel.scrollHeight + "px";
      requestAnimationFrame(() => { filtersPanel.style.maxHeight = "0px"; });
      toggleChevron.style.transform = "rotate(-90deg)";
    } else {
      filtersPanel.style.maxHeight = filtersPanel.scrollHeight + "px";
      filtersPanel.addEventListener("transitionend", function clear() {
        filtersPanel.style.maxHeight = "none";
        filtersPanel.removeEventListener("transitionend", clear);
      });
      toggleChevron.style.transform = "rotate(0deg)";
    }
    filtersExpanded = !filtersExpanded;
  });
  const searchInput = document.getElementById("searchInput");
  const authBtn = document.getElementById("authBtn");
  const authBtnText = document.getElementById("authBtnText");
  const urlSearchQuery = new URLSearchParams(window.location.search).get("q");
  if (urlSearchQuery) searchInput.value = urlSearchQuery;

  function showMapLocationNeeded() {
    const el = document.getElementById("mapLocNeeded");
    if (!el) return;
    el.textContent = t("map_needs_location");
    el.classList.add("is-visible");
  }

  if (new URLSearchParams(window.location.search).get("needslocation") === "1") {
    showMapLocationNeeded();
    const clean = new URL(window.location.href);
    clean.searchParams.delete("needslocation");
    history.replaceState({}, "", clean.pathname + clean.search + clean.hash);
  }

  let mapOpenInFlight = false;
  document.getElementById("mapNavBtn")?.addEventListener("click", async () => {
    if (mapOpenInFlight) return;
    mapOpenInFlight = true;
    try {
      const coords = await requestUserLocationCoords();
      sessionStorage.setItem("zm_map_coords", JSON.stringify(coords));
      window.location.href = "/map-view.html";
    } catch {
      showMapLocationNeeded();
    } finally {
      mapOpenInFlight = false;
    }
  });

  function loadMyCoords() {
    myCoords = readSavedCoords("zm_home_location");
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = ((lat2 - lat1) * Math.PI) / 180;
    const dLon = ((lon2 - lon1) * Math.PI) / 180;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos((lat1 * Math.PI) / 180) *
        Math.cos((lat2 * Math.PI) / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function renderChips() {
    sortRow.innerHTML = SORT_OPTIONS.map(o =>
      `<div class="chip sort-chip ${sortBy === o ? "active" : ""}" data-sort="${o}">${tSort(o)}</div>`
    ).join("");
    categoryRow.innerHTML = CATEGORIES.map(c =>
      `<div class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${tCat(c)}</div>`
    ).join("");

    sortRow.querySelectorAll("[data-sort]").forEach(el =>
      el.addEventListener("click", () => { sortBy = el.dataset.sort; renderChips(); renderFeed(); })
    );
    categoryRow.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); renderFeed(); })
    );
  }

  function applyListingDistances() {
    if (!myCoords) {
      listings.forEach((item) => { item.distanceKm = null; });
      return;
    }
    listings.forEach((item) => {
      item.distanceKm = (item.latitude && item.longitude)
        ? getDistanceKm(myCoords.lat, myCoords.lng, parseFloat(item.latitude), parseFloat(item.longitude))
        : null;
    });
  }

  function renderFeedError() {
    feed.className = "error";
    feed.innerHTML = `
      <div>${t("feed_error")}</div>
      <button type="button" class="empty-btn" id="feedRetryBtn">${t("gate_try_again")}</button>`;
    document.getElementById("feedRetryBtn")?.addEventListener("click", () => loadListings(true));
    updateLoadMoreButton();
  }

  async function loadListings(reset = true) {
    if (loadingMore) return;
    if (reset) {
      serverOffset = 0;
      hasMore = true;
      if (feed.className !== "grid") {
        feed.className = "loading";
        feed.textContent = t("loading_listings");
      }
      loadMoreWrap.style.display = "none";
    } else {
      loadingMore = true;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = t("loading");
    }
    try {
      const res = await fetch(`${API_URL}/listings?limit=${PAGE_SIZE}&offset=${serverOffset}`);
      if (!res.ok) throw new Error("Server error " + res.status);
      const batch = await res.json();
      listings = reset ? batch : listings.concat(batch);
      serverOffset += batch.length;
      hasMore = batch.length === PAGE_SIZE;
      applyListingDistances();
      renderFeed();
      if (reset) saveFeedCache();
    } catch (e) {
      if (reset) renderFeedError();
      console.error(e);
    } finally {
      loadingMore = false;
      if (loadMoreBtn) {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = t("load_more");
      }
    }
  }

  function updateLoadMoreButton() {
    if (!hasMore || feed.classList.contains("empty") || feed.classList.contains("error") || feed.classList.contains("loading")) {
      loadMoreWrap.style.display = "none";
      return;
    }
    loadMoreWrap.style.display = "block";
  }

  function renderFeed() {
    let items = listings.filter(item => activeCategory === "All" || item.category === activeCategory);

    const q = searchInput.value.trim().toLowerCase();
    if (q) {
      items = items.filter(item =>
        item.title?.toLowerCase().includes(q) ||
        item.description?.toLowerCase().includes(q)
      );
    }

    const isBoosted = (item) => item.boosted_until && new Date(item.boosted_until) > new Date();

    if (sortBy === "Nearest" && myCoords) {
      items.sort((a, b) => {
        if (isBoosted(a) !== isBoosted(b)) return isBoosted(a) ? -1 : 1;
        if (a.distanceKm == null) return 1;
        if (b.distanceKm == null) return -1;
        return a.distanceKm - b.distanceKm;
      });
    } else if (sortBy === "Price: Low-High") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(a.price) - parseFloat(b.price));
    } else if (sortBy === "Price: High-Low") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(b.price) - parseFloat(a.price));
    } else {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : new Date(b.date_posted) - new Date(a.date_posted));
    }

    if (!items.length) {
      feed.className = "empty";
      feed.innerHTML = `
        <div>${t("feed_empty")}</div>
        <button type="button" class="empty-btn" id="emptyPostBtn">${t("post_listing")}</button>`;
      document.getElementById("emptyPostBtn")?.addEventListener("click", () => {
        if (!zmRequireLogin("/post-listing.html")) return;
        window.location.href = "/post-listing.html";
      });
      updateLoadMoreButton();
      return;
    }

    feed.className = "grid";
    feed.innerHTML = items.map(renderCard).join("");

    items.forEach(item => {
      const card = document.getElementById(`card-${item.id}`);
      if (card) card.addEventListener("click", () => {
        if (typeof zmPrefetchListing === "function") zmPrefetchListing(item.id, item);
        if (typeof zmShowNavLoading === "function") zmShowNavLoading();
        window.location.href = `/listing.html?id=${item.id}`;
      });
    });
    feed.querySelectorAll(".fav-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        toggleFavorite(btn.dataset.id, btn);
      });
    });
    observeLazyImages(feed);
    updateLoadMoreButton();
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function heartIcon(filled) {
    const cls = filled ? "filled" : "";
    return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  }

  async function loadFavoriteIds() {
    favoriteIds = new Set();
    if (!isLoggedIn()) return;
    try {
      const token = localStorage.getItem("zm_token");
      const res = await fetch(`${API_URL}/favorites`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) return;
      const favorites = await res.json();
      favoriteIds = new Set(favorites.map((item) => String(item.id)));
    } catch (e) {}
  }

  async function toggleFavorite(listingId, btn) {
    if (!zmRequireLogin()) return;
    const id = String(listingId);
    const token = localStorage.getItem("zm_token");
    const wasFav = favoriteIds.has(id);
    try {
      const res = await fetch(`${API_URL}/favorites/${listingId}`, {
        method: wasFav ? "DELETE" : "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      if (!res.ok) return;
      if (wasFav) favoriteIds.delete(id);
      else favoriteIds.add(id);
      const saved = favoriteIds.has(id);
      btn.innerHTML = heartIcon(saved);
      btn.setAttribute("aria-pressed", saved ? "true" : "false");
      btn.setAttribute("aria-label", saved ? t("saved_listing") : t("save_listing"));
    } catch (e) {}
  }

  function renderCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    const isFav = favoriteIds.has(String(item.id));
    const distancePart = (item.distanceKm != null)
      ? `<span class="loc-dist">${escHtml(formatDistanceKm(item.distanceKm))}</span> · `
      : "";
    return `
      <div class="card" id="card-${item.id}">
        <div class="thumb">
          ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(40)}
          <button type="button" class="fav-btn" data-id="${item.id}" aria-label="${isFav ? t("saved_listing") : t("save_listing")}" aria-pressed="${isFav ? "true" : "false"}">${heartIcon(isFav)}</button>
        </div>
        <div class="card-info">
          <div class="price">K${escHtml(item.price)}</div>
          <div class="title">${escHtml(item.title)}</div>
          <div class="loc">${distancePart}${escHtml(item.location_label || "")}</div>
          ${item.seller_nrc_verified ? `<div class="verified-chip">✓ ${t("seller_id_verified", "ID Verified")}</div>` : ""}
        </div>
      </div>`;
  }

  let searchRenderTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchRenderTimer);
    searchRenderTimer = setTimeout(renderFeed, 250);
  });

  initPwaInstall({ showBanner: true });

  function getAuthUser() {
    try {
      const user = JSON.parse(localStorage.getItem("zm_user") || "null");
      return user && typeof user === "object" ? user : null;
    } catch {
      return null;
    }
  }

  function isLoggedIn() {
    return !!(getAuthUser() && localStorage.getItem("zm_token"));
  }

  function refreshAuthState() {
    const user = getAuthUser();
    if (isLoggedIn()) {
      const name = user.display_name || user.name || user.shop_name || user.phone || "User";
      authBtnText.textContent = t("hi_user", { name });
      authBtn.classList.remove("guest");
      authBtn.classList.add("logged-in");
      authBtn.onclick = () => { window.location.href = "/settings.html"; };
    } else {
      authBtnText.textContent = t("login_signup");
      authBtn.classList.add("guest");
      authBtn.classList.remove("logged-in");
      authBtn.onclick = () => { window.location.href = "/login.html"; };
    }
  }

  async function loadTopSellers() {
    const wrap = document.getElementById("topSellersWrap");
    if (!wrap) return;
    try {
      const res = await fetch(`${API_URL}/reviews/leaderboard`);
      if (!res.ok) return;
      const sellers = await res.json();
      if (!Array.isArray(sellers) || sellers.length === 0) {
        wrap.style.display = "none";
        return;
      }
      wrap.style.display = "block";
      wrap.innerHTML = `
        <div class="top-sellers-wrap">
          <div class="top-sellers-head">
            <div class="top-sellers-title">${t("top_sellers_title")}</div>
            <div class="top-sellers-sub">${t("top_sellers_sub")}</div>
          </div>
          <div class="top-sellers-row">
            ${sellers.slice(0, 8).map((s) => {
              const name = s.shop_name || s.name || "Seller";
              return `
                <div class="top-seller-card" data-seller-id="${s.id}">
                  <div class="top-seller-avatar">${name.charAt(0).toUpperCase()}</div>
                  <div class="top-seller-name">${name}</div>
                  <div class="top-seller-rating">★ ${s.average} (${s.total})</div>
                </div>`;
            }).join("")}
          </div>
        </div>`;
      wrap.querySelectorAll("[data-seller-id]").forEach((el) => {
        el.addEventListener("click", () => {
          window.location.href = `/seller-profile.html?id=${el.dataset.sellerId}`;
        });
      });
    } catch (e) {
      wrap.style.display = "none";
    }
  }

  async function refreshChatUnreadBadge() {
    const badge = document.getElementById("chatUnreadBadge");
    if (!badge) return;
    if (!isLoggedIn()) {
      badge.style.display = "none";
      return;
    }
    try {
      const res = await fetch(`${API_URL}/messages/unread-count`, {
        headers: { Authorization: `Bearer ${localStorage.getItem("zm_token")}` },
      });
      if (!res.ok) return;
      const data = await res.json();
      const count = parseInt(data.count, 10) || 0;
      if (count > 0) {
        badge.textContent = count > 99 ? "99+" : String(count);
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    } catch (e) {}
  }

  function syncLoggedInServices() {
    if (!isLoggedIn()) return;
    refreshChatUnreadBadge();
    if (window.refreshNavConfirmBadge) refreshNavConfirmBadge();
    startPresenceHeartbeat();
    autoEnablePushNotifications().finally(() => {
      if (!isPushOptOut()) {
        const user = getAuthUser();
        startMessageNotificationPoll(API_URL, localStorage.getItem("zm_token"), user?.id);
      }
    });
  }

  refreshAuthState();
  renderChips();
  loadTopSellers();
  showCachedFeedIfFresh();
  loadFavoriteIds().then(() => {
    if (feed.classList.contains("grid")) renderFeed();
  });
  loadListings(true);
  setTimeout(syncLoggedInServices, 0);
  document.addEventListener("DOMContentLoaded", () => {
    refreshAuthState();
    setTimeout(syncLoggedInServices, 0);
  });
  window.addEventListener("pageshow", () => {
    refreshAuthState();
    setTimeout(syncLoggedInServices, 0);
    loadMyCoords();
    applyListingDistances();
    loadFavoriteIds().then(() => renderFeed());
  });
  window.addEventListener("langchange", () => {
    const mapLocEl = document.getElementById("mapLocNeeded");
    if (mapLocEl) mapLocEl.textContent = t("map_needs_location");
    refreshAuthState();
    renderChips();
    loadTopSellers();
    if (feed.classList.contains("empty")) {
      feed.innerHTML = `
        <div>${t("feed_empty")}</div>
        <button type="button" class="empty-btn" id="emptyPostBtn">${t("post_listing")}</button>`;
      document.getElementById("emptyPostBtn")?.addEventListener("click", () => {
        if (!zmRequireLogin("/post-listing.html")) return;
        window.location.href = "/post-listing.html";
      });
    }
    if (feed.classList.contains("error")) renderFeedError();
    if (feed.classList.contains("loading")) feed.textContent = t("loading_listings");
    if (feed.classList.contains("grid")) renderFeed();
  });
  window.addEventListener("lowdatachange", () => renderFeed());

</script>
</body>
