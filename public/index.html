<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/js/app-touch.js"></script>
<title>ZedMarket</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="https://www.zedmarket.app/icon-192.png" />
<link rel="apple-touch-icon" href="https://www.zedmarket.app/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZedMarket" />
<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --border: #E2E0DC;
    --text: #1A1A1A;
    --subtext: #6B6B66;
    --black: #111111;
    --gold: #F5C518;
    --price-red: #A3131C;
    --orange: #FF7A1A;
  }
  body.dark {
    --bg: #121212; --card: #1E1E1E; --border: #333333;
    --text: #F0EDE8; --subtext: #A8A29B; --black: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overscroll-behavior-y: contain; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior-y: contain;
    transition: background 0.2s, color 0.2s;
  }
  .topbar {
    background: var(--black);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .gear { text-align: center; background: none; border: none; cursor: pointer; }
  .gear .icon { font-size: 26px; color: var(--gold); }
  .gear .label { color: #C9BFAF; font-size: 9px; margin-top: 2px; }
  .brand { color: var(--gold); font-size: 20px; font-weight: 700; }
  .auth-line {
    color: var(--black);
    font-size: 12px;
    font-weight: 700;
    margin-top: 6px;
    background: var(--gold);
    border: none;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 14px;
    display: inline-block;
  }
  .icon-row { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; position: relative; font-size: 18px;
  }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: #E01B27; border-radius: 8px; min-width: 16px; height: 16px;
    color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }
  .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .toggle-tab {
    background: var(--black); display: flex; align-items: center; justify-content: center;
    padding: 4px 0 7px; cursor: pointer;
  }
  .collapsible-filters { overflow: hidden; transition: max-height 0.25s ease; }
  .search-row { padding: 12px; background: var(--bg); }
  .search-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; font-size: 14px; color: var(--text);
  }
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
  }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  .sort-chip { padding: 6px 12px; font-size: 11px; }
  .sort-chip.active { background: var(--black); border-color: var(--black); color: var(--gold); font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; padding-bottom: 40px; }
  .card {
    width: calc(50% - 5px);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer;
  }
  .thumb {
    height: 170px; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-ph { color: var(--subtext); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .photo-ph circle { fill: currentColor; stroke: none; }
  .card-info { padding: 10px; }
  .price { font-weight: 700; font-size: 14px; color: var(--price-red); }
  .title { font-size: 12px; color: var(--text); margin: 3px 0; }
  .loc { font-size: 10.5px; color: var(--subtext); }
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; color: var(--subtext);
  }
  .error { color: var(--price-red); }

  .loc-row { display: flex; gap: 8px; padding: 0 12px 10px; }
  .loc-chip { flex: 1; text-align: center; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1; text-align: center; text-decoration: none; color: var(--subtext);
    font-size: 11px; padding: 4px 0;
  }
  .nav-item.active { color: var(--orange); font-weight: 700; }
  .nav-icon { display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
  .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body { padding-bottom: 60px; }
</style>
</head>
<body>
<script>
  function applyDarkMode() {
    document.body.classList.toggle("dark", localStorage.getItem("zm_dark_mode") === "true");
  }
  applyDarkMode();
  window.addEventListener("pageshow", applyDarkMode);
</script>

<div class="sticky-header">
  <div class="topbar">
    <div class="topbar-left">
      <button class="gear" onclick="window.location.href='/settings.html'">
        <div class="icon">☰</div>
        <div class="label" data-i18n="settings">Settings</div>
      </button>
      <div>
        <div class="brand">ZedMarket</div>
        <button class="auth-line" id="authBtn">Login / Sign Up</button>
      </div>
    </div>
    <div class="icon-row">
      <button class="icon-btn" onclick="window.location.href='/wanted.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button>
      <button class="icon-btn" onclick="window.location.href='/map-view.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5v17l-5 2v-17z"/><path d="M9 3.5l6 2v17l-6-2z"/><path d="M15 5.5l5-2v17l-5 2z"/></svg></button>
      <button class="icon-btn" onclick="window.location.href='/chat-list.html'" aria-label="Chats"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="icon-btn" onclick="window.location.href='/favorites.html'" aria-label="Favorites"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
    </div>
  </div>

  <div class="toggle-tab" id="filtersToggle">
    <svg id="toggleChevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.25s ease;"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="collapsible-filters" id="collapsibleFilters">
  <div class="search-row">
    <input class="search-input" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="Search listings..." />
  </div>

  <div style="padding: 0 12px 12px;">
    <button id="installBtn" style="display:block; width:100%; background: var(--black); color: var(--gold); border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 14px; cursor: pointer;" data-i18n="install_app">
      Install App
    </button>
  </div>

  <div class="loc-row" id="locRow">
    <div class="chip loc-chip active" id="locHome"><span data-i18n="loc_home">Home area</span></div>
    <div class="chip loc-chip" id="locCurrent"><span data-i18n="loc_current">Use current location</span></div>
  </div>

  <div class="chips-row" id="sortRow"></div>
  <div class="chips-row" id="categoryRow" style="padding-bottom: 12px;"></div>
  </div>
</div>

<div id="feed" class="loading" data-i18n="loading_listings">Loading listings…</div>

<div class="bottom-nav">
  <a href="/index.html" class="nav-item active"><div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg></div><div data-i18n="home">Home</div></a>
  <a href="/my-shop.html" class="nav-item"><div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div data-i18n="my_shop">My Shop</div></a>
</div>

<script src="/js/lang.js"></script>
<script src="/js/data-saver.js"></script>
<script src="/js/pwa-install.js"></script>
<script src="/js/presence.js"></script>
<script src="/js/push-notifications.js"></script>
<script src="/js/voice-call.js"></script>
<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Furniture', 'Produce', 'Cars', 'Land'];
  const SORT_OPTIONS = ['Newest', 'Nearest', 'Price: Low-High', 'Price: High-Low'];
  const PAGE_SIZE = 20;

  let activeCategory = "All";
  let sortBy = "Nearest";
  let listings = [];
  let myCoords = null;

  const feed = document.getElementById("feed");
  const sortRow = document.getElementById("sortRow");
  const categoryRow = document.getElementById("categoryRow");

  const filtersPanel = document.getElementById("collapsibleFilters");
  const filtersToggle = document.getElementById("filtersToggle");
  const toggleChevron = document.getElementById("toggleChevron");
  let filtersExpanded = true;
  filtersToggle.addEventListener("click", () => {
    if (filtersExpanded) {
      filtersPanel.style.maxHeight = filtersPanel.scrollHeight + "px";
      requestAnimationFrame(() => { filtersPanel.style.maxHeight = "0px"; });
      toggleChevron.style.transform = "rotate(-90deg)";
    } else {
      filtersPanel.style.maxHeight = filtersPanel.scrollHeight + "px";
      filtersPanel.addEventListener("transitionend", function clear() {
        filtersPanel.style.maxHeight = "none";
        filtersPanel.removeEventListener("transitionend", clear);
      });
      toggleChevron.style.transform = "rotate(0deg)";
    }
    filtersExpanded = !filtersExpanded;
  });
  const searchInput = document.getElementById("searchInput");
  const authBtn = document.getElementById("authBtn");

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = ((lat2 - lat1) * Math.PI) / 180;
    const dLon = ((lon2 - lon1) * Math.PI) / 180;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos((lat1 * Math.PI) / 180) *
        Math.cos((lat2 * Math.PI) / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function renderChips() {
    sortRow.innerHTML = SORT_OPTIONS.map(o =>
      `<div class="chip sort-chip ${sortBy === o ? "active" : ""}" data-sort="${o}">${tSort(o)}</div>`
    ).join("");
    categoryRow.innerHTML = CATEGORIES.map(c =>
      `<div class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${tCat(c)}</div>`
    ).join("");

    sortRow.querySelectorAll("[data-sort]").forEach(el =>
      el.addEventListener("click", () => { sortBy = el.dataset.sort; renderChips(); renderFeed(); })
    );
    categoryRow.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); renderFeed(); })
    );
  }

  async function loadListings() {
    try {
      const res = await fetch(`${API_URL}/listings?limit=${PAGE_SIZE}&offset=0`);
      if (!res.ok) throw new Error("Server error " + res.status);
      listings = await res.json();
      renderFeed();
    } catch (e) {
      feed.className = "error";
      feed.textContent = t("feed_error");
      console.error(e);
    }
  }

  function renderFeed() {
    let items = listings.filter(item => activeCategory === "All" || item.category === activeCategory);

    const q = searchInput.value.trim().toLowerCase();
    if (q) {
      items = items.filter(item =>
        item.title?.toLowerCase().includes(q) ||
        item.description?.toLowerCase().includes(q)
      );
    }

    if (myCoords) {
      items = items.map(item => ({
        ...item,
        distanceKm: (item.latitude && item.longitude)
          ? getDistanceKm(myCoords.lat, myCoords.lng, parseFloat(item.latitude), parseFloat(item.longitude))
          : null
      }));
    }

    const isBoosted = (item) => item.boosted_until && new Date(item.boosted_until) > new Date();

    if (sortBy === "Nearest" && myCoords) {
      items.sort((a, b) => {
        if (isBoosted(a) !== isBoosted(b)) return isBoosted(a) ? -1 : 1;
        if (a.distanceKm == null) return 1;
        if (b.distanceKm == null) return -1;
        return a.distanceKm - b.distanceKm;
      });
    } else if (sortBy === "Price: Low-High") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(a.price) - parseFloat(b.price));
    } else if (sortBy === "Price: High-Low") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(b.price) - parseFloat(a.price));
    } else {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : new Date(b.date_posted) - new Date(a.date_posted));
    }

    if (!items.length) {
      feed.className = "empty";
      feed.textContent = t("feed_empty");
      return;
    }

    feed.className = "grid";
    feed.innerHTML = items.map(renderCard).join("");

    items.forEach(item => {
      const card = document.getElementById(`card-${item.id}`);
      if (card) card.addEventListener("click", () => window.location.href = `/listing.html?id=${item.id}`);
    });
    observeLazyImages(feed);
  }

  function photoPlaceholder(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="photo-ph"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function renderCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    const distancePart = (item.distanceKm != null) ? `${item.distanceKm.toFixed(1)} km · ` : "";
    return `
      <div class="card" id="card-${item.id}">
        <div class="thumb">
          ${img ? zmImg(img, { alt: item.title, preset: "card", defer: true }) : photoPlaceholder(40)}
        </div>
        <div class="card-info">
          <div class="price">K${item.price}</div>
          <div class="title">${item.title}</div>
          <div class="loc">📍 ${distancePart}${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  searchInput.addEventListener("input", renderFeed);

  function loadHomeLocation() {
    const saved = localStorage.getItem("zm_home_location");
    if (saved) {
      myCoords = JSON.parse(saved);
      renderFeed();
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          localStorage.setItem("zm_home_location", JSON.stringify(myCoords));
          renderFeed();
        },
        () => {}
      );
    }
  }

  document.getElementById("locHome").addEventListener("click", () => {
    document.getElementById("locHome").classList.add("active");
    document.getElementById("locCurrent").classList.remove("active");
    loadHomeLocation();
  });
  document.getElementById("locCurrent").addEventListener("click", () => {
    document.getElementById("locCurrent").classList.add("active");
    document.getElementById("locHome").classList.remove("active");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          renderFeed();
        },
        () => {}
      );
    }
  });

  initPwaInstall({ buttonIds: ["installBtn"], showBanner: true });

  function getAuthUser() {
    try {
      const user = JSON.parse(localStorage.getItem("zm_user") || "null");
      return user && typeof user === "object" ? user : null;
    } catch {
      return null;
    }
  }

  function isLoggedIn() {
    return !!(getAuthUser() && localStorage.getItem("zm_token"));
  }

  function refreshAuthState() {
    const user = getAuthUser();
    if (isLoggedIn()) {
      const name = user.display_name || user.name || user.shop_name || user.phone || "User";
      authBtn.textContent = t("hi_user", { name });
      authBtn.onclick = () => { window.location.href = "/settings.html"; };
    } else {
      authBtn.textContent = t("login_signup");
      authBtn.onclick = () => { window.location.href = "/login.html"; };
    }
  }

  function syncLoggedInServices() {
    if (!isLoggedIn()) return;
    startPresenceHeartbeat();
    syncPushSubscription();
    initIncomingCallListener();
  }

  refreshAuthState();
  syncLoggedInServices();
  document.addEventListener("DOMContentLoaded", () => {
    refreshAuthState();
    syncLoggedInServices();
  });
  window.addEventListener("pageshow", () => {
    refreshAuthState();
    syncLoggedInServices();
  });
  window.addEventListener("langchange", () => {
    refreshAuthState();
    renderChips();
    if (feed.classList.contains("empty")) feed.textContent = t("feed_empty");
    if (feed.classList.contains("error")) feed.textContent = t("feed_error");
    if (feed.classList.contains("loading")) feed.textContent = t("loading_listings");
  });
  window.addEventListener("lowdatachange", () => renderFeed());

  renderChips();
  loadListings();
  loadHomeLocation();
</script>
</body>
</html>
