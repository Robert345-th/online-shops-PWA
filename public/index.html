<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedMarket</title>
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --border: #E2E0DC;
    --text: #1A1A1A;
    --subtext: #6B6B66;
    --black: #111111;
    --gold: #F5C518;
    --price-red: #A3131C;
    --orange: #FF7A1A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    background: var(--black);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .gear { text-align: center; background: none; border: none; cursor: pointer; }
  .gear .icon { font-size: 26px; }
  .gear .label { color: #C9BFAF; font-size: 9px; margin-top: 2px; }
  .brand { color: var(--gold); font-size: 20px; font-weight: 700; }
  .auth-line { color: var(--gold); font-size: 12px; margin-top: 4px; background: none; border: none; cursor: pointer; }
  .icon-row { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 18px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; position: relative; font-size: 18px;
  }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: #E01B27; border-radius: 8px; min-width: 16px; height: 16px;
    color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }
  .search-row { padding: 12px; }
  .search-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; font-size: 14px; color: var(--text);
  }
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
  }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  .sort-chip { padding: 6px 12px; font-size: 11px; }
  .sort-chip.active { background: var(--black); border-color: var(--black); color: var(--gold); font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; padding-bottom: 40px; }
  .card {
    width: calc(50% - 5px);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer;
  }
  .thumb {
    height: 170px; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-info { padding: 10px; }
  .price { font-weight: 700; font-size: 14px; color: var(--price-red); }
  .title { font-size: 12px; color: var(--text); margin: 3px 0; }
  .loc { font-size: 10.5px; color: var(--subtext); }
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; color: var(--subtext);
  }
  .error { color: var(--price-red); }

  .loc-row { display: flex; gap: 8px; padding: 0 12px 10px; }
  .loc-chip { flex: 1; text-align: center; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid var(--border);
    display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1; text-align: center; text-decoration: none; color: var(--subtext);
    font-size: 11px; padding: 4px 0;
  }
  .nav-item.active { color: var(--orange); font-weight: 700; }
  .nav-icon { font-size: 20px; margin-bottom: 2px; }
  body { padding-bottom: 60px; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 28px 24px 32px; position: relative;
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 16px; }
  .modal input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #fff;
  }
  .primary-btn {
    width: 100%; background: var(--black); color: var(--gold); border: none;
    padding: 13px; border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 6px;
  }
  .switch-link { text-align: center; margin-top: 14px; font-size: 0.85rem; color: var(--subtext); }
  .switch-link a { color: var(--orange); font-weight: 600; text-decoration: none; }
  .close-x {
    position: absolute; top: 14px; right: 18px; background: none; border: none;
    font-size: 1.3rem; color: var(--subtext); cursor: pointer;
  }
  .modal-msg { font-size: 0.8rem; margin-bottom: 10px; }
  .modal-msg.err { color: var(--price-red); }
  .modal-msg.ok { color: #1F4B3F; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="gear">
      <div class="icon">⚙️</div>
      <div class="label">Settings</div>
    </button>
    <div>
      <div class="brand">ZedMarket</div>
      <button class="auth-line" id="authBtn">Login / Sign Up</button>
    </div>
  </div>
  <div class="icon-row">
    <button class="icon-btn">🔍</button>
    <button class="icon-btn">🗺️</button>
    <button class="icon-btn">💬</button>
    <button class="icon-btn">❤️</button>
  </div>
</div>

<div class="search-row">
  <input class="search-input" id="searchInput" placeholder="🔍 Search listings..." />
</div>

<div class="loc-row" id="locRow">
  <div class="chip loc-chip active" id="locHome">📍 Home</div>
  <div class="chip loc-chip" id="locCurrent">🎯 Use current location</div>
</div>

<div class="chips-row" id="sortRow"></div>
<div class="chips-row" id="categoryRow"></div>

<div id="feed" class="loading">Loading listings…</div>

<div class="bottom-nav">
  <a href="/index.html" class="nav-item active"><div class="nav-icon">🏠</div><div>Home</div></a>
  <a href="/explore.html" class="nav-item"><div class="nav-icon">🌐</div><div>Explore</div></a>
  <a href="/my-shop.html" class="nav-item"><div class="nav-icon">🛍️</div><div>My Shop</div></a>
</div>

<div class="modal-backdrop" id="authModal">
  <div class="modal">
    <button class="close-x" id="closeModal">×</button>
    <h2 id="modalTitle">Sign in</h2>
    <div id="modalMsg"></div>
    <div id="signupOnlyFields" style="display:none;">
      <input type="text" id="fullName" placeholder="Full name" />
    </div>
    <input type="text" id="phone" placeholder="Phone number (e.g. 0977123456)" />
    <input type="password" id="password" placeholder="Password" />
    <div id="confirmPasswordWrap" style="display:none;">
      <input type="password" id="confirmPassword" placeholder="Confirm password" />
    </div>
    <button class="primary-btn" id="submitAuth">Sign in</button>
    <div class="switch-link">
      <span id="switchText">New to ZedMarket? <a id="switchLink">Create an account</a></span>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Furniture', 'Produce', 'Cars', 'Land'];
  const SORT_OPTIONS = ['Newest', 'Nearest', 'Price: Low-High', 'Price: High-Low'];
  const PAGE_SIZE = 20;

  let mode = "login";
  let activeCategory = "All";
  let sortBy = "Newest";
  let listings = [];

  const feed = document.getElementById("feed");
  const sortRow = document.getElementById("sortRow");
  const categoryRow = document.getElementById("categoryRow");
  const searchInput = document.getElementById("searchInput");
  const authModal = document.getElementById("authModal");
  const authBtn = document.getElementById("authBtn");
  const closeModal = document.getElementById("closeModal");
  const submitAuth = document.getElementById("submitAuth");
  const switchLink = document.getElementById("switchLink");
  const switchText = document.getElementById("switchText");
  const modalTitle = document.getElementById("modalTitle");
  const modalMsg = document.getElementById("modalMsg");
  const signupOnlyFields = document.getElementById("signupOnlyFields");

  function renderChips() {
    sortRow.innerHTML = SORT_OPTIONS.map(o =>
      `<div class="chip sort-chip ${sortBy === o ? "active" : ""}" data-sort="${o}">${o}</div>`
    ).join("");
    categoryRow.innerHTML = CATEGORIES.map(c =>
      `<div class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${c}</div>`
    ).join("");

    sortRow.querySelectorAll("[data-sort]").forEach(el =>
      el.addEventListener("click", () => { sortBy = el.dataset.sort; renderChips(); renderFeed(); })
    );
    categoryRow.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); renderFeed(); })
    );
  }

  async function loadListings() {
    try {
      const res = await fetch(`${API_URL}/listings?limit=${PAGE_SIZE}&offset=0`);
      if (!res.ok) throw new Error("Server error " + res.status);
      listings = await res.json();
      renderFeed();
    } catch (e) {
      feed.className = "error";
      feed.textContent = "Couldn't reach the market right now. Pull to refresh in a bit.";
      console.error(e);
    }
  }

  function renderFeed() {
    let items = listings.filter(item => activeCategory === "All" || item.category === activeCategory);

    const q = searchInput.value.trim().toLowerCase();
    if (q) {
      items = items.filter(item =>
        item.title?.toLowerCase().includes(q) ||
        item.description?.toLowerCase().includes(q)
      );
    }

    const isBoosted = (item) => item.boosted_until && new Date(item.boosted_until) > new Date();

    if (sortBy === "Price: Low-High") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(a.price) - parseFloat(b.price));
    } else if (sortBy === "Price: High-Low") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(b.price) - parseFloat(a.price));
    } else {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : new Date(b.date_posted) - new Date(a.date_posted));
    }

    if (!items.length) {
      feed.className = "empty";
      feed.textContent = "No listings match right now — be the first to post something.";
      return;
    }

    feed.className = "grid";
    feed.innerHTML = items.map(renderCard).join("");
  }

  function renderCard(item) {
    const img = item.photos && item.photos.length > 0 ? item.photos[0] : null;
    return `
      <div class="card">
        <div class="thumb">
          ${img ? `<img src="${img}" alt="${item.title}" loading="lazy" />` : `<span style="font-size:40px;">🏷️</span>`}
        </div>
        <div class="card-info">
          <div class="price">K${item.price}</div>
          <div class="title">${item.title}</div>
          <div class="loc">📍 ${item.location_label || ""}</div>
        </div>
      </div>`;
  }

  searchInput.addEventListener("input", renderFeed);

  document.getElementById("locHome").addEventListener("click", () => {
    document.getElementById("locHome").classList.add("active");
    document.getElementById("locCurrent").classList.remove("active");
  });
  document.getElementById("locCurrent").addEventListener("click", () => {
    document.getElementById("locCurrent").classList.add("active");
    document.getElementById("locHome").classList.remove("active");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(() => {}, () => {});
    }
  });

  authBtn.addEventListener("click", () => authModal.classList.add("open"));
  closeModal.addEventListener("click", () => authModal.classList.remove("open"));
  authModal.addEventListener("click", (e) => { if (e.target === authModal) authModal.classList.remove("open"); });

  switchLink.addEventListener("click", () => { mode = mode === "login" ? "signup" : "login"; updateModalMode(); });

  function updateModalMode() {
    modalMsg.textContent = "";
    if (mode === "login") {
      modalTitle.textContent = "Sign in";
      submitAuth.textContent = "Sign in";
      signupOnlyFields.style.display = "none";
      document.getElementById("confirmPasswordWrap").style.display = "none";
      switchText.innerHTML = `New to ZedMarket? <a id="switchLink">Create an account</a>`;
    } else {
      modalTitle.textContent = "Create account";
      submitAuth.textContent = "Create account";
      signupOnlyFields.style.display = "block";
      document.getElementById("confirmPasswordWrap").style.display = "block";
      switchText.innerHTML = `Already have an account? <a id="switchLink">Sign in</a>`;
    }
    document.getElementById("switchLink").addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      updateModalMode();
    });
  }

  submitAuth.addEventListener("click", async () => {
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const name = document.getElementById("fullName").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!phone || !password) {
      modalMsg.className = "modal-msg err";
      modalMsg.textContent = "Please fill in all fields.";
      return;
    }
    if (mode === "signup" && (!name || !confirmPassword)) {
      modalMsg.className = "modal-msg err";
      modalMsg.textContent = "Please fill in all fields.";
      return;
    }

    const endpoint = mode === "login" ? "/auth/login" : "/auth/signup";
    const body = mode === "login" ? { phone, password } : { name, phone, password, confirmPassword };

    submitAuth.disabled = true;
    modalMsg.className = "modal-msg";
    modalMsg.textContent = "Working on it…";

    try {
      const res = await fetch(`${API_URL}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || "Something went wrong");

      if (data.token) {
        localStorage.setItem("zm_token", data.token);
        localStorage.setItem("zm_user", JSON.stringify(data.user || {}));
        modalMsg.className = "modal-msg ok";
        modalMsg.textContent = "Signed in!";
        setTimeout(() => { authModal.classList.remove("open"); location.reload(); }, 700);
      } else if (mode === "signup") {
        modalMsg.className = "modal-msg ok";
        modalMsg.textContent = data.message || "Account created! Check your phone for an OTP to verify.";
      }
    } catch (e) {
      modalMsg.className = "modal-msg err";
      modalMsg.textContent = e.message;
    } finally {
      submitAuth.disabled = false;
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(console.error);
    });
  }

  const savedUser = JSON.parse(localStorage.getItem("zm_user") || "null");
  if (savedUser) {
    authBtn.textContent = `Hi, ${savedUser.name}`;
  }

  renderChips();
  loadListings();
</script>
</body>
</html>
