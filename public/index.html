  .topbar {

  }

</style>

<script>
  const API_URL = "https://online-shops-production.up.railway.app";
  const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Furniture', 'Produce', 'Cars', 'Land'];
  const SORT_OPTIONS = ['Newest', 'Nearest', 'Price: Low-High', 'Price: High-Low'];
  const PAGE_SIZE = 20;
  const FEED_CACHE_KEY = "zm_feed_cache_v1";
  const FEED_CACHE_MAX_AGE_MS = 5 * 60 * 1000;

  function readFeedCache() {
    try {
      const raw = localStorage.getItem(FEED_CACHE_KEY) || sessionStorage.getItem(FEED_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.items) || !parsed.items.length) return null;
      return parsed;
    } catch {
      return null;
    }
  }

  function applyCachedListings(parsed) {
    listings = parsed.items;
    serverOffset = parsed.items.length;
    hasMore = parsed.hasMore !== false;
    feedReady = true;
    applyListingDistances();
    renderFeed();
  }

  function showCachedFeedIfFresh() {
    const parsed = readFeedCache();
    if (!parsed) return false;
    if (Date.now() - parsed.ts > FEED_CACHE_MAX_AGE_MS) return false;
    applyCachedListings(parsed);
    return true;
  }

  function showCachedFeedAny() {
    const parsed = readFeedCache();
    if (!parsed) return false;
    applyCachedListings(parsed);
    return true;
  }

  function saveFeedCache() {
    if ((searchInput && searchInput.value.trim()) || (activeCategory && activeCategory !== "All")) return;
    const payload = JSON.stringify({
      ts: Date.now(),
      items: listings.slice(0, PAGE_SIZE),
      hasMore,
    });
    try { sessionStorage.setItem(FEED_CACHE_KEY, payload); } catch { /* ignore */ }
    try { localStorage.setItem(FEED_CACHE_KEY, payload); } catch { /* ignore */ }
  }

  let activeCategory = "All";
  let sortBy = "Newest";
  let listings = [];
  let feedReady = false;
  let serverOffset = 0;
  let hasMore = true;
  let loadingMore = false;
  let favoriteIds = new Set();
  let myCoords = readSavedCoords("zm_home_location");
  if (myCoords) sortBy = "Nearest";

  const feed = document.getElementById("feed");
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const sortRow = document.getElementById("sortRow");
  const categoryRow = document.getElementById("categoryRow");

  const searchInput = document.getElementById("searchInput");
  const authBtn = document.getElementById("authBtn");
  const authBtnText = document.getElementById("authBtnText");
  const urlSearchQuery = new URLSearchParams(window.location.search).get("q");
  if (urlSearchQuery) searchInput.value = urlSearchQuery;

  function showMapLocationNeeded(showStayForm) {
    const el = document.getElementById("mapLocNeeded");
    const msg = document.getElementById("mapLocNeededMsg");
    const stayWrap = document.getElementById("mapLocStayWrap");
    if (!el) return;
    if (msg) msg.textContent = t("map_needs_location");
    el.classList.add("is-visible");
    if (stayWrap) stayWrap.classList.toggle("is-visible", !!showStayForm);
    const err = document.getElementById("mapStayErr");
    if (err) err.classList.remove("is-visible");
    if (showStayForm) {

  function loadMyCoords() {
    myCoords = readSavedCoords("zm_home_location");
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = ((lat2 - lat1) * Math.PI) / 180;
    const dLon = ((lon2 - lon1) * Math.PI) / 180;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos((lat1 * Math.PI) / 180) *
        Math.cos((lat2 * Math.PI) / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function renderChips() {
    sortRow.innerHTML = SORT_OPTIONS.map(o =>
      `<div class="chip sort-chip ${sortBy === o ? "active" : ""}" data-sort="${o}">${tSort(o)}</div>`
    ).join("");
    categoryRow.innerHTML = CATEGORIES.map(c =>
      `<div class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${tCat(c)}</div>`
    ).join("");

    sortRow.querySelectorAll("[data-sort]").forEach(el =>
      el.addEventListener("click", () => { sortBy = el.dataset.sort; renderChips(); renderFeed(); })
    );
    categoryRow.querySelectorAll("[data-cat]").forEach(el =>
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); loadListings(true); })
    );
  }

  function applyListingDistances() {
    if (!myCoords) {
      listings.forEach((item) => { item.distanceKm = null; });
      return;
    }
    listings.forEach((item) => {
      item.distanceKm = (item.latitude && item.longitude)
        ? getDistanceKm(myCoords.lat, myCoords.lng, parseFloat(item.latitude), parseFloat(item.longitude))
        : null;
    });
  }

  function isOffline() {
    return typeof navigator !== "undefined" && navigator.onLine === false;
  }

  function isNetworkFailure(err) {
    if (isOffline()) return true;
    if (!err) return false;
    const name = err.name || "";
    const msg = String(err.message || err);
    return name === "AbortError" || name === "TypeError" || /failed to fetch|networkerror|load failed|aborted/i.test(msg);
  }

  function renderFeedError(offline) {
    const noData = offline || isOffline();
    feed.className = noData ? "offline" : "error";
    feed.innerHTML = `
      <div>${noData ? t("feed_offline") : t("feed_error")}</div>
      <button type="button" class="empty-btn" id="feedRetryBtn">${t("gate_try_again")}</button>`;
    document.getElementById("feedRetryBtn")?.addEventListener("click", () => loadListings(true));
    updateLoadMoreButton();
  }

  function fetchListingsPage(url) {
    if (typeof AbortController === "undefined") return fetch(url);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  async function loadListings(reset = true) {
    if (loadingMore) return;
    if (reset && isOffline() && !listings.length) {
      if (showCachedFeedAny()) return;
      renderFeedError(true);
      return;
    }
    const prevOffset = serverOffset;
    const prevHasMore = hasMore;
    if (reset) {
      serverOffset = 0;
      hasMore = true;
      if (feed.className !== "grid") {
        feed.className = "loading";
        feed.textContent = t("loading_listings");
      }
      loadMoreWrap.style.display = "none";
    } else {
      loadingMore = true;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = t("loading");
    }
    try {
      const params = new URLSearchParams({
        limit: String(PAGE_SIZE),
        offset: String(serverOffset),
      });
      const q = searchInput.value.trim();
      if (q) params.set("q", q);
      if (activeCategory && activeCategory !== "All") params.set("category", activeCategory);
      const res = await fetchListingsPage(`${API_URL}/listings?${params.toString()}`);
      if (!res.ok) throw new Error("Server error " + res.status);
      const batch = await res.json();
      if (!Array.isArray(batch)) throw new Error("Bad listings response");
      listings = reset ? batch : listings.concat(batch);
      serverOffset += batch.length;
      hasMore = batch.length === PAGE_SIZE;
      feedReady = true;
      applyListingDistances();
      renderFeed();
      if (reset) saveFeedCache();
    } catch (e) {
      const network = isNetworkFailure(e);
      if (reset && listings.length) {
        serverOffset = prevOffset;
        hasMore = prevHasMore;
      } else if (reset && network && showCachedFeedAny()) {
        /* keep last listings while data is off */
      } else if (reset) {
        renderFeedError(network);
      }
      console.error(e);
    } finally {
      loadingMore = false;
      if (loadMoreBtn) {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = t("load_more");
      }
    }
  }

  function updateLoadMoreButton() {
    if (!hasMore || feed.classList.contains("empty") || feed.classList.contains("error") || feed.classList.contains("offline") || feed.classList.contains("loading")) {
      loadMoreWrap.style.display = "none";
      return;
    }
    loadMoreWrap.style.display = "block";
  }

  function renderFeed() {
    let items = listings.slice();

    const isBoosted = (item) => item.boosted_until && new Date(item.boosted_until) > new Date();

    if (sortBy === "Nearest" && myCoords) {
      items.sort((a, b) => {
        if (isBoosted(a) !== isBoosted(b)) return isBoosted(a) ? -1 : 1;
        if (a.distanceKm == null) return 1;
        if (b.distanceKm == null) return -1;
        return a.distanceKm - b.distanceKm;
      });
    } else if (sortBy === "Price: Low-High") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(a.price) - parseFloat(b.price));
    } else if (sortBy === "Price: High-Low") {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : parseFloat(b.price) - parseFloat(a.price));
    } else {
      items.sort((a, b) => (isBoosted(a) !== isBoosted(b)) ? (isBoosted(a) ? -1 : 1) : new Date(b.date_posted) - new Date(a.date_posted));
    }

    if (!items.length) {
      if (!feedReady) return;
      if (!listings.length && isOffline()) {
        renderFeedError(true);
        return;
      }
      feed.className = "empty";
      feed.innerHTML = `
        <div>${t("feed_empty")}</div>
        <button type="button" class="empty-btn" id="emptyPostBtn">${t("post_listing")}</button>`;
      document.getElementById("emptyPostBtn")?.addEventListener("click", () => {
        if (!zmRequireLogin("/post-listing.html")) return;
        window.location.href = "/post-listing.html";
      });
      updateLoadMoreButton();
      updateSaveSearchBar();
      return;
    }

    feed.className = "grid";
    feed.innerHTML = items.map(renderCard).join("");

    items.forEach(item => {
      const card = document.getElementById(`card-${item.id}`);
      if (card) card.addEventListener("click", () => {
        if (typeof zmPrefetchListing === "function") zmPrefetchListing(item.id, item);
        if (typeof zmShowNavLoading === "function") zmShowNavLoading();
        window.location.href = `/listing.html?id=${item.id}`;
      });
    });
    feed.querySelectorAll(".fav-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        toggleFavorite(btn.dataset.id, btn);
      });
    });
    feed.querySelectorAll("[data-share-id]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        const item = listings.find((row) => String(row.id) === String(btn.dataset.shareId));
        if (item && typeof openListingShareSheet === "function") openListingShareSheet(item);
      });
    });
    observeLazyImages(feed);
    updateLoadMoreButton();
    updateSaveSearchBar();
  }

    favoriteIds = new Set();
    if (!isLoggedIn()) return;
    try {

      const res = await fetch(`${API_URL}/favorites`, {
        headers: { Authorization: `Bearer ${token}` },

      if (!res.ok) return;
      const favorites = await res.json();
      favoriteIds = new Set(favorites.map((item) => String(item.id)));

  async function toggleFavorite(listingId, btn) {
    if (!zmRequireLogin()) return;
    const id = String(listingId);
    const token = localStorage.getItem("zm_token");
    const wasFav = favoriteIds.has(id);
    try {
      const res = await fetch(`${API_URL}/favorites/${listingId}`, {
        method: wasFav ? "DELETE" : "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      if (!res.ok) {
        alert(t("cant_update_favorite"));
        return;
      }
      if (wasFav) favoriteIds.delete(id);
      else favoriteIds.add(id);
      const saved = favoriteIds.has(id);
      btn.innerHTML = heartIcon(saved);
      btn.setAttribute("aria-pressed", saved ? "true" : "false");
      btn.setAttribute("aria-label", saved ? t("saved_listing") : t("save_listing"));
    } catch (e) {
      alert(t("cant_update_favorite"));
    }
  }

  });
  window.addEventListener("online", () => {
    if (!listings.length || feed.classList.contains("offline") || feed.classList.contains("error")) {
      loadListings(true);
    }
  });
  window.addEventListener("offline", () => {
    if (!listings.length && !showCachedFeedAny()) renderFeedError(true);
  });

</script>
</body>
</html>
